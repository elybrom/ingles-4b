html,body{font-family:'DM Sans',system-ui,-apple-system,sans-serif!important;color:var(--ink);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
html{background:#FBF4EE!important;min-height:100%}
html body{min-height:100vh;background-color:#FBF4EE!important;background-image:radial-gradient(1200px 500px at 110% -10%,rgba(246,203,211,.45),transparent 60%),radial-gradient(900px 500px at -20% 110%,rgba(217,203,234,.35),transparent 60%)!important;background-attachment:fixed!important}
h1,h2,h3,.base h2,.card h2,#top h1,.dhead b,.lt{font-family:'Fraunces',Georgia,serif!important;font-weight:600!important;letter-spacing:-.02em!important;color:var(--ink)}
h1{font-size:clamp(28px,8vw,36px)!important;line-height:1.02!important}

.tag{font-family:'DM Sans',sans-serif!important;font-weight:700!important;letter-spacing:.14em!important;font-size:10.5px!important}

.sk{stroke-width:1.5!important}

.base{background:#FFFDFB!important;border-bottom:1.5px dashed var(--pink)!important}

/* botones */
.btn,a.btn{border:0!important;background:var(--ink)!important;color:#FFF6F3!important;border-radius:999px!important;font-weight:600!important;box-shadow:0 6px 16px -8px rgba(46,34,48,.55)!important;transition:transform .15s ease,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn.sec2,.btn.ok{background:#FFFDFB!important;color:var(--ink)!important;border:1.5px solid var(--ink)!important;box-shadow:none!important}
.btn.done{background:var(--b-sage)!important;color:#fff!important;border-color:var(--b-sage)!important}
.au{border:0!important;background:var(--blush)!important;color:var(--b-deep)!important;box-shadow:inset 0 0 0 1.5px rgba(194,87,122,.35)!important;transition:transform .15s}

.au.play,.au.say{background:var(--b-deep)!important;color:#fff!important;animation:bl-ring 1.1s ease-out infinite}
@keyframes bl-ring{0%{box-shadow:0 0 0 0 rgba(194,87,122,.5)}100%{box-shadow:0 0 0 12px rgba(194,87,122,0)}}
.pill,.les button,.tabs2 button{border:1.5px solid #EBCFCC!important;background:#FFFDFB!important;color:var(--ink)!important;font-weight:600!important;transition:all .2s}
.pill.on,.les button.on,.tabs2 button.on{background:var(--ink)!important;color:#FFF6F3!important;border-color:var(--ink)!important}
.opts button{border:1.5px solid #EBCFCC!important;background:#FFFDFB!important;border-radius:16px!important;transition:transform .15s,background .2s}
.opts button:active{transform:scale(.98)}
.opts button.ok{background:var(--ok)!important;border-color:var(--b-sage)!important;animation:bl-pop .4s}
.opts button.no{background:var(--red-soft)!important;border-color:var(--red)!important;animation:bl-shake .4s}
@keyframes bl-pop{50%{transform:scale(1.04)}}
@keyframes bl-shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bar{background:var(--sand)!important;height:10px!important;border-radius:9px!important}
.bar i{background:linear-gradient(90deg,var(--pink),var(--b-deep))!important;transition:width .5s cubic-bezier(.2,.8,.2,1)}
textarea{border:1.5px solid #EBCFCC!important;border-radius:16px!important;background-color:#FFFDFB!important}

new MutationObserver(fit).observe(document.getElementById('ov'),{childList:true});fit();})();</script><script>(function(){var M={"1": {"tr": [["Reading and Listening", "Lectura y comprensión auditiva"]]}, "2": {"tr": [["Reading and Listening Comprehension", "Comprensión de lectura y auditiva"], ["Welcome to 5A. In this level you will find several interesting subjects to help you develop your listening skills.", "Bienvenido a 5A. En este nivel encontrarás varios temas interesantes que te ayudarán a desarrollar tu comprensión auditiva."], ["Get ready to increase your vocabulary while you learn more about words similar in meaning, life in Mexico City, how to balance your diet, and one of the finest literary masterpieces of all times.", "Prepárate para aumentar tu vocabulario mientras aprendes más sobre palabras de significado parecido, la vida en la Ciudad de México, cómo balancear tu dieta y una de las mejores obras maestras de la literatura de todos los tiempos."], ["We are sure you will find this a great experience, so keep your ears open and have lots of fun!", "Estamos seguros de que será una gran experiencia, así que mantén los oídos bien abiertos y diviértete mucho."]]}, "4": {"tr": [["Color Chart / Introduction", "Color Chart / Introducción"], ["Synonyms are different words which express the same or nearly the same idea.", "Los sinónimos son palabras distintas que expresan la misma idea o casi la misma."], ["For example, the words \"old\" and \"ancient\" have nearly the same meaning, which is generally the opposite idea of what the words \"new\" and \"young\" represent; therefore, we can say the words \"old\" and \"ancient\" are synonyms and the words \"new\" and \"young\" are their antonyms.", "Por ejemplo, \"old\" y \"ancient\" significan casi lo mismo, y en general es la idea contraria a lo que representan \"new\" y \"young\"; por lo tanto, podemos decir que \"old\" y \"ancient\" son sinónimos y que \"new\" y \"young\" son sus antónimos."], ["Although synonyms are similar in meaning, we should keep in mind they are not exactly the same.", "Aunque los sinónimos tienen un significado parecido, hay que tener en cuenta que no son exactamente iguales."], ["For example, \"old\" can be applied to people advanced in age (an old man), or applied to things not recent or modern (some old clothes).", "Por ejemplo, \"old\" se aplica a personas de edad avanzada (un señor mayor) o a cosas que no son recientes ni modernas (ropa vieja)."], ["In contrast, \"ancient\" is used to describe something that has existed for many years (an ancient tree), or something related to a time early in history (an ancient civilization).", "En cambio, \"ancient\" describe algo que existe desde hace muchísimos años (un árbol milenario) o algo de una época muy antigua de la historia (una civilización antigua)."], ["Likewise, the antonyms of \"old\" and \"ancient\" have special considerations.", "Asimismo, los antónimos de \"old\" y \"ancient\" tienen sus particularidades."], ["\"New\" is generally applied to things recent or modern (a new car), but when describing people \"young\" is the best option (a young lady).", "\"New\" se aplica en general a cosas recientes o modernas (un coche nuevo), pero para describir personas la mejor opción es \"young\" (una muchacha joven)."], ["In the coming lessons you will increase your vocabulary by learning more about the effective use of synonyms in the English language.", "En las próximas lecciones vas a aumentar tu vocabulario aprendiendo a usar bien los sinónimos en inglés."], ["Vocabulary", "Vocabulario"], ["synonyms = sinónimos", "Significa: sinónimos"], ["\"Old\" and \"ancient\" are synonyms.", "\"Old\" y \"ancient\" son sinónimos."], ["nearly = casi", "Significa: casi"], ["Synonyms have nearly the same meaning.", "Los sinónimos tienen casi el mismo significado."], ["ancient = antiguo", "Significa: antiguo"], ["Teotihuacan is an ancient city.", "Teotihuacan es una ciudad antigua."], ["therefore = por lo tanto", "Significa: por lo tanto"], ["It was raining; therefore, we stayed home.", "Estaba lloviendo; por lo tanto, nos quedamos en casa."], ["antonyms = antónimos", "Significa: antónimos"], ["\"New\" and \"old\" are antonyms.", "\"New\" y \"old\" son antónimos."], ["applied = aplicado", "Significa: aplicado"], ["\"Old\" can be applied to people.", "\"Old\" se puede aplicar a personas."], ["modern = moderno", "Significa: moderno"], ["My phone is very modern.", "Mi celular es muy moderno."], ["likewise = asimismo", "Significa: asimismo"], ["Likewise, \"young\" is the opposite of \"old\".", "Asimismo, \"young\" es lo contrario de \"old\"."], ["increase = aumentar", "Significa: aumentar"], ["I want to increase my vocabulary.", "Quiero aumentar mi vocabulario."], ["language = idioma", "Significa: idioma"], ["English is a useful language.", "El inglés es un idioma útil."]]}, "5": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["leap = saltar", "Significa: saltar"], ["The frog can leap very far.", "La rana puede saltar muy lejos."], ["hurdle = saltar una valla", "Significa: saltar una valla"], ["The athlete hurdles the obstacles.", "El atleta salta los obstáculos."], ["ant = hormiga", "Significa: hormiga"], ["An ant is a tiny insect.", "Una hormiga es un insecto diminuto."], ["tiny = diminuto", "Significa: diminuto"], ["The baby has tiny hands.", "El bebé tiene manos diminutas."], ["teeny = chiquitito", "Significa: chiquitito"], ["Look at that teeny puppy!", "¡Mira ese perrito chiquitito!"], ["meaning = significado", "Significa: significado"], ["What is the meaning of this word?", "¿Cuál es el significado de esta palabra?"], ["kids = niños", "Significa: niños"], ["The kids are playing in the park.", "Los niños están jugando en el parque."], ["chuckle = reírse entre dientes", "Significa: reírse entre dientes"], ["He chuckled at the joke.", "Se rio entre dientes con el chiste."], ["giggle = reírse tontamente", "Significa: reírse tontamente"], ["The girls giggle in class.", "Las niñas se ríen en clase."], ["scared = asustado", "Significa: asustado"], ["The boy was scared of the dog.", "El niño le tenía miedo al perro."]]}, "6": {"tr": [["Vocabulary", "Vocabulario"], ["frightened = atemorizado", "Significa: atemorizado"], ["The kids were frightened by the movie.", "Los niños se asustaron con la película."], ["terrified = aterrado", "Significa: aterrado"], ["She was terrified of the storm.", "Estaba aterrada por la tormenta."], ["hide = esconder", "Significa: esconder"], ["He hides his money under the bed.", "Esconde su dinero debajo de la cama."], ["treasure = tesoro", "Significa: tesoro"], ["The pirates are looking for treasure.", "Los piratas buscan un tesoro."], ["no one = nadie", "Significa: nadie"], ["No one knows the answer.", "Nadie sabe la respuesta."], ["find = encontrar", "Significa: encontrar"], ["I can't find my keys.", "No encuentro mis llaves."], ["discover = descubrir", "Significa: descubrir"], ["The archaeologist discovered a city.", "El arqueólogo descubrió una ciudad."], ["locate = localizar", "Significa: localizar"], ["Can you locate Mexico on the map?", "¿Puedes ubicar México en el mapa?"], ["throw = lanzar", "Significa: lanzar"], ["Throw me the ball, please.", "Lánzame la pelota, por favor."], ["football = balón de fútbol americano", "Significa: balón de fútbol americano"], ["He can throw a football very far.", "Puede lanzar un balón de americano muy lejos."], ["toss = aventar suavemente", "Significa: aventar suavemente"], ["Toss the ball to your sister.", "Avienta la pelota a tu hermana."], ["hurl = lanzar con fuerza", "Significa: lanzar con fuerza"], ["He hurled the ball across the field.", "Lanzó la pelota al otro lado del campo."], ["ran into = corrió hacia / se metió", "Significa: corrió hacia / se metió"], ["The little boy ran into the ocean.", "El niño se metió corriendo al mar."]]}, "7": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["antique = antigüedad", "Significa: antigüedad"], ["My grandma has an antique table.", "Mi abuela tiene una mesa antigua."], ["automobile = automóvil", "Significa: automóvil"], ["An automobile is a car.", "Un automóvil es un coche."], ["vehicle = vehículo", "Significa: vehículo"], ["There are many vehicles on the road.", "Hay muchos vehículos en el camino."], ["wonder = preguntarse", "Significa: preguntarse"], ["I wonder where he is.", "Me pregunto dónde está."], ["vacant = desocupado", "Significa: desocupado"], ["The apartment is vacant.", "El departamento está desocupado."], ["unoccupied = desocupado", "Significa: desocupado"], ["That seat is unoccupied.", "Ese asiento está desocupado."], ["climb = escalar", "Significa: escalar"], ["They climb the mountain every year.", "Escalan la montaña cada año."], ["mountains = montañas", "Significa: montañas"], ["Mexico has beautiful mountains.", "México tiene montañas hermosas."], ["scale = escalar", "Significa: escalar"], ["He is scaling the mountain.", "Está escalando la montaña."], ["ascend = ascender, subir", "Significa: ascender, subir"], ["We ascend the stairs to the third floor.", "Subimos las escaleras al tercer piso."]]}, "8": {"tr": [["Vocabulary", "Vocabulario"], ["stated = afirmó", "Significa: afirmó"], ["He stated that he was innocent.", "Afirmó que era inocente."], ["declared = declaró", "Significa: declaró"], ["The judge declared him free.", "El juez lo declaró libre."], ["announced = anunció", "Significa: anunció"], ["She announced the winner.", "Anunció al ganador."], ["inquired = preguntó, indagó", "Significa: preguntó, indagó"], ["The lawyer inquired about the thief.", "El abogado preguntó por el ladrón."], ["questioned = interrogó", "Significa: interrogó"], ["The students questioned the teacher.", "Los alumnos le hicieron preguntas al maestro."], ["narrator = narrador", "Significa: narrador"], ["The narrator tells the story.", "El narrador cuenta la historia."], ["film = película", "Significa: película"], ["We watched a great film.", "Vimos una gran película."], ["enjoyed = disfrutó", "Significa: disfrutó"], ["I enjoyed the movie a lot.", "Disfruté mucho la película."]]}, "9": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Listening Practice: For each item, you will hear 4 ideas. Consider which one best describes the image shown on the screen, and circle the letter of the answer (a, b, c, or d) in your Student's Book.", "Práctica auditiva: en cada número vas a escuchar 4 ideas. Piensa cuál describe mejor la imagen que aparece en la pantalla y encierra la letra de la respuesta (a, b, c o d) en tu libro."], ["1.- a) Two men are climbing.", "1.- a) Dos hombres están escalando."], ["b) He is walking up the stairs.", "b) Él va subiendo las escaleras."], ["c) There is a man scaling the mountain.", "c) Hay un hombre escalando la montaña."], ["d) She doesn't know where to go.", "d) Ella no sabe a dónde ir."], ["2.- a) The woman is saying something.", "2.- a) La mujer está diciendo algo."], ["b) Both are writing on a paper.", "b) Los dos están escribiendo en un papel."], ["c) The man is shouting at her.", "c) El hombre le está gritando."], ["d) These people are ready to go.", "d) Estas personas están listas para irse."], ["3.- a) There are three men playing baseball.", "3.- a) Hay tres hombres jugando beisbol."], ["b) Someone will throw a football.", "b) Alguien va a lanzar un balón de americano."], ["c) He is going to hurdle something.", "c) Va a saltar un obstáculo."], ["d) Two men are running away quickly.", "d) Dos hombres se van corriendo rápido."], ["4.- a) That lady is enjoying her food.", "4.- a) Esa señora está disfrutando su comida."], ["b) She has finished eating her lunch.", "b) Ya terminó de comer."], ["c) There's something for dessert.", "c) Hay algo de postre."], ["d) She doesn't like what she is eating.", "d) No le gusta lo que está comiendo."], ["5.- a) Nobody knows the answer.", "5.- a) Nadie sabe la respuesta."], ["b) Two boys are taking class.", "b) Dos niños están tomando clase."], ["c) A boy and a girl are leaving the classroom.", "c) Un niño y una niña están saliendo del salón."], ["d) Two students want to answer the question.", "d) Dos alumnos quieren contestar la pregunta."], ["6.- a) There are more than three vehicles on the road.", "6.- a) Hay más de tres vehículos en el camino."], ["b) Three cars are parking in the street.", "b) Tres coches se están estacionando en la calle."], ["c) An orange car is coming.", "c) Viene un coche naranja."], ["d) Those cars have passed the trucks.", "d) Esos coches ya rebasaron a los camiones."], ["7.- a) A man is standing by the stones.", "7.- a) Un hombre está parado junto a las piedras."], ["b) Someone is hiding a treasure.", "b) Alguien está escondiendo un tesoro."], ["c) The archaeologist discovered something.", "c) El arqueólogo descubrió algo."], ["d) He is looking at his notes.", "d) Está viendo sus apuntes."], ["8.- a) Two people are hurling.", "8.- a) Dos personas están lanzando con fuerza."], ["b) She is training for a football game.", "b) Ella está entrenando para un partido de americano."], ["c) A lady is jumping over a vehicle.", "c) Una señora está saltando sobre un vehículo."], ["d) The coach is watching her hurdle.", "d) El entrenador la está viendo saltar las vallas."], ["9.- a) The kids are playing with a green ball.", "9.- a) Los niños están jugando con una pelota verde."], ["b) There is a big fish on the beach.", "b) Hay un pez grande en la playa."], ["c) No one is playing with that little kid.", "c) Nadie está jugando con ese niño."], ["d) The little boy ran into the ocean.", "d) El niño se metió corriendo al mar."], ["10.- a) The road is full of ancient cars.", "10.- a) El camino está lleno de coches antiguos."], ["b) Only some of the vehicles are white.", "b) Solo algunos de los vehículos son blancos."], ["c) Traffic is not a problem.", "c) El tráfico no es problema."], ["d) No one is driving slowly.", "d) Nadie va manejando despacio."]], "notes": ["La respuesta depende de la imagen que proyecta tu teacher en la pantalla; escucha las 4 ideas y elige la que la describe."]}, "10": {"tr": [["11.- a) He said he is leaving.", "11.- a) Dijo que se va."], ["b) He announced something sad.", "b) Anunció algo triste."], ["c) A man behind him is laughing.", "c) Un hombre detrás de él se está riendo."], ["d) He is speaking in front of people.", "d) Está hablando frente a la gente."], ["12.- a) Many kids are doing their homework.", "12.- a) Muchos niños están haciendo su tarea."], ["b) These children have dirty uniforms.", "b) Estos niños tienen el uniforme sucio."], ["c) Men and women exercise at the gym.", "c) Hombres y mujeres hacen ejercicio en el gimnasio."], ["d) Some children are having fun.", "d) Unos niños se están divirtiendo."], ["13.- a) She is holding an empty glass.", "13.- a) Ella tiene en la mano un vaso vacío."], ["b) Oranges are good for you.", "b) Las naranjas son buenas para ti."], ["c) Her glass is full of liquid.", "c) Su vaso está lleno de líquido."], ["d) She needs more orange juice.", "d) Necesita más jugo de naranja."], ["14.- a) A tiny building has no room.", "14.- a) Un edificio diminuto no tiene espacio."], ["b) There are three empty rooms.", "b) Hay tres cuartos vacíos."], ["c) This is a vacant apartment.", "c) Este es un departamento desocupado."], ["d) The apartment door is locked.", "d) La puerta del departamento está cerrada con llave."], ["15.- a) The ball is too big to win.", "15.- a) La pelota es demasiado grande para ganar."], ["b) The boy will toss a red ball to the girl.", "b) El niño le va a aventar una pelota roja a la niña."], ["c) His ball is going to break a window.", "c) Su pelota va a romper una ventana."], ["d) The girl cannot see where the ball went.", "d) La niña no ve a dónde se fue la pelota."], ["Each of the following ideas has an underlined word. From the options (a, b, c, or d) choose the correct synonym and underline it.", "Cada una de las siguientes ideas tiene una palabra subrayada. De las opciones (a, b, c o d), elige el sinónimo correcto y subráyalo."], ["1.- Those athletes are jumping the obstacles very quickly. a) running b) passing c) hurdling d) walking", "1.- Esos atletas están saltando los obstáculos muy rápido. a) corriendo b) pasando c) saltando vallas d) caminando"], ["2.- Oh! You have a beautiful small baby. a) teeny b) curious c) big d) little", "2.- ¡Ay! Tienes un bebé pequeño y precioso. a) chiquitito b) curioso c) grande d) pequeño"], ["3.- After the joke, he couldn't laugh aloud, so he just chuckled softly. a) cried b) giggled c) shouted d) smiled", "3.- Después del chiste no pudo reírse en voz alta, así que solo se rio bajito. a) lloró b) se rio con risita c) gritó d) sonrió"], ["4.- That player has a lot of speed in his arm. He can definitely throw that ball. a) hurl b) pass c) toss d) push", "4.- Ese jugador tiene mucha velocidad en el brazo. Definitivamente puede lanzar esa pelota. a) lanzar con fuerza b) pasar c) aventar suave d) empujar"], ["5.- I've been looking for my sweater all morning, but I can't find it. a) see b) discover c) hide d) locate", "5.- Llevo toda la mañana buscando mi suéter, pero no lo encuentro. a) ver b) descubrir c) esconder d) localizar"]]}, "11": {"tr": [["6.- If you want to reach the third floor, you have to go up the stairs. a) assume b) ascend c) scale d) descend", "6.- Si quieres llegar al tercer piso, tienes que subir las escaleras. a) suponer b) ascender c) escalar d) descender"], ["7.- The lawyer asked about all the things the thief took. a) told b) accused c) inquired d) surprised", "7.- El abogado preguntó por todas las cosas que se llevó el ladrón. a) dijo b) acusó c) indagó d) sorprendió"], ["8.- Mr. Jones was happy when the Doctor told him it was his final treatment of the year. a) first b) routine c) end d) last", "8.- El señor Jones se puso feliz cuando el doctor le dijo que era su último tratamiento del año. a) primero b) de rutina c) fin d) último"], ["9.- Everybody was surprised when the old lady ran the competition. a) ancient b) young c) antique d) beautiful", "9.- Todos se sorprendieron cuando la señora mayor corrió en la competencia. a) antigua b) joven c) antigua (objeto) d) hermosa"], ["10.- I was dialing Betty's number, but her line was occupied. a) ringing b) busy c) not working d) off", "10.- Estaba marcando el número de Betty, pero su línea estaba ocupada. a) sonando b) ocupada c) sin servicio d) apagada"], ["11.- At Christmas time, stores are full of people buying many gifts. a) selling b) looking c) purchasing d) taking", "11.- En Navidad las tiendas están llenas de gente comprando muchos regalos. a) vendiendo b) mirando c) adquiriendo d) tomando"], ["12.- When the soccer game was over, the winning team got a trophy. a) started b) finished c) beginning d) late", "12.- Cuando terminó el partido de futbol, el equipo ganador recibió un trofeo. a) empezó b) terminó c) comenzando d) tarde"], ["13.- Chris and Susan are sure they will find an empty apartment soon. a) full b) occupied c) ugly d) unoccupied", "13.- Chris y Susan están seguros de que pronto encontrarán un departamento vacío. a) lleno b) ocupado c) feo d) desocupado"], ["14.- All the students in the classroom questioned the teacher for their test scores. a) asked b) said c) stated d) wanted", "14.- Todos los alumnos del salón le preguntaron al maestro por sus calificaciones. a) preguntaron b) dijeron c) afirmaron d) quisieron"], ["15.- The kids were frightened after watching the scary movie. a) laughing b) nervous c) careful d) terrified", "15.- Los niños quedaron asustados después de ver la película de terror. a) riéndose b) nerviosos c) cuidadosos d) aterrados"]], "notes": ["Synonym = misma idea (old = ancient). Antonym = idea contraria (old ≠ new).", "little / tiny / teeny = pequeño · scared / frightened / terrified = asustado", "laugh / giggle / chuckle = reír · throw / toss / hurl = lanzar", "find / discover / locate = encontrar · climb / scale / ascend = subir", "empty / vacant / unoccupied = vacío · ask / inquire / question = preguntar"]}, "12": {"tr": [["Following your teacher's directions, write a short composition about \"synonyms\".", "Siguiendo las instrucciones de tu teacher, escribe una composición corta sobre los \"sinónimos\"."], ["INTRODUCTION / BODY / CONCLUSION", "INTRODUCCIÓN / DESARROLLO / CONCLUSIÓN"]]}, "13": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Miguel de Cervantes Saavedra was born in Alcalá de Henares, near Madrid.", "Miguel de Cervantes Saavedra nació en Alcalá de Henares, cerca de Madrid."], ["During his life, he wrote many novels and plays. Don Quixote is the most famous novel that he wrote.", "A lo largo de su vida escribió muchas novelas y obras de teatro. El Quijote es la novela más famosa que escribió."], ["It was first published in 1605, and is still considered one of the most influential works of classical literature.", "Se publicó por primera vez en 1605 y todavía se considera una de las obras más influyentes de la literatura clásica."], ["The novel Don Quixote tells the story of Alonso Quijana, a thin country gentleman who reads many books.", "La novela del Quijote cuenta la historia de Alonso Quijana, un hidalgo de provincia, flaco, que lee muchos libros."], ["He begins to believe he's living in an imaginary world, changes his name to \"Don Quixote de La Mancha\", and starts on a journey to find adventure with the help of his friend Sancho Panza.", "Empieza a creer que vive en un mundo imaginario, se cambia el nombre a \"Don Quijote de La Mancha\" y emprende un viaje en busca de aventuras con la ayuda de su amigo Sancho Panza."], ["Don Quixote has an interesting vision of the things happening around him.", "Don Quijote tiene una visión curiosa de lo que pasa a su alrededor."], ["He fights imaginary battles to make the world a better place, but the people he intends to help say that he is crazy.", "Pelea batallas imaginarias para hacer del mundo un lugar mejor, pero la gente a la que quiere ayudar dice que está loco."], ["Prepare yourself to see and hear this fantastic story now in English, and improve your speaking and listening skills along the way.", "Prepárate para ver y escuchar esta historia fantástica ahora en inglés, y mejora tu expresión oral y tu comprensión auditiva en el camino."], ["Vocabulary", "Vocabulario"], ["novels = novelas", "Significa: novelas"], ["Cervantes wrote many novels.", "Cervantes escribió muchas novelas."], ["published = publicado", "Significa: publicado"], ["Don Quixote was published in 1605.", "El Quijote se publicó en 1605."], ["influential = influyente", "Significa: influyente"], ["It is one of the most influential books.", "Es uno de los libros más influyentes."], ["classical literature = literatura clásica", "Significa: literatura clásica"], ["Don Quixote is classical literature.", "El Quijote es literatura clásica."], ["country = campo, de provincia", "Significa: campo, de provincia"], ["Alonso was a country gentleman.", "Alonso era un hidalgo de provincia."], ["journey = viaje, travesía", "Significa: viaje, travesía"], ["He started a long journey.", "Empezó un viaje largo."]]}, "14": {"tr": [["Vocabulary", "Vocabulario"], ["adventure = aventura", "Significa: aventura"], ["He wanted to find adventure.", "Quería encontrar aventuras."], ["vision = visión", "Significa: visión"], ["Don Quixote had a strange vision.", "Don Quijote tuvo una visión extraña."], ["battles = batallas", "Significa: batallas"], ["He fights imaginary battles.", "Pelea batallas imaginarias."], ["improve = mejorar", "Significa: mejorar"], ["I want to improve my English.", "Quiero mejorar mi inglés."], ["listening skills = habilidad para escuchar", "Significa: habilidad para escuchar"], ["Videos improve your listening skills.", "Los videos mejoran tu comprensión auditiva."], ["along the way = en el camino", "Significa: en el camino"], ["You will learn new words along the way.", "Aprenderás palabras nuevas en el camino."], ["stories = historias, cuentos", "Significa: historias, cuentos"], ["He reads stories about knights.", "Lee historias de caballeros."], ["knights = caballeros", "Significa: caballeros"], ["Knights protected the people.", "Los caballeros protegían a la gente."], ["brave = valiente", "Significa: valiente"], ["The knight was very brave.", "El caballero era muy valiente."], ["noble = noble", "Significa: noble"], ["He had a noble heart.", "Tenía un corazón noble."], ["armor = armadura", "Significa: armadura"], ["The knight wears armor.", "El caballero usa armadura."]]}, "15": {"tr": [["Vocabulary", "Vocabulario"], ["helmets = cascos", "Significa: cascos"], ["Football players wear helmets.", "Los jugadores de americano usan casco."], ["trouble = problema, apuro", "Significa: problema, apuro"], ["Superheroes save people in trouble.", "Los superhéroes salvan a gente en apuros."], ["saved = salvó", "Significa: salvó"], ["The knight saved the princess.", "El caballero salvó a la princesa."], ["giants = gigantes", "Significa: gigantes"], ["He thought the windmills were giants.", "Pensó que los molinos eran gigantes."], ["wicked = malvado", "Significa: malvado"], ["The wicked wizard laughed.", "El mago malvado se rio."], ["wizards = magos, hechiceros", "Significa: magos, hechiceros"], ["Wizards use magic.", "Los magos usan magia."], ["attacked = atacó", "Significa: atacó"], ["He attacked the windmills.", "Atacó los molinos de viento."], ["lances = lanzas", "Significa: lanzas"], ["Knights fought with lances.", "Los caballeros peleaban con lanzas."], ["swords = espadas", "Significa: espadas"], ["The soldiers had swords.", "Los soldados tenían espadas."], ["decided = decidió", "Significa: decidió"], ["He decided to become a knight.", "Decidió convertirse en caballero."], ["become = convertirse en", "Significa: convertirse en"], ["He wanted to become a knight.", "Quería convertirse en caballero."], ["fight = pelear", "Significa: pelear"], ["Knights fight for justice.", "Los caballeros luchan por la justicia."], ["justice = justicia", "Significa: justicia"], ["He fought for justice.", "Luchó por la justicia."]]}, "16": {"tr": [["Vocabulary", "Vocabulario"], ["found = encontró", "Significa: encontró"], ["He found an old suit of armor.", "Encontró una armadura vieja."], ["suit of armor = armadura", "Significa: armadura"], ["He put on a suit of armor.", "Se puso una armadura."], ["squire = escudero", "Significa: escudero"], ["Sancho Panza was his squire.", "Sancho Panza era su escudero."], ["named = llamado", "Significa: llamado"], ["He had a horse named Rocinante.", "Tenía un caballo llamado Rocinante."], ["rode = montó, cabalgó", "Significa: montó, cabalgó"], ["Sancho rode a donkey.", "Sancho montaba un burro."], ["donkey = burro", "Significa: burro"], ["The donkey was small and slow.", "El burro era pequeño y lento."]]}, "17": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["castles = castillos", "Significa: castillos"], ["Kings lived in castles.", "Los reyes vivían en castillos."], ["arrived = llegó", "Significa: llegó"], ["They arrived at an inn.", "Llegaron a una posada."], ["farm = granja", "Significa: granja"], ["Animals live on the farm.", "Los animales viven en la granja."], ["lord = señor (noble)", "Significa: señor (noble)"], ["The lord of the castle was rich.", "El señor del castillo era rico."], ["farmers = granjeros", "Significa: granjeros"], ["The farmers work hard.", "Los granjeros trabajan duro."], ["barn = granero", "Significa: granero"], ["Cows sleep in the barn.", "Las vacas duermen en el granero."], ["hay = paja, heno", "Significa: paja, heno"], ["The horse eats hay.", "El caballo come paja."], ["elegant = elegante", "Significa: elegante"], ["The castle was elegant.", "El castillo era elegante."], ["touches = toca", "Significa: toca"], ["He touches his shoulder.", "Le toca el hombro."], ["shoulders = hombros", "Significa: hombros"], ["He has strong shoulders.", "Tiene hombros fuertes."]]}, "18": {"tr": [["Vocabulary", "Vocabulario"], ["windmills = molinos de viento", "Significa: molinos de viento"], ["He attacked the windmills.", "Atacó los molinos de viento."], ["begins = comienza", "Significa: comienza"], ["The story begins in La Mancha.", "La historia comienza en La Mancha."], ["wind = viento", "Significa: viento"], ["The wind moves the blades.", "El viento mueve las aspas."], ["blades = aspas", "Significa: aspas"], ["The blades of the windmill turn.", "Las aspas del molino giran."], ["ground = suelo", "Significa: suelo"], ["He fell to the ground.", "Se cayó al suelo."]]}, "19": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["forest = bosque", "Significa: bosque"], ["They walked through the forest.", "Caminaron por el bosque."], ["dust = polvo", "Significa: polvo"], ["There was a lot of dust on the road.", "Había mucho polvo en el camino."], ["army = ejército", "Significa: ejército"], ["He thought the sheep were an army.", "Pensó que las ovejas eran un ejército."], ["flocks = rebaños", "Significa: rebaños"], ["Two flocks of sheep came down the road.", "Dos rebaños de ovejas venían por el camino."], ["sheep = ovejas", "Significa: ovejas"], ["The sheep eat grass.", "Las ovejas comen pasto."], ["throwing = lanzando", "Significa: lanzando"], ["The shepherds were throwing stones.", "Los pastores estaban aventando piedras."], ["stones = piedras", "Significa: piedras"], ["They threw stones at him.", "Le aventaron piedras."], ["gather = reunir", "Significa: reunir"], ["Let's gather the animals.", "Reunamos a los animales."], ["armies = ejércitos", "Significa: ejércitos"], ["He imagined two armies.", "Se imaginó dos ejércitos."], ["resting = descansando", "Significa: descansando"], ["They were resting under a tree.", "Estaban descansando bajo un árbol."]]}, "20": {"tr": [["Vocabulary", "Vocabulario"], ["cart = carreta", "Significa: carreta"], ["A cart full of lions came by.", "Pasó una carreta llena de leones."], ["master = amo", "Significa: amo"], ["Sancho followed his master.", "Sancho seguía a su amo."], ["squeezed = exprimió", "Significa: exprimió"], ["He squeezed the cheese.", "Exprimió el queso."], ["liquid = líquido", "Significa: líquido"], ["Her glass is full of liquid.", "Su vaso está lleno de líquido."], ["drip = gotear", "Significa: gotear"], ["The milk started to drip.", "La leche empezó a gotear."], ["brain = cerebro", "Significa: cerebro"], ["He thought his brain was melting.", "Pensó que su cerebro se derretía."], ["melting = derritiéndose", "Significa: derritiéndose"], ["The ice cream is melting.", "El helado se está derritiendo."], ["truth = verdad", "Significa: verdad"], ["Tell me the truth.", "Dime la verdad."], ["spend the night = pasar la noche", "Significa: pasar la noche"], ["We spend the night in the forest.", "Pasamos la noche en el bosque."], ["falls off = se cae de", "Significa: se cae de"], ["He falls off his horse.", "Se cae de su caballo."], ["down the road = más adelante en el camino", "Significa: más adelante en el camino"], ["Down the road, there was an inn.", "Más adelante había una posada."], ["puts it on = se lo pone", "Significa: se lo pone"], ["He takes the helmet and puts it on.", "Toma el casco y se lo pone."]]}, "21": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["cages = jaulas", "Significa: jaulas"], ["The lions were in cages.", "Los leones estaban en jaulas."], ["lions = leones", "Significa: leones"], ["The lions were hungry.", "Los leones tenían hambre."], ["trap = trampa", "Significa: trampa"], ["It was a trap.", "Era una trampa."], ["kill = matar", "Significa: matar"], ["He wanted to kill the lions.", "Quería matar a los leones."], ["guiding = guiando", "Significa: guiando"], ["Men were guiding some bulls.", "Unos hombres guiaban toros."], ["bulls = toros", "Significa: toros"], ["The bulls ran down the road.", "Los toros corrieron por el camino."], ["enemies = enemigos", "Significa: enemigos"], ["He fights with his enemies.", "Pelea con sus enemigos."], ["dangerous = peligroso", "Significa: peligroso"], ["Football is a dangerous sport.", "El americano es un deporte peligroso."], ["common = común", "Significa: común"], ["It is a common name.", "Es un nombre común."], ["wrong = incorrecto, mal", "Significa: incorrecto, mal"], ["Something is wrong.", "Algo está mal."]]}, "22": {"tr": [["Vocabulary", "Vocabulario"], ["gets off = se baja de", "Significa: se baja de"], ["He gets off his horse.", "Se baja de su caballo."], ["come out = salir", "Significa: salir"], ["Come out of the cage!", "¡Sal de la jaula!"], ["moves around = se mueve por ahí", "Significa: se mueve por ahí"], ["The lion moves around.", "El león se mueve de un lado a otro."], ["sticks his head out = saca la cabeza", "Significa: saca la cabeza"], ["The lion sticks his head out.", "El león saca la cabeza."], ["goes back = regresa", "Significa: regresa"], ["The lion goes back inside.", "El león vuelve a entrar."], ["run over = atropellar, pasar por encima", "Significa: atropellar, pasar por encima"], ["The bulls run over him.", "Los toros le pasan por encima."]]}, "23": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Directions: For each item, you will hear 4 ideas. Consider which one best describes the image shown on the screen, and circle the letter of the answer (a, b, c, or d) in your Student's Book.", "Instrucciones: en cada número vas a escuchar 4 ideas. Piensa cuál describe mejor la imagen que aparece en la pantalla y encierra la letra de la respuesta (a, b, c o d) en tu libro."], ["1.- a) The little boy is swimming.", "1.- a) El niño está nadando."], ["b) He is catching some fish.", "b) Está pescando."], ["c) The boy is crying.", "c) El niño está llorando."], ["d) He is throwing a stone into the water.", "d) Está aventando una piedra al agua."], ["2.- a) Several people are looking at the flock of sheep.", "2.- a) Varias personas están viendo el rebaño de ovejas."], ["b) The flock of goats is going uptown.", "b) El rebaño de cabras va hacia el centro."], ["c) The herd of cows is in the way.", "c) La manada de vacas está estorbando el paso."], ["d) People in the market are buying the sheep.", "d) La gente del mercado está comprando las ovejas."], ["3.- a) David is playing in the forest.", "3.- a) David está jugando en el bosque."], ["b) The boy is just about to sleep.", "b) El niño está a punto de dormirse."], ["c) He enjoys reading a book.", "c) Le gusta leer un libro."], ["d) The man is standing under a tree.", "d) El hombre está parado debajo de un árbol."], ["4.- a) The six warriors are attacking with their lances.", "4.- a) Los seis guerreros están atacando con sus lanzas."], ["b) The knights are holding their swords.", "b) Los caballeros sostienen sus espadas."], ["c) They are having a conversation about knights.", "c) Están platicando sobre caballeros."], ["d) The warriors are afraid of the army.", "d) Los guerreros le tienen miedo al ejército."], ["5.- a) The horse is waiting for the man to get on.", "5.- a) El caballo está esperando a que el hombre se suba."], ["b) He is definitely going to win the competition.", "b) Definitivamente va a ganar la competencia."], ["c) The soldier is riding his horse.", "c) El soldado va montando su caballo."], ["d) He lost control and fell off the horse.", "d) Perdió el control y se cayó del caballo."], ["6.- a) The blades of the fans are moving quickly.", "6.- a) Las aspas de los ventiladores se mueven rápido."], ["b) Wind moves the blades of the windmills.", "b) El viento mueve las aspas de los molinos."], ["c) The five houses have very nice fans.", "c) Las cinco casas tienen ventiladores muy bonitos."], ["d) The windmills move with the water.", "d) Los molinos se mueven con el agua."], ["7.- a) The huge house is under water.", "7.- a) La casa enorme está bajo el agua."], ["b) They are having fun fishing in the lake.", "b) Se están divirtiendo pescando en el lago."], ["c) This farm has lots of hay in the barn.", "c) Esta granja tiene mucha paja en el granero."], ["d) This beautiful castle was the home of Kings and Queens.", "d) Este hermoso castillo fue el hogar de reyes y reinas."], ["8.- a) The mouse is trapped in the cage.", "8.- a) El ratón está atrapado en la jaula."], ["b) The little animal is drinking water.", "b) El animalito está tomando agua."], ["c) The little mouse escaped from the trap.", "c) El ratoncito se escapó de la trampa."], ["d) The doctors are studying this tiny mouse.", "d) Los doctores están estudiando a este ratón diminuto."], ["9.- a) Ice is forming on the table.", "9.- a) Se está formando hielo en la mesa."], ["b) It is probably going to be a very cold day.", "b) Probablemente va a ser un día muy frío."], ["c) I need some ice for my glass of coke.", "c) Necesito hielo para mi vaso de refresco."], ["d) The ice is melting on the table.", "d) El hielo se está derritiendo en la mesa."], ["10.- a) The angry tigers are fighting each other.", "10.- a) Los tigres enojados se están peleando entre sí."], ["b) Both lions want to get out of the cage.", "b) Los dos leones quieren salirse de la jaula."], ["c) The lions are resting together.", "c) Los leones están descansando juntos."], ["d) Lions in the zoo are playing all day.", "d) Los leones del zoológico juegan todo el día."]], "notes": ["La respuesta depende de la imagen que proyecta tu teacher en la pantalla; escucha las 4 ideas y elige la que la describe."]}, "24": {"tr": [["11.- a) Three women are watching the news.", "11.- a) Tres mujeres están viendo las noticias."], ["b) Some professionals still play computer games.", "b) Algunos profesionistas todavía juegan videojuegos."], ["c) Three office workers are using the same computer.", "c) Tres oficinistas están usando la misma computadora."], ["d) They are preparing some delicious coffee.", "d) Están preparando un café delicioso."], ["12.- a) This road is for people who ride bicycles.", "12.- a) Este camino es para gente que anda en bici."], ["b) The kids are running in the street.", "b) Los niños están corriendo en la calle."], ["c) They are driving their cars near the road.", "c) Van manejando sus coches cerca del camino."], ["d) It is getting dark, so the park is closing.", "d) Está oscureciendo, así que el parque va a cerrar."], ["13.- a) Everybody is having a good day at the park.", "13.- a) Todos la están pasando bien en el parque."], ["b) There are several things to do on a picnic day.", "b) Hay varias cosas que hacer en un día de pícnic."], ["c) She is having a conversation with her friends.", "c) Está platicando con sus amigas."], ["d) It's nice to rest under a tree.", "d) Es agradable descansar debajo de un árbol."], ["14.- a) They are planning how to win the game.", "14.- a) Están planeando cómo ganar el partido."], ["b) He touches his shoulder, because it really hurts.", "b) Se toca el hombro porque le duele mucho."], ["c) He is pulling his elbow before the game begins.", "c) Se está estirando el codo antes de que empiece el partido."], ["d) A player is trying to make one last shot.", "d) Un jugador está intentando un último tiro."], ["15.- a) Our knight is riding his horse downtown.", "15.- a) Nuestro caballero va a caballo por el centro."], ["b) The soldier is ready to attack with his gun.", "b) El soldado está listo para atacar con su arma."], ["c) This knight is crossing the street.", "c) Este caballero está cruzando la calle."], ["d) He is fighting with his enemies.", "d) Está peleando con sus enemigos."], ["In each of the following ideas, there is a missing word. Choose the correct word to complete the idea.", "En cada una de las siguientes ideas falta una palabra. Elige la palabra correcta para completar la idea."], ["1.- Many children like their parents to read them ___ before they go to sleep. a) stores b) movies c) stories d) notebooks", "1.- A muchos niños les gusta que sus papás les lean ___ antes de dormir. a) tiendas b) películas c) cuentos d) cuadernos"], ["2.- Football is a dangerous sport, that's why players use ___ for protection. a) lances b) swords c) suits d) helmets", "2.- El americano es un deporte peligroso; por eso los jugadores usan ___ para protegerse. a) lanzas b) espadas c) trajes d) cascos"], ["3.- In movies, superheroes normally save people in ___. a) castles b) trouble c) fights d) games", "3.- En las películas, los superhéroes normalmente salvan a la gente en ___. a) castillos b) apuros c) peleas d) juegos"], ["4.- Horses, cows, pigs, and chickens are farm animals that live in a ___. a) barn b) barns c) cage d) house", "4.- Los caballos, las vacas, los cerdos y las gallinas son animales de granja que viven en un ___. a) granero b) graneros c) jaula d) casa"], ["5.- In the field, the wind ___ to move the blades of the windmills. a) start b) begin c) finishes d) begins", "5.- En el campo, el viento ___ a mover las aspas de los molinos. a) empezar b) comenzar c) termina d) comienza"]]}, "25": {"tr": [["6.- It was dark after walking all day in the forest, so we decided to stop and ___ camping. a) play b) have a picnic c) go swimming d) spend the night", "6.- Ya estaba oscuro después de caminar todo el día por el bosque, así que decidimos parar y ___ acampando. a) jugar b) hacer un pícnic c) ir a nadar d) pasar la noche"], ["7.- His mother ran and ___ at him to come back, because he forgot his school books on the table. a) shout b) yelled c) yells d) asking", "7.- Su mamá corrió y le ___ que regresara, porque olvidó sus libros de la escuela en la mesa. a) gritar b) gritó c) grita d) preguntando"], ["8.- The warrior was ready to fight, so he ___ to put on his helmet. a) decides b) take off c) decided d) thinking", "8.- El guerrero estaba listo para pelear, así que ___ ponerse el casco. a) decide b) quitarse c) decidió d) pensando"], ["9.- The knights ___ people from giants and wicked wizards, when they were in trouble. a) fight b) will save c) are helping d) saved", "9.- Los caballeros ___ a la gente de gigantes y magos malvados cuando estaba en apuros. a) pelean b) salvarán c) están ayudando d) salvaban"], ["10.- Last week during the competition, a young boy ___ a nice horse. a) will ride b) drove c) is riding d) rode", "10.- La semana pasada, durante la competencia, un niño ___ un caballo muy bonito. a) montará b) manejó c) está montando d) montó"], ["11.- He asked the Lord of the Castle to ___ him a real knight. a) invents b) made c) make d) called", "11.- Le pidió al señor del castillo que lo ___ un caballero de verdad. a) inventa b) hizo c) hiciera d) llamó"], ["12.- The student was afraid to ___ his father about his bad grades. a) tell b) say c) told d) said", "12.- El alumno tenía miedo de ___ a su papá de sus malas calificaciones. a) decirle b) decir c) dijo d) dijo"], ["13.- They all ___ sad when their ice cream started to melt. a) are b) were c) is d) was", "13.- Todos ___ tristes cuando su helado empezó a derretirse. a) están b) estaban c) está d) estaba"], ["14.- Down the road, ___ men guiding some bulls, so everybody had to stop. a) there was b) there is c) there are d) there were", "14.- Más adelante en el camino ___ unos hombres guiando toros, así que todos tuvieron que detenerse. a) había (singular) b) hay (singular) c) hay (plural) d) había (plural)"], ["15.- The police department is always ___ for justice. a) fight b) battles c) fighting d) fought", "15.- El departamento de policía siempre está ___ por la justicia. a) pelear b) batallas c) luchando d) luchó"]], "notes": ["Yesterday (pasado): decide → decided, save → saved, ride → rode, fight → fought", "Después de \"to\" va el verbo simple: to make, to tell, to fight.", "there was (uno) · there were (varios): There were some men guiding bulls.", "is/are + -ing = acción en progreso: is always fighting for justice.", "He / She / It + verbo-s en Today: The wind begins to move the blades."]}, "26": {"tr": [["Following your teacher's directions, write a short composition about the story of \"Don Quijote\".", "Siguiendo las instrucciones de tu teacher, escribe una composición corta sobre la historia de \"Don Quijote\"."], ["INTRODUCTION / BODY / CONCLUSION", "INTRODUCCIÓN / DESARROLLO / CONCLUSIÓN"]]}, "27": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Mexico City is located in the Valley of Mexico. It occupies an ancient plain that was a lake long ago.", "La Ciudad de México está en el Valle de México. Ocupa una antigua llanura que hace mucho tiempo era un lago."], ["It is one of the oldest metropolises in the Western Hemisphere, and is famous for being one of the largest cities in the world.", "Es una de las metrópolis más antiguas del hemisferio occidental y es famosa por ser una de las ciudades más grandes del mundo."], ["Mexico City is the nation's capital. Its metropolitan area has an altitude of 2,200 meters above sea level.", "La Ciudad de México es la capital del país. Su zona metropolitana tiene una altitud de 2,200 metros sobre el nivel del mar."], ["Some of the mountains and volcanoes surrounding this city reach elevations of over 5,000 meters.", "Algunas de las montañas y volcanes que rodean la ciudad alcanzan más de 5,000 metros de altura."], ["This geographic position provides a mild climate which has attracted both people and businesses to the valley.", "Esta posición geográfica le da un clima templado que ha atraído tanto a personas como a negocios al valle."], ["Though seismic activity is frequent in the area, Mexico City is still a place of great charm, with notable examples of colonial and modern architecture, palaces, and gardens.", "Aunque la actividad sísmica es frecuente en la zona, la Ciudad de México sigue siendo un lugar con mucho encanto, con ejemplos notables de arquitectura colonial y moderna, palacios y jardines."], ["In the following lessons you will improve your vocabulary and listening skills as you learn more about this amazing city.", "En las siguientes lecciones vas a mejorar tu vocabulario y tu comprensión auditiva mientras aprendes más sobre esta ciudad increíble."], ["Vocabulary", "Vocabulario"], ["valley = valle", "Significa: valle"], ["Mexico City is in a valley.", "La Ciudad de México está en un valle."], ["plain = llanura", "Significa: llanura"], ["It occupies an ancient plain.", "Ocupa una antigua llanura."], ["metropolises = metrópolis", "Significa: metrópolis"], ["It is one of the oldest metropolises.", "Es una de las metrópolis más antiguas."], ["Western Hemisphere = hemisferio occidental", "Significa: hemisferio occidental"], ["Mexico is in the Western Hemisphere.", "México está en el hemisferio occidental."], ["metropolitan = metropolitana", "Significa: metropolitana"], ["The metropolitan area is huge.", "La zona metropolitana es enorme."], ["altitude = altitud", "Significa: altitud"], ["Mexico City has a high altitude.", "La Ciudad de México tiene una altitud alta."], ["above = sobre, arriba de", "Significa: sobre, arriba de"], ["It is 2,200 meters above sea level.", "Está a 2,200 metros sobre el nivel del mar."]]}, "28": {"tr": [["Vocabulary", "Vocabulario"], ["volcanoes = volcanes", "Significa: volcanes"], ["Volcanoes surround the city.", "Los volcanes rodean la ciudad."], ["elevations = elevaciones", "Significa: elevaciones"], ["Mountains reach high elevations.", "Las montañas alcanzan grandes elevaciones."], ["mild climate = clima templado", "Significa: clima templado"], ["The city has a mild climate.", "La ciudad tiene clima templado."], ["seismic = sísmico", "Significa: sísmico"], ["Seismic activity is frequent.", "La actividad sísmica es frecuente."], ["frequent = frecuente", "Significa: frecuente"], [" o. a) visita b) ha visitado c) visitan d) ha ido"], ["10.- Mexicans ___ tradition and innovation. a) have combined b) combines c) combination d) has combined", "10.- Los mexicanos ___ la tradición y la innovación. a) han combinado b) combina c) combinación d) ha combinado"], ["11.- Street markets ___ vegetables, meat, fruit and a variety of other things. a) offer b) gives c) sells d) offers", "11.- Los mercados sobre ruedas ___ verduras, carne, fruta y muchas otras cosas. a) ofrecen b) da c) vende d) ofrece"], ["12.- The National Museum of Anthropology is a very interesting ___ for tourists. a) game b) house c) park d) site", "12.- El Museo Nacional de Antropología es un ___ muy interesante para los turistas. a) juego b) casa c) parque d) sitio"], ["13.- Bullfights ___ at The Plaza México on Sundays. a) happens b) takes place c) take place d) starts", "13.- Las corridas de toros ___ en la Plaza México los domingos. a) sucede b) se lleva a cabo c) se llevan a cabo d) empieza"], ["14.- Managers at large companies normally ___ full time. a) works b) play c) stays d) work", "14.- Los gerentes de las empresas grandes normalmente ___ tiempo completo. a) trabaja b) juegan c) se queda d) trabajan"], ["15.- Throughout the years, downtown ___ a main attraction for millions of visitors. a) becomes b) has become c) has being d) have became", "15.- Con los años, el Centro ___ una atracción principal para millones de visitantes. a) se vuelve b) se ha convertido en c) (forma incorrecta) d) (forma incorrecta)"]], "notes": ["Today (presente): Markets offer · The museum exhibits (he/she/it + s).", "Super Yesterday: has/have + participio: has hosted, has become, have combined.", "Después de can / should / to: verbo simple: can enjoy, to visit.", "superlativo: large → the largest; big → the biggest.", "take place = se llevan a cabo (plural sin -s): Bullfights take place on Sundays."]}, "41": {"tr": [["Following your teacher's directions, write a short composition about \"Mexico City\".", "Siguiendo las instrucciones de tu teacher, escribe una composición corta sobre la \"Ciudad de México\"."], ["INTRODUCTION / BODY / CONCLUSION", "INTRODUCCIÓN / DESARROLLO / CONCLUSIÓN"]]}, "42": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Nutrition is the process of selecting the right kinds of food for a healthy diet.", "La nutrición es el proceso de elegir los tipos de alimentos adecuados para una dieta saludable."], ["The basic elements found in the food we eat are called nutrients.", "Los elementos básicos que hay en lo que comemos se llaman nutrientes."], ["Vitamins, minerals, and proteins are three of the nutrients generally considered essential for good health and growth.", "Las vitaminas, los minerales y las proteínas son tres de los nutrientes que en general se consideran esenciales para la buena salud y el crecimiento."], ["Vitamins and minerals are important in a number of body functions. For example, iron is used in the blood to make hemoglobin.", "Las vitaminas y los minerales son importantes para varias funciones del cuerpo. Por ejemplo, el hierro se usa en la sangre para producir hemoglobina."], ["Excessive sodium levels may cause high blood pressure and can lead to heart attacks.", "Los niveles excesivos de sodio pueden causar presión alta y provocar infartos."], ["Certain vitamin and mineral insufficiencies are even associated with epileptic seizures.", "Algunas carencias de vitaminas y minerales incluso se relacionan con crisis epilépticas."], ["Protein is another essential nutrient. During digestion, protein is broken down into various amino acids, which are essential for building tissues, and producing energy.", "La proteína es otro nutriente esencial. Durante la digestión, la proteína se descompone en varios aminoácidos, que son esenciales para formar tejidos y producir energía."], ["In the following lessons we will increase our vocabulary and listening comprehension as we consider the importance of having good nutrition in a balanced diet.", "En las siguientes lecciones vamos a aumentar nuestro vocabulario y comprensión auditiva mientras vemos la importancia de una buena nutrición con una dieta balanceada."], ["Vocabulary", "Vocabulario"], ["nutrition = nutrición", "Significa: nutrición"], ["Good nutrition is important.", "Una buena nutrición es importante."], ["nutrients = nutrientes", "Significa: nutrientes"], ["Food gives us nutrients.", "La comida nos da nutrientes."], ["vitamins = vitaminas", "Significa: vitaminas"], ["Fruit has many vitamins.", "La fruta tiene muchas vitaminas."], ["minerals = minerales", "Significa: minerales"], ["Milk has minerals.", "La leche tiene minerales."], ["proteins = proteínas", "Significa: proteínas"], ["Meat has proteins.", "La carne tiene proteínas."]]}, "43": {"tr": [["Vocabulary", "Vocabulario"], ["iron = hierro", "Significa: hierro"], ["Spinach has iron.", "La espinaca tiene hierro."], ["hemoglobin = hemoglobina", "Significa: hemoglobina"], ["Iron helps make hemoglobin.", "El hierro ayuda a producir hemoglobina."], ["sodium = sodio", "Significa: sodio"], ["Too much sodium is bad.", "Mucho sodio hace daño."], ["heart attacks = infartos", "Significa: infartos"], ["Sodium can lead to heart attacks.", "El sodio puede provocar infartos."], ["insufficiencies = insuficiencias", "Significa: insuficiencias"], ["Vitamin insufficiencies cause problems.", "La falta de vitaminas causa problemas."], ["epileptic seizures = ataques epilépticos", "Significa: ataques epilépticos"], ["Some insufficiencies cause epileptic seizures.", "Algunas carencias provocan crisis epilépticas."], ["amino acids = aminoácidos", "Significa: aminoácidos"], ["Protein is broken down into amino acids.", "La proteína se descompone en aminoácidos."], ["tissues = tejidos", "Significa: tejidos"], ["Amino acids build tissues.", "Los aminoácidos forman tejidos."], ["balanced diet = dieta balanceada", "Significa: dieta balanceada"], ["Eat a balanced diet. eradicate all diseases.", "No podemos erradicar todas las enfermedades."]]}, "45": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["healthy = saludable", "Significa: saludable"], ["I eat healthy food.", "Como comida saludable."], ["fiber = fibra", "Significa: fibra"], ["Vegetables have fiber.", "Las verduras tienen fibra."], ["healing = curación", "Significa: curación"], ["Vitamin C helps healing.", "La vitamina C ayuda a la curación."], ["wounds = heridas", "Significa: heridas"], ["It helps heal wounds.", "Ayuda a cicatrizar heridas."], ["skin = piel", "Significa: piel"], ["Vitamin A is good for your skin.", "La vitamina A es buena para la piel."], ["vision = vista", "Significa: vista"], ["Carrots are good for your vision.", "Las zanahorias son buenas para la vista."], ["spinach = espinaca", "Significa: espinaca"], ["Spinach is a green vegetable.", "La espinaca es una verdura verde."], ["squash = calabaza", "Significa: calabaza"], ["Squash has vitamin A.", "La calabaza tiene vitamina A."], ["carrots = zanahorias", "Significa: zanahorias"], ["Rabbits eat carrots.", "Los conejos comen zanahorias."], ["sources = fuentes", "Significa: fuentes"], ["Carrots are good sources of vitamin A.", "Las zanahorias son buena fuente de vitamina A."]]}, "46": {"tr": [["Vocabulary", "Vocabulario"], ["broccoli = brócoli", "Significa: brócoli"], ["Broccoli is very healthy.", "El brócoli es muy sano."], ["strawberries = fresas", "Significa: fresas"], ["I love strawberries.", "Me encantan las fresas."], ["whole grain breads = panes integrales", "Significa: panes integrales"], ["Eat whole grain breads.", "Come panes integrales."], ["cereals = cereales", "Significa: cereales"], ["Cereals have carbohydrates.", "Los cereales tienen carbohidratos."], ["nuts = nueces", "Significa: nueces"], ["Nuts have protein.", "Las nueces tienen proteína."], ["milk and cheese = leche y queso", "Significa: leche y queso"], ["Milk and cheese have calcium.", "La leche y el queso tienen calcio."], ["calcium = calcio", "Significa: calcio"], ["Calcium makes strong bones.", "El calcio fortalece los huesos."], ["cottage cheese = requesón", "Significa: requesón"], ["Cottage cheese is low in fat.", "El requesón tiene poca grasa."], ["incapable = incapaz", "Significa: incapaz"], ["Some people are incapable of digesting milk.", "Algunas personas no pueden digerir la leche."], ["digesting = digerir", "Significa: digerir"], ["They have problems digesting milk.", "Tienen problemas para digerir la leche."], ["condition = condición", "Significa: condición"], ["It is a common condition.", "Es un padecimiento común."], ["lactose intolerance = intolerancia a la lactosa", "Significa: intolerancia a la lactosa"], ["I have lactose intolerance.", "Tengo intolerancia a la lactosa."], ["lactose-free = deslactosado", "Significa: deslactosado"], ["I drink lactose-free milk.", "Tomo leche deslactosada."]]}, "47": {"tr": [["Vocabulary", "Vocabulario"], ["dairy = lácteos", "Significa: lácteos"], ["Dairy products have calcium.", "Los lácteos tienen calcio."], ["phosphorus = fósforo", "Significa: fósforo"], ["Milk has phosphorus.", "La leche tiene fósforo."]], "notes": ["Vitamin A: carrots, squash, spinach → skin and vision.", "Vitamin C: oranges, grapefruit, strawberries → prevent colds and infections.", "Fiber: fruits, vegetables, whole grain breads.", "Calcium + phosphorus: dairy (milk, cheese, cottage cheese).", "Protein: meat, fish, beans, nuts → build tissues.", "Carbohydrates: bread, cereals, rice, corn → energy (fuel).", "lactose intolerance = no poder digerir la lactosa → lactose-free milk.", "incapable of + -ing: incapable of digesting milk.", "sources of = fuentes de: Carrots are good sources of vitamin A.", "healing wounds = curar heridas.", "An apple a day keeps the doctor away."]}, "48": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["loses = pierde", "Significa: pierde"], ["Food loses nutrients outside the fridge.", "La comida pierde nutrientes fuera del refri."], ["child = niño", "Significa: niño"], ["Every child needs milk.", "Todo niño necesita leche."], ["meat = carne", "Significa: carne"], ["Meat has protein.", "La carne tiene proteína."], ["fish = pescado", "Significa: pescado"], ["Fish is healthy.", "El pescado es sano."], ["beans = frijoles", "Significa: frijoles"], ["Beans have protein and fiber.", "Los frijoles tienen proteína y fibra."], ["includes = incluye", "Significa: incluye"], ["This group includes meat and fish.", "Este grupo incluye carne y pescado."], ["fats = grasas", "Significa: grasas"], ["Avoid saturated fats.", "Evita las grasas saturadas."], ["found = se encuentra", "Significa: se encuentra"], ["Protein is found in meat.", "La proteína se encuentra en la carne."], ["throughout = a lo largo de", "Significa: a lo largo de"], ["Eat well throughout the day.", "Come bien a lo largo del día."]]}, "49": {"tr": [["Vocabulary", "Vocabulario"], ["wheat = trigo", "Significa: trigo"], ["Bread is made of wheat.", "El pan se hace con trigo."], ["rice = arroz", "Significa: arroz"], ["Rice has carbohydrates.", "El arroz tiene carbohidratos."], ["corn = maíz", "Significa: maíz"], ["Tortillas are made of corn.", "Las tortillas son de maíz."], ["noodles = fideos", "Significa: fideos"], ["I like noodles.", "Me gustan los fideos."], ["crackers = galletas saladas", "Significa: galletas saladas"], ["I eat crackers with cheese.", "Como galletas saladas con queso."], ["whole wheat = trigo integral", "Significa: trigo integral"], ["Whole wheat bread is healthy.", "El pan integral es saludable."], ["bran = salvado", "Significa: salvado"], ["Bran has fiber.", "El salvado tiene fibra."], ["wheat germ = germen de trigo", "Significa: germen de trigo"], ["Wheat germ has vitamins.", "El germen de trigo tiene vitaminas."], ["white bread = pan blanco", "Significa: pan blanco"], ["White bread has less fiber.", "El pan blanco tiene menos fibra."], ["enriched = enriquecido", "Significa: enriquecido"], ["This flour is enriched.", "Esta harina está enriquecida."], ["roll = bolillo, panecillo", "Significa: bolillo, panecillo"], ["I want a roll with butter.", "Quiero un bolillo con mantequilla."], ["dull = aburrido, soso", "Significa: aburrido, soso"], ["Healthy food doesn't have to be dull.", "La comida sana no tiene que ser aburrida."]]}, "50": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["vegetarians = vegetarianos", "Significa: vegetarianos"], ["Vegetarians don't eat meat.", "Los vegetarianos no comen carne."], ["fast foods = comida rápida", "Significa: comida rápida"], ["Fast foods have saturated fats.", "La comida rápida tiene grasas saturadas."], ["saturated fats = grasas saturadas", "Significa: grasas saturadas"], ["Saturated fats increase cholesterol.", "Las grasas saturadas suben el colesterol."], ["cholesterol = colesterol", "Significa: colesterol"], ["High cholesterol is dangerous.", "El colesterol alto es peligroso."], ["steady = constante", "Significa: constante"], ["Keep a steady weight.", "Mantén un peso estable."], ["supplements = suplementos", "Significa: suplementos"], ["Some people take supplements.", "Algunas personas toman suplementos."], ["nutritionists = nutriólogos", "Significa: nutriólogos"], ["Nutritionists recommend exercise.", "Los nutriólogos recomiendan hacer ejercicio."], ["sugars = azúcares", "Significa: azúcares"], ["Sweets have many sugars.", "Los dulces tienen muchos azúcares."], ["empty calories = calorías vacías", "Significa: calorías vacías"], ["Soda has empty calories.", "El refresco tiene calorías vacías."], ["intake = consumo", "Significa: consumo"], ["Reduce your sugar intake.", "Reduce tu consumo de azúcar."]]}, "51": {"tr": [["Vocabulary", "Vocabulario"], ["nutrient dense = rico en nutrientes", "Significa: rico en nutrientes"], ["Vegetables are nutrient dense.", "Las verduras son ricas en nutrientes."], ["sweets = dulces", "Significa: dulces"], ["Don't eat too many sweets.", "No comas demasiados dulces."], ["restrictions = restricciones", "Significa: restricciones"], ["He has diet restrictions.", "Tiene restricciones en su dieta."], ["fuel = combustible", "Significa: combustible"], ["Food is fuel for your body.", "La comida es el combustible de tu cuerpo."], ["assures = asegura", "Significa: asegura"], ["A good diet assures good health.", "Una buena dieta asegura buena salud."], ["goes on and on = sigue y sigue", "Significa: sigue y sigue"], ["The list of benefits goes on and on.", "La lista de beneficios sigue y sigue."]]}, "52": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Directions: For each item, you will hear 4 ideas. Consider which one best describes the image shown on the screen, and circle the letter of the answer (a, b, c, or d) in your Student's Book.", "Instrucciones: en cada número vas a escuchar 4 ideas. Piensa cuál describe mejor la imagen que aparece en la pantalla y encierra la letra de la respuesta (a, b, c o d) en tu libro."], ["1.- a) The little boy wants to go to sleep.", "1.- a) El niño se quiere ir a dormir."], ["b) He doesn't want to eat his vegetables.", "b) No se quiere comer sus verduras."], ["c) He is enjoying his food.", "c) Está disfrutando su comida."], ["d) His steak looks well done.", "d) Su bistec se ve bien cocido."], ["2.- a) They are all saying hello to everybody.", "2.- a) Todos están saludando a todo el mundo."], ["b) All the boys are taking a gym class.", "b) Todos los niños están en clase de educación física."], ["c) The men and women are exercising.", "c) Los hombres y las mujeres están haciendo ejercicio."], ["d) Nobody wants to take the class.", "d) Nadie quiere tomar la clase."], ["3.- a) He is thinking about the nutrients that the hamburger has.", "3.- a) Está pensando en los nutrientes que tiene la ham
