<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Juegos</title>
<script>if(window.parent===window)location.replace("../#quiz")</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{padding:6px 16px 40px;max-width:560px;margin:0 auto;overflow-x:hidden}
.sk{width:22px;height:22px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;vertical-align:-5px}
.eyebrow{font:700 10.5px/1 'DM Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#C2577A;margin:10px 0 6px}
h1{margin:0 0 4px}
.lede{color:#8E7884;font-size:14.5px;margin:0 0 14px;line-height:1.45}
/* hero */
.hero{position:relative;background:linear-gradient(140deg,#F6CBD3 0%,#FBE4E6 55%,#F3EAF7 100%);border-radius:28px;padding:18px 18px 16px;display:flex;gap:14px;align-items:center;box-shadow:0 18px 40px -22px rgba(194,87,122,.6);overflow:hidden}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:130px;height:130px;border-radius:50%;border:1.5px dashed rgba(194,87,122,.35)}
.ring{flex:0 0 auto;width:84px;height:84px;position:relative}
.ring svg{width:84px;height:84px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:rgba(255,255,255,.7)}.ring .fg{stroke:#C2577A;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:600 22px/1 'Fraunces',serif;color:#2E2230}
.ring b small{display:block;font:700 9px/1 'DM Sans';letter-spacing:.12em;color:#7A5C66;text-align:center;margin-top:2px}
.hero h2{margin:0;font-size:22px}
.hero p{margin:4px 0 0;font-size:13.5px;color:#7A5C66;line-height:1.4}
.scope{display:flex;gap:6px;margin:14px 0 6px;background:#F3E1DE;border-radius:999px;padding:4px}
.scope button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 6px;font:600 13px/1 'DM Sans';color:#7A5C66;transition:all .25s}
.scope button.on{background:#2E2230;color:#FFF6F3;box-shadow:0 4px 10px -4px rgba(46,34,48,.5)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{position:relative;text-align:left;border:0;border-radius:24px;padding:16px 14px 14px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;color:#2E2230;box-shadow:0 12px 26px -18px rgba(120,60,80,.55);transition:transform .18s cubic-bezier(.3,1.5,.5,1);animation:rise .5s both}
.tile:active{transform:scale(.95)}
.tile:nth-child(1){background:#FFFDFB;animation-delay:.02s}.tile:nth-child(2){background:#E3F0E4;animation-delay:.08s}.tile:nth-child(3){background:#EFE6F7;animation-delay:.14s}.tile:nth-child(4){background:#FBEBC4;animation-delay:.2s}
.tile .ico{width:46px;height:46px;border-radius:16px;background:rgba(255,255,255,.75);display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(46,34,48,.12)}
.tile .ico .sk{width:26px;height:26px}
.tile b{display:block;font:600 19px/1.05 'Fraunces',serif;letter-spacing:-.02em;margin-top:12px}
.tile small{display:block;font-size:12px;color:#7A5C66;margin-top:4px;line-height:1.3}
.tile .best{position:absolute;right:12px;top:14px;font:700 11px/1 'DM Sans';color:#7A5C66;display:flex;gap:3px;align-items:center}
.tile .best .sk{width:14px;height:14px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
/* game chrome */
.gtop{display:flex;align-items:center;gap:10px;margin:6px 0 12px}
.back{border:0;background:#FFFDFB;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#2E2230;box-shadow:inset 0 0 0 1.5px #EBCFCC;flex:0 0 auto}
.gbar{flex:1;height:10px;background:#F3E1DE;border-radius:9px;overflow:hidden}
.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#F6CBD3,#C2577A);border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.xp{font:700 13px/1 'DM Sans';color:#C2577A;display:flex;align-items:center;gap:3px;min-width:48px;justify-content:flex-end}
.xp .sk{width:16px;height:16px}
.gtitle{font:600 26px/1.05 'Fraunces',serif;letter-spacing:-.02em;margin:0 0 2px}
.ghint{font:600 19px/1.1 'Caveat',cursive;color:#C2577A;margin:0 0 14px}
/* flashcards */
.deck{perspective:1200px;height:330px;position:relative;margin:4px 0 16px}
.fc{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.3,.5,1),opacity .35s;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc.out-r{transform:translateX(120%) rotate(14deg);opacity:0}.fc.out-l{transform:translateX(-120%) rotate(-14deg);opacity:0}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 22px 44px -22px rgba(160,70,100,.55)}
.front{background:#FFFDFB;border:1px solid #F0D9D6}
.front:before{content:"";position:absolute;left:50%;top:-10px;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);background:rgba(246,203,211,.85);border-radius:3px}
.back2{background:linear-gradient(150deg,#2E2230,#4A3A4C);color:#FFF6F3;transform:rotateY(180deg)}
.face .tg{position:absolute;top:20px;left:0;right:0;font:700 10px/1 'DM Sans';letter-spacing:.18em;text-transform:uppercase;color:#C2577A}
.front .w{font:500 clamp(24px,8vw,34px)/1.12 'Fraunces',serif;letter-spacing:-.02em;margin:10px 0 18px}
.back2 .w{font:600 34px/1.05 'Caveat',cursive;color:#F6CBD3}
.back2 .ex{font:italic 400 15px/1.45 'Fraunces',serif;color:#EADCE3;margin-top:12px;max-width:300px}
.face .tap{position:absolute;bottom:16px;font-size:12px;color:#9C7F86;display:flex;gap:4px;align-items:center}
.back2 .tap{color:#BFA9B6}
.au2{border:0;width:52px;height:52px;border-radius:50%;background:#FBE4E6;color:#C2577A;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(194,87,122,.35)}
.au2.play{background:#C2577A;color:#fff;animation:ring2 1.1s infinite}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(194,87,122,.5)}100%{box-shadow:0 0 0 14px rgba(194,87,122,0)}}
.duo{display:flex;gap:10px}
.duo button,.big{flex:1;border:0;border-radius:18px;padding:15px 10px;font:700 15px/1 'DM Sans';display:flex;gap:7px;align-items:center;justify-content:center;transition:transform .15s}
.duo button:active,.big:active{transform:scale(.96)}
.b-soft{background:#FFFDFB;color:#2E2230;box-shadow:inset 0 0 0 1.5px #EBCFCC}
.b-dark{background:#2E2230;color:#FFF6F3;box-shadow:0 10px 20px -10px rgba(46,34,48,.6)}
.b-sage{background:#8DB398;color:#fff}
/* match */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt{width:100%;border:0;min-height:62px;border-radius:18px;padding:10px;background:#FFFDFB;box-shadow:inset 0 0 0 1.5px #EBCFCC,0 6px 14px -10px rgba(120,60,80,.4);font:500 14.5px/1.25 'DM Sans';color:#2E2230;transition:all .2s;animation:rise .4s both}
.mt.es{font:600 19px/1.05 'Caveat',cursive;color:#7A5C66}
.mt.sel{background:#2E2230;color:#FFF6F3;transform:translateY(-2px) scale(1.02)}
.mt.ok{background:#E3F0E4;box-shadow:inset 0 0 0 1.5px #8DB398;color:#3F6B4B;animation:okpop .45s forwards}
.mt.gone{opacity:0;transform:scale(.6);pointer-events:none}
.mt.bad{animation:shake .4s;background:#FCE4E8}
@keyframes okpop{40%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.timer{font:600 30px/1 'Fraunces',serif;font-variant-numeric:tabular-nums;text-align:center;margin:0 0 12px;color:#2E2230}
/* listen */
.play{margin:6px auto 18px;width:120px;height:120px;border-radius:50%;border:0;background:radial-gradient(circle at 30% 30%,#F6CBD3,#C2577A);color:#fff;display:grid;place-items:center;box-shadow:0 18px 34px -16px rgba(194,87,122,.8)}
.play .sk{width:46px;height:46px;stroke-width:1.6}
.play.go{animation:ring2 1.1s infinite}
.opts2 button{display:flex;width:100%;align-items:center;gap:12px;text-align:left;margin:8px 0;border:0;border-radius:18px;padding:14px;background:#FFFDFB;box-shadow:inset 0 0 0 1.5px #EBCFCC;font:500 15.5px/1.3 'DM Sans';color:#2E2230;animation:rise .4s both;transition:transform .15s}
.opts2 button:active{transform:scale(.98)}
.opts2 .k{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#FBE4E6;font:italic 600 15px/1 'Fraunces',serif;color:#C2577A}
.opts2 button.ok{background:#E3F0E4;box-shadow:inset 0 0 0 1.5px #8DB398;animation:okpop .45s}
.opts2 button.ok .k{background:#8DB398;color:#fff}
.opts2 button.no{background:#FCE4E8;box-shadow:inset 0 0 0 1.5px #C0485F;animation:shake .4s}
.reveal{min-height:46px;text-align:center;font:italic 500 18px/1.3 'Fraunces',serif;color:#2E2230;opacity:0;transform:translateY(6px);transition:all .35s}
.reveal.on{opacity:1;transform:none}
/* build */
.prompt{background:#FFFDFB;border-radius:24px;padding:18px;box-shadow:0 14px 30px -20px rgba(160,70,100,.5);border:1px solid #F0D9D6;margin-bottom:14px}
.prompt .es{font:600 24px/1.15 'Caveat',cursive;color:#7A5C66}
.line{min-height:64px;border-bottom:2px dashed #E9C0C3;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding:8px 0 10px;margin-bottom:16px}
.line.bad{animation:shake .4s}
.line.good .wd{background:#8DB398;color:#fff;box-shadow:none}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:60px}
.wd{border:0;border-radius:14px;padding:10px 13px;background:#FFFDFB;box-shadow:inset 0 0 0 1.5px #EBCFCC,0 4px 0 #F0D9D6;font:500 16px/1 'DM Sans';color:#2E2230;animation:rise .3s both;transition:transform .12s}
.wd:active{transform:translateY(2px)}
.line .wd{background:#2E2230;color:#FFF6F3;box-shadow:0 4px 0 #120C13}
.wd.ph{visibility:hidden}
/* end screen */
.done{text-align:center;padding:30px 10px}
.done .medal{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 30%,#FBEBC4,#F6CBD3);color:#C2577A;animation:okpop .6s}
.done .medal .sk{width:56px;height:56px}
.done h2{font-size:30px;margin:0}.done p{color:#7A5C66;margin:6px 0 20px}
.stat{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
.stat div{background:#FFFDFB;border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 1.5px #EBCFCC}
.stat b{display:block;font:600 26px/1 'Fraunces',serif}.stat small{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8E7884}
/* fx */
.fly{position:fixed;font:700 18px/1 'DM Sans';color:#C2577A;pointer-events:none;animation:fly 1s forwards;z-index:50}
@keyframes fly{to{transform:translateY(-60px);opacity:0}}
.cf{position:fixed;top:-12px;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:60;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r));}}
.empty{padding:30px 10px;text-align:center;color:#8E7884}
</style><style id="bloom">/* ==== BLOOM · rediseño oct-2026 · "That Girl Learns English" ====
   crema · rosa suave · rosa profundo · salvia · tinta ciruela
   Fraunces (títulos) · DM Sans (texto) · Caveat (acento a mano) */
@font-face{font-family:'Fraunces';src:url(fonts/fraunces.woff2) format('woff2');font-weight:300 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-i.woff2) format('woff2');font-weight:300 800;font-style:italic;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dmsans.woff2) format('woff2');font-weight:300 800;font-style:normal;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dmsans-i.woff2) format('woff2');font-weight:300 800;font-style:italic;font-display:swap}
:root{
  --paper:#FBF4EE!important;--paper2:#F7ECE4!important;--card:#FFFDFB!important;--sand:#F5E3DF!important;--stone:#E9CFCB!important;
  --taupe:#9C7F86!important;--taupe-d:#7A5C66!important;--ink:#2E2230!important;--ink2:#4A3A4C!important;--text:#2E2230!important;--muted:#8E7884!important;--line:#F0DEDA!important;
  --blush:#FBE4E6!important;--pink:#F6CBD3!important;--pinkd:#D46F8A!important;--rose:#D46F8A!important;--amber:#C2577A!important;--amber-soft:#FBE4E6!important;
  --green:#5E8C6A!important;--green-soft:#E3F0E4!important;--ok:#DDEFE0!important;--red:#C0485F!important;--red-soft:#FCE4E8!important;
  --serif:'Fraunces',Georgia,serif!important;--font:'DM Sans',system-ui,-apple-system,sans-serif!important;--script:'Caveat',cursive!important;
  --shadow:0 1px 2px rgba(120,60,80,.06),0 12px 30px -14px rgba(160,70,100,.28)!important;
  --shadow-lg:0 2px 6px rgba(120,60,80,.08),0 22px 44px -18px rgba(160,70,100,.34)!important;
  --radius:22px!important;--radius-sm:14px!important;
  --b-deep:#C2577A;--b-sage:#8DB398;--b-lav:#D9CBEA;--b-butter:#FBEBC4;
}
html,body{font-family:'DM Sans',system-ui,-apple-system,sans-serif!important;color:var(--ink);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
html{background:#FBF4EE!important;min-height:100%}
html body{min-height:100vh;background-color:#FBF4EE!important;background-image:radial-gradient(1200px 500px at 110% -10%,rgba(246,203,211,.45),transparent 60%),radial-gradient(900px 500px at -20% 110%,rgba(217,203,234,.35),transparent 60%)!important;background-attachment:fixed!important}
h1,h2,h3,.base h2,.card h2,#top h1,.dhead b,.lt{font-family:'Fraunces',Georgia,serif!important;font-weight:600!important;letter-spacing:-.02em!important;color:var(--ink)}
h1{font-size:clamp(28px,8vw,36px)!important;line-height:1.02!important}
h1 i,#top h1 i,.lt i{font-family:'Caveat',cursive!important;font-weight:600!important;color:var(--b-deep)!important;letter-spacing:0!important}
h2{line-height:1.1!important}
.hand,.base p,.rbox .h{font-family:'Caveat',cursive!important;color:var(--b-deep)!important}
small,.sub,.tag{color:var(--muted)!important}
.tag{font-family:'DM Sans',sans-serif!important;font-weight:700!important;letter-spacing:.14em!important;font-size:10.5px!important}
button,input,select,textarea{font-family:'DM Sans',system-ui,sans-serif!important}
.sk{stroke-width:1.5!important}
/* tarjetas */
.card:not(section),.in{border:1px solid #F0D9D6!important;border-radius:24px!important;box-shadow:var(--shadow)!important;background:#FFFDFB!important}
.base{background:#FFFDFB!important;border-bottom:1.5px dashed var(--pink)!important}
.step{background:linear-gradient(135deg,#F6CBD3,#FBE4E6)!important;border:0!important;color:var(--b-deep)!important;font-family:'Fraunces',serif!important;font-style:italic!important}
/* botones */
.btn,a.btn{border:0!important;background:var(--ink)!important;color:#FFF6F3!important;border-radius:999px!important;font-weight:600!important;box-shadow:0 6px 16px -8px rgba(46,34,48,.55)!important;transition:transform .15s ease,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn.sec2,.btn.ok{background:#FFFDFB!important;color:var(--ink)!important;border:1.5px solid var(--ink)!important;box-shadow:none!important}
.btn.done{background:var(--b-sage)!important;color:#fff!important;border-color:var(--b-sage)!important}
.au{border:0!important;background:var(--blush)!important;color:var(--b-deep)!important;box-shadow:inset 0 0 0 1.5px rgba(194,87,122,.35)!important;transition:transform .15s}
.au:active{transform:scale(.9)}
.au.play,.au.say{background:var(--b-deep)!important;color:#fff!important;animation:bl-ring 1.1s ease-out infinite}
@keyframes bl-ring{0%{box-shadow:0 0 0 0 rgba(194,87,122,.5)}100%{box-shadow:0 0 0 12px rgba(194,87,122,0)}}
.pill,.les button,.tabs2 button{border:1.5px solid #EBCFCC!important;background:#FFFDFB!important;color:var(--ink)!important;font-weight:600!important;transition:all .2s}
.pill.on,.les button.on,.tabs2 button.on{background:var(--ink)!important;color:#FFF6F3!important;border-color:var(--ink)!important}
.opts button{border:1.5px solid #EBCFCC!important;background:#FFFDFB!important;border-radius:16px!important;transition:transform .15s,background .2s}
.opts button:active{transform:scale(.98)}
.opts button.ok{background:var(--ok)!important;border-color:var(--b-sage)!important;animation:bl-pop .4s}
.opts button.no{background:var(--red-soft)!important;border-color:var(--red)!important;animation:bl-shake .4s}
@keyframes bl-pop{50%{transform:scale(1.04)}}
@keyframes bl-shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bar{background:var(--sand)!important;height:10px!important;border-radius:9px!important}
.bar i{background:linear-gradient(90deg,var(--pink),var(--b-deep))!important;transition:width .5s cubic-bezier(.2,.8,.2,1)}
textarea{border:1.5px solid #EBCFCC!important;border-radius:16px!important;background-color:#FFFDFB!important}
</style></head><body>

(function(){'use strict';
var SETS=[[27, "WAY TOO …", "demasiado (de más, exagerado)", [["", "I'm way too full.", "Estoy demasiado lleno."], ["", "It's way too hot.", "Hace demasiado calor."], ["", "It's way too cold.", "Hace demasiado frío."], ["", "You're way too smart.", "Eres demasiado inteligente."]], ["Estoy demasiado cansado.", "I'm way too tired."], "@camperezn"], [26, "Do you + VERBO?", "pregunta en Today con \"do\"", [["", "Do you work?", "¿Trabajas?"], ["", "Do you like coffee?", "¿Te gusta el café?"], ["", "Do you live here?", "¿Vives aquí?"], ["", "Do you have a car?", "¿Tienes carro?"]], ["¿Hablas inglés?", "Do you speak English?"], "@camperezn"], [39, "I was about to …", "estaba a punto de…", [["", "I was about to take a shower.", "Estaba a punto de bañarme."], ["", "I was about to read a book.", "Estaba a punto de leer un libro."], ["", "I was about to watch a movie.", "Estaba a punto de ver una película."], ["", "I was about to leave.", "Estaba a punto de irme."]], ["Estaba a punto de llamarla.", "I was about to call her."], "@camperezn"], [22, "He said that …", "explicar lo que alguien dijo", [["", "He said that he was tired.", "Dijo que estaba cansado."], ["", "She said that she liked pizza.", "Dijo que le gustaba la pizza."], ["", "They said that the class was easy.", "Dijeron que la clase era fácil."], ["", "He said that he had to work.", "Dijo que tenía que trabajar."], ["", "She said that it was raining.", "Dijo que estaba lloviendo."]], ["Dijo que vivía en Monterrey.", "He said that he lived in Monterrey."], "Lección 22"], [23, "SAID vs. TOLD", "said (algo) · told (a alguien)", [["", "He said that he was hungry.", "Dijo que tenía hambre."], ["", "He told me that he was hungry.", "Me dijo que tenía hambre."], ["", "She told us that she was busy.", "Nos dijo que estaba ocupada."], ["", "They told her that the phone was new.", "Le dijeron que el teléfono era nuevo."]], ["Ella me dijo que estaba feliz.", "She told me that she was happy."], "Lección 23"], [23, "He asked if …", "explicar preguntas de sí / no", [["", "He asked if I was ready.", "Preguntó si estaba listo."], ["", "She asked if I wanted coffee.", "Preguntó si quería café."], ["", "He asked if I had a car.", "Preguntó si tenía carro."], ["", "They asked if she could sing.", "Preguntaron si ella sabía cantar."]], ["Me preguntó si estaba cansado.", "He asked me if I was tired."], "Lección 23"], [24, "She told me to …", "explicar órdenes", [["", "She told me to clean my room.", "Me dijo que limpiara mi cuarto."], ["", "He told us not to talk.", "Nos dijo que no habláramos."], ["", "The teacher told me to read page 10.", "La maestra me dijo que leyera la página 10."], ["", "She told him to close the door.", "Le dijo que cerrara la puerta."]], ["Me dijo que esperara.", "He told me to wait."], "Lección 24"], [25, "He asked me where …", "explicar preguntas WH", [["", "He asked me where I lived.", "Me preguntó dónde vivía."], ["", "She asked me what time it was.", "Me preguntó qué hora era."], ["", "They asked me who she was.", "Me preguntaron quién era ella."], ["", "He asked me why I was running.", "Me preguntó por qué estaba corriendo."]], ["Me preguntó cómo me llamaba.", "She asked me what my name was."], "Lección 25"], [26, "Do / Does / Did → if …", "al explicar se va el auxiliar", [["", "\"Do you like tea?\" → He asked if I liked tea.", "Preguntó si me gustaba el té."], ["", "\"Does she play guitar?\" → He asked if she played guitar.", "Preguntó si ella tocaba guitarra."], ["", "\"Did you eat?\" → She asked if I had eaten.", "Preguntó si había comido."], ["", "\"Did they go?\" → He asked if they had gone.", "Preguntó si habían ido."]], ["\"¿Viste la película?\" → Me preguntó si había visto la película.", "He asked me if I had seen the movie."], "Lección 26"], [27, "The most … / the …est", "comparar 3 o más cosas", [["", "It is the tallest mountain.", "Es la montaña más alta."], ["", "This is the most expensive ring.", "Este es el anillo más caro."], ["", "She is the best student.", "Ella es la mejor estudiante."], ["", "It was the worst day.", "Fue el peor día."]], ["Él es el más divertido de la clase.", "He is the funniest in the class."], "Lección 27"], [28, "…, isn't it? / don't you?", "preguntas de confirmación", [["", "It's hot, isn't it?", "Hace calor, ¿verdad?"], ["", "You like music, don't you?", "Te gusta la música, ¿no?"], ["", "She was tired, wasn't she?", "Estaba cansada, ¿verdad?"], ["", "They can't come, can they?", "No pueden venir, ¿o sí?"]], ["Hablas inglés, ¿verdad?", "You speak English, don't you?"], "Lección 28"], [39, "Today → Yesterday → Super Yesterday", "los pasados QL (irregulares)", [["", "go → went → gone", "ir"], ["", "eat → ate → eaten", "comer"], ["", "see → saw → seen", "ver"], ["", "write → wrote → written", "escribir"], ["", "speak → spoke → spoken", "hablar"]], ["tomar (Today, Yesterday, Super Yesterday)", "take → took → taken"], "Lección 39"], [39, "Super-Super Yesterday = had + SY", "algo que ya había pasado antes", [["", "I had eaten before class.", "Yo había comido antes de la clase."], ["", "The bus had left.", "El camión ya se había ido."], ["", "She had seen the movie.", "Ella ya había visto la película."], ["", "We had finished the homework.", "Ya habíamos terminado la tarea."]], ["Él ya se había ido.", "He had gone."], "Lección 39"], [29, "Yesterday I …", "contar algo que pasó (composición)", [["", "Yesterday I fell off my bike.", "Ayer me caí de la bici."], ["", "I broke my arm.", "Me rompí el brazo."], ["", "My mom took me to the hospital.", "Mi mamá me llevó al hospital."], ["", "It was the worst accident.", "Fue el peor accidente."]], ["Ayer perdí mis llaves.", "Yesterday I lost my keys."], "Lección 29"], [30, "a ten-year-old boy", "descripciones compuestas (sin -s)", [["", "a ten-year-old boy", "un niño de diez años"], ["", "a fifty-dollar shirt", "una camisa de cincuenta dólares"], ["", "a two-hour class", "una clase de dos horas"], ["", "a five-story building", "un edificio de cinco pi     s[3].forEach(function(e){add({en:e[1],es:e[2],L:s[0]})});add({en:s[4][1],es:s[4][0],L:s[0]})});
  if(is5)V5.forEach(function(x){if(scope==='les'?x.n!==L:x.n>L)return;x.vocab.forEach(function(v){add({en:v[0],es:v[1],ex:v[2],L:x.n})})});
  if(out.length<8&&scope==='les'){scope='all';var r=pool();scope='les';return r}
  return out}
/* ---------- audio ---------- */
var AU=new Audio();AU.preload='auto';var playing=null;
function stop(){try{AU.pause()}catch(e){}try{speechSynthesis.cancel()}catch(e){}if(playing){playing.classList.remove('play','go');playing=null}}
function tts(t,b){if(!window.speechSynthesis){b&&b.classList.remove('play','go');return}var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;
  var vs=speechSynthesis.getVoices(),pick=ls('ql_guia_voice_v2')||'';for(var i=0;i<vs.length;i++)if(vs[i].name+'|'+vs[i].lang===pick)u.voice=vs[i];
  u.onend=u.onerror=function(){b&&b.classList.remove('play','go')};speechSynthesis.speak(u)}
function say(t,b,cls){stop();if(!t)return;var f=AF[t],dir='audio/frases/';if(!f){f=A5[t];dir='audio/5a/'}
  if(b){b.classList.add(cls||'play');playing=b}
  if(f){AU.src=dir+f;AU.onended=function(){b&&b.classList.remove('play','go')};var p=AU.play();if(p&&p.catch)p.catch(function(){tts(t.replace(/→/g,','),b)});return}
  tts(t.replace(/→/g,','),b)}
function hasAudio(t){return !!(AF[t]||A5[t])}
/* ---------- feedback ---------- */
function xp(n,el){S.xp[today()]=(S.xp[today()]||0)+n;save();var x=document.getElementById('xpN');if(x)x.textContent=S.xp[today()];
  if(el){var r=el.getBoundingClientRect(),f=document.createElement('div');f.className='fly';f.textContent='+'+n;f.style.left=(r.left+r.width/2-14)+'px';f.style.top=(r.top-6)+'px';document.body.appendChild(f);setTimeout(function(){f.remove()},1000)}
  try{navigator.vibrate&&navigator.vibrate(18)}catch(e){}}
function confetti(n){var C=['#F6CBD3','#C2577A','#8DB398','#D9CBEA','#FBEBC4','#2E2230'];for(var i=0;i<(n||40);i++){var d=document.createElement('i');d.className='cf';d.style.left=Math.random()*100+'vw';d.style.background=C[i%C.length];
  d.style.setProperty('--dx',(Math.random()*120-60)+'px');d.style.setProperty('--r',(Math.random()*720-360)+'deg');d.style.animationDuration=(1.4+Math.random()*1.4)+'s';d.style.animationDelay=(Math.random()*.3)+'s';if(i%3===0)d.style.borderRadius='50%';
  document.body.appendChild(d);(function(d){setTimeout(function(){d.remove()},3200)})(d)}}
/* ---------- home ---------- */
var root=document.getElementById('root'),G=null;
function home(){stop();G=null;var P=pool(),x=S.xp[today()]||0,pc=Math.min(1,x/GOAL),C=2*Math.PI*36;
  var b=S.best,mb=b.match?b.match+'s':'',kn=P.filter(function(p){return S.known[p.en]}).length;
  root.innerHTML='<div class="eyebrow">Nivel '+lvl()+' · Lección '+lesson()+'</div><h1>Juegos <i>de hoy</i></h1><p class="lede">Practica jugando: tarjetas, parejas, escucha y arma frases. Todo con audio.</p>'+
   '<div class="hero"><div class="ring"><svg viewBox="0 0 84 84"><circle class="bg" cx="42" cy="42" r="36"/><circle class="fg" cx="42" cy="42" r="36" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" id="rg"/></svg><b><span>'+x+'<small>/ '+GOAL+' XP</small></span></b></div><div><h2>'+(pc>=1?'¡Meta cumplida!':'Tu meta diaria')+'</h2><p>'+(pc>=1?'Ya juntaste tus '+GOAL+' puntos. Sigue si quieres más.':'Junta '+GOAL+' puntos hoy. Cada acierto suma 10.')+'</p></div></div>'+
   '<div class="scope"><button data-sc="les" class="'+(scope==='les'?'on':'')+'">Esta lección</button><button data-sc="all" class="'+(scope==='all'?'on':'')+'">Hasta la lección '+lesson()+'</button></div>'+
   '<div class="grid">'+
   tile('cards','i-cards','Tarjetas','Voltea y di si ya te la sabes',kn+'/'+P.length)+
   tile('match','i-puzzle','Parejas','Une inglés con español contra reloj',mb)+
   tile('listen','i-headphones','Escucha','Oye la frase y elige qué significa','')+
   tile('build','i-writing','Arma la frase','Ordena las palabras en inglés','')+'</div>';
  requestAnimationFrame(function(){setTimeout(function(){var r=document.getElementById('rg');if(r)r.style.strokeDashoffset=C*(1-pc)},60)})}
function tile(id,i,t,s,best){return '<button class="tile" data-g="'+id+'">'+(best?'<span class="best">'+ic('i-star')+esc(best)+'</span>':'')+'<span class="ico">'+ic(i)+'</span><span><b>'+t+'</b><small>'+s+'</small></span></button>'}
function chrome(t,h,pc){return '<div class="gtop"><button class="back" data-home aria-label="Volver">'+ic('i-arrow-back-up')+'</button><div class="gbar"><i style="width:'+(pc*100)+'%"></i></div><span class="xp">'+ic('i-flame')+'<b id="xpN">'+(S.xp[today()]||0)+'</b></span></div><div class="gtitle">'+t+'</div><div class="ghint">'+h+'</div>'}
function finish(title,sub,stats){confetti(60);root.innerHTML='<div class="done"><div class="medal">'+ic('i-trophy')+'</div><h2>'+title+'</h2><p>'+sub+'</p><div class="stat">'+stats.map(function(s){return '<div><b>'+s[0]+'</b><small>'+s[1]+'</small></div>'}).join('')+'</div><div class="duo"><button class="b-soft" data-home>'+ic('i-arrow-back-up')+'Juegos</button><button class="b-dark" data-g="'+G.id+'">'+ic('i-repeat')+'Otra vez</button></div></div>'}
/* ---------- tarjetas ---------- */
function startCards(){var P=pool();var d=shuf(P.filter(function(p){return !S.known[p.en]})).concat(shuf(P.filter(function(p){return S.known[p.en]}))).slice(0,10);G={id:'cards',d:d,i:0,ok:0};rCards()}
function rCards(){if(G.i>=G.d.length)return finish('¡Mazo completo!','Repasaste '+G.d.length+' tarjetas.',[[G.ok,'Me las sé'],[G.d.length-G.ok,'A repasar']]);
  var c=G.d[G.i];root.innerHTML=chrome('Tarjetas','toca la tarjeta para voltearla',G.i/G.d.length)+
  '<div class="deck"><div class="fc" id="fc"><div class="face front"><span class="tg">Lección '+c.L+' · '+(G.i+1)+' de '+G.d.length+'</span><div class="w">'+esc(c.en)+'</div><button class="au2" data-say="'+esc(c.en)+'" aria-label="Escuchar">'+ic('i-volume')+'</button><span class="tap">'+ic('i-hand-finger')+'toca para ver el significado</span></div>'+
  '<div class="face back2"><span class="tg" style="color:#F6CBD3">en español</span><div class="w">'+esc(c.es)+'</div>'+(c.ex?'<div class="ex">“'+esc(c.ex)+'”</div>':'')+'<span class="tap">toca para regresar</span></div></div></div>'+
  '<div class="duo"><button class="b-soft" data-cd="0">'+ic('i-refresh')+'Repasar</button><button class="b-dark" data-cd="1">'+ic('i-check')+'¡Me la sé!</button></div>';
  setTimeout(function(){var a=root.querySelector('.au2');if(a)say(c.en,a)},250)}
/* ---------- parejas ---------- */
function startMatch(){var P=shuf(pool()).filter(function(p){return p.en.length<60}).slice(0,5);G={id:'match',p:P,t0:Date.now(),left:P.length,err:0,sel:null};
  root.innerHTML=chrome('Parejas','toca una en inglés y su pareja en español',0)+'<div class="timer" id="tm">0.0</div><div class="cols"><div>'+shuf(P.map(function(p,i){return i})).map(function(i,k){return '<button class="mt en" style="animation-delay:'+(k*.05)+'s" data-m="'+i+'" data-s="en">'+esc(P[i].en)+'</button>'}).join('<div style="height:10px"></div>')+'</div><div>'+
  shuf(P.map(function(p,i){return i})).map(function(i,k){return '<button class="mt es" style="animation-delay:'+(k*.05+.1)+'s" data-m="'+i+'" data-s="es">'+esc(P[i].es)+'</button>'}).join('<div style="height:10px"></div>')+'</div></div>';
  clearInterval(G.tk);G.tk=setInterval(function(){var t=document.getElementById('tm');if(!t||!G||G.id!=='match'){clearInterval(this);return}t.textContent=((Date.now()-G.t0)/1000).toFixed(1)},100)}
function tapMatch(b){if(b.classList.contains('ok'))return;var s=G.sel;
  if(!s||s.dataset.s===b.dataset.s){if(s)s.classList.remove('sel');G.sel=b;b.classList.add('sel');if(b.dataset.s==='en')say(G.p[+b.dataset.m].en);return}
  G.sel=null;s.classList.remove('sel');
  if(s.dataset.m===b.dataset.m){[s,b].forEach(function(x){x.classList.add('ok');setTimeout(function(){x.classList.add('gone')},650)});G.left--;xp(10,b);
    root.querySelector('.gbar i').style.width=(100*(G.p.length-G.left)/G.p.length)+'%';
    if(!G.left){clearInterval(G.tk);var sec=Math.round((Date.now()-G.t0)/100)/10,nb=!S.best.match||sec<S.best.match;if(nb){S.best.match=sec;save()}
      var g1=G;setTimeout(function(){if(G!==g1)return;finish(nb?'¡Nuevo récord!':'¡Todas unidas!',nb?'Tu mejor tiempo en Parejas.':'Récord: '+S.best.match+' s',[[sec+'s','Tiempo'],[G.err,'Errores']])},700)}}
  else{G.err++;[s,b].forEach(function(x){x.classList.remove('bad');void x.offsetWidth;x.classList.add('bad')})}}
/* ---------- escucha ---------- */
function startListen(){var P=pool();var q=shuf(P.filter(function(p){return hasAudio(p.en)})).slice(0,8);if(q.length<4)q=shuf(P).slice(0,8);G={id:'listen',q:q,P:P,i:0,ok:0};rListen()}
function rListen(){if(G.i>=G.q.length)return finish(G.ok>=G.q.length-1?'¡Oído de oro!':'¡Bien escuchado!','Acertaste '+G.ok+' de '+G.q.length+'.',[[G.ok,'Aciertos'],[G.q.length-G.ok,'Fallos']]);
  var c=G.q[G.i],o=[c];shuf(G.P).forEach(function(p){if(o.length<4&&p.es!==c.es&&o.indexOf(p)<0)o.push(p)});o=shuf(o);G.o=o;G.done=false;
  root.innerHTML=chrome('Escucha','¿qué significa lo que oyes?',G.i/G.q.length)+'<button class="play" id="pl" aria-label="Escuchar">'+ic('i-volume')+'</button><div class="reveal" id="rv">'+esc(c.en)+'</div><div class="opts2">'+o.map(function(p,k){return '<button data-lo="'+k+'" style="animation-delay:'+(k*.06)+'s"><span class="k">'+'abcd'[k]+'</span><span>'+esc(p.es)+'</span></button>'}).join('')+'</div>';
  setTimeout(function(){var a=document.getElementById('pl');if(a)say(c.en,a,'go')},300)}
function tapListen(b){if(G.done)return;G.done=true;var c=G.q[G.i],k=+b.dataset.lo,bs=root.querySelectorAll('[data-lo]');bs[G.o.indexOf(c)].classList.add('ok');
  if(G.o[k]===c){G.ok++;xp(10,b);confetti(14)}else b.classList.add('no');document.getElementById('rv').classList.add('on');
  var g0=G;setTimeout(function(){if(G!==g0)return;G.i++;rListen()},G.o[k]===c?1300:2200)}
/* ---------- arma la frase ---------- */
function toks(s){return s.replace(/[“”"]/g,'').split(/\s+/).filter(Boolean)}
function startBuild(){var P=pool().filter(function(p){var n=toks(p.en).length;return n>=3&&n<=10&&!/→|\//.test(p.en)});G={id:'build',q:shuf(P).slice(0,6),i:0,ok:0};
  if(!G.q.length){root.innerHTML=chrome('Arma la frase','',0)+'<div class="empty">Esta lección no trae frases para armar. Prueba con «Hasta la lección».</div>';return}rBuild()}
function rBuild(){if(G.i>=G.q.length)return finish('¡Frases armadas!','Te salieron '+G.ok+' de '+G.q.length+' a la primera.',[[G.ok,'A la primera'],[G.q.length,'Frases']]);
  var c=G.q[G.i];G.ans=toks(c.en);G.picked=[];G.miss=false;var w=shuf(G.ans.map(function(t,i){return i}));if(w.join()===G.ans.map(function(t,i){return i}).join()&&w.length>1)w.reverse();
  root.innerHTML=chrome('Arma la frase','toca las palabras en orden',G.i/G.q.length)+'<div class="prompt"><div class="eyebrow" style="margin-top:0">Dilo en inglés</div><div class="es">'+esc(c.es)+'</div></div><div class="line" id="ln"></div><div class="bank" id="bk">'+
  w.map(function(i,k){return '<button class="wd" data-w="'+i+'" style="animation-delay:'+(k*.04)+'s">'+esc(G.ans[i])+'</button>'}).join('')+'</div><div style="height:18px"></div><div class="duo"><button class="b-soft" data-bh>'+ic('i-eye')+'Ver respuesta</button><button class="b-soft" data-bu>'+ic('i-arrow-back-up')+'Borrar</button></div>'}
function tapWord(b){var ln=document.getElementById('ln');if(b.parentNode.id==='bk'){ln.appendChild(b);G.picked.push(+b.dataset.w)}else{document.getElementById('bk').appendChild(b);G.picked.splice(G.picked.indexOf(+b.dataset.w),1)}
  if(G.picked.length===G.ans.length){var got=G.picked.map(function(i){return G.ans[i]}).join(' ');
    if(got===G.ans.join(' ')){ln.classList.add('good');if(!G.miss){G.ok++;xp(10,ln)}confetti(18);say(G.q[G.i].en);var g0=G;setTimeout(function(){if(G!==g0)return;G.i++;rBuild()},1600)}
    else{G.miss=true;ln.classList.remove('bad');void ln.offsetWidth;ln.classList.add('bad')}}}
/* ---------- eventos ---------- */
document.addEventListener('click',function(e){var b;
  if((b=e.target.closest('[data-say]'))){e.stopPropagation();say(b.dataset.say,b);return}
  if(e.target.closest('[data-home]')){if(G&&G.tk)clearInterval(G.tk);home();return}
  if((b=e.target.closest('[data-sc]'))){scope=b.dataset.sc;ls('ql_juegos_scope',scope);home();return}
  if((b=e.target.closest('[data-g]'))){var g=b.dataset.g;window.scrollTo(0,0);({cards:startCards,match:startMatch,listen:startListen,build:startBuild})[g]();return}
  if(!G)return;
  if(G.id==='cards'){if((b=e.target.closest('[data-cd]'))){var c=G.d[G.i],k=b.dataset.cd==='1',fc=document.getElementById('fc');if(k){S.known[c.en]=1;G.ok++;xp(10,b)}else delete S.known[c.en];save();
      fc.classList.remove('flip');fc.classList.add(k?'out-r':'out-l');var g0=G;setTimeout(function(){if(G!==g0)return;G.i++;rCards()},380);return}
    if(e.target.closest('#fc')){document.getElementById('fc').classList.toggle('flip');return}}
  if(G.id==='match'&&(b=e.target.closest('[data-m]'))){tapMatch(b);return}
  if(G.id==='listen'){if(e.target.closest('#pl')){say(G.q[G.i].en,document.getElementById('pl'),'go');return}if((b=e.target.closest('[data-lo]'))){tapListen(b);return}}
  if(G.id==='build'){if((b=e.target.closest('.wd'))){tapWord(b);return}
    if(e.target.closest('[data-bu]')){G.picked=[];rBuildKeep();return}
    if(e.target.closest('[data-bh]')){G.miss=true;var ln=document.getElementById('ln');ln.innerHTML='<span style="font:italic 500 19px/1.3 Fraunces,serif">'+esc(G.ans.join(' '))+'</span>';document.getElementById('bk').innerHTML='';say(G.q[G.i].en);var g0=G;setTimeout(function(){if(G!==g0)return;G.i++;rBuild()},2600);return}}
});
function rBuildKeep(){var bk=document.getElementById('bk'),ln=document.getElementById('ln');Array.prototype.slice.call(ln.querySelectorAll('.wd')).forEach(function(w){bk.appendChild(w)});ln.classList.remove('bad')}
var key='';
window.__juegos={refresh:function(){var k=lvl()+lesson();if(k!==key){key=k;home()}},stop:stop};
window.addEventListener('storage',function(e){if(/^ql_app_(leccion|level)/.test(e.key||''))window.__juegos.refresh()});
window.__juegos.refresh();
})();
</script></body></html>
