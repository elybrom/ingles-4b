@font-face{font-family:'Caveat';src:url(app/fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Lora';src:url(app/fonts/lora-500.woff2) format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'Lora';src:url(app/fonts/lora-600.woff2) format('woff2');font-weight:600 700;font-display:swap}
@font-face{font-family:'Cormorant';src:url(app/fonts/cormorant-600.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--tab-h:64px;--paper:#F6EFE6;--card:#FFFAF4;--sand:#E8DFD3;--stone:#C9C2BA;--taupe:#8C8178;--ink:#3B2F2F;--muted:#8A7E76;--line:#E6DCD1;--pink:#E9C4C8;--amber:#B5763A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Lora',Georgia,serif;background:var(--paper);color:var(--ink)}
.sk{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#chips{display:none;gap:8px;overflow-x:auto;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
#chips::-webkit-scrollbar{display:none}
#chips.on{display:flex}
#chips button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--stone);border-radius:999px;padding:7px 15px;font:500 14px/1 'Lora',Georgia,serif;background:var(--card);color:var(--ink);min-height:38px}
#chips button .sk{width:18px;height:18px}
#chips button.on{background:var(--sand);border-color:var(--taupe);box-shadow:inset 0 -2px 0 var(--pink)}
#stage{position:relative;flex:1 1 auto;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper);visibility:hidden}
#stage iframe.on{visibility:visible}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 28px/1 'Cormorant',Georgia,serif;font-style:italic;color:var(--taupe);pointer-events:none}
nav#tabs{flex:0 0 auto;display:flex;justify-content:space-around;align-items:stretch;background:rgba(255,250,244,.97);border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(59,47,47,.35);padding:4px 2px;padding-bottom:max(4px,env(safe-area-inset-bottom));min-height:var(--tab-h);position:relative}
nav#tabs button{flex:1 1 0;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 3px;font-family:inherit;font-size:10.5px;font-weight:500;color:var(--muted);letter-spacing:-.1px}
nav#tabs button .ic{display:grid;place-items:center;width:46px;height:30px;border-radius:999px;transition:background .2s,transform .15s}
nav#tabs button.on{color:var(--ink)}
nav#tabs button.on .ic{background:var(--sand);box-shadow:inset 0 -2px 0 var(--pink)}
nav#tabs button.on .sk{stroke-width:1.5}
nav#tabs button span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav#tabs button.on span.t{font-weight:600}
#lesBadge{position:absolute;right:8px;bottom:8px;z-index:5;display:none}
</style></head><body>

<script>
(function(){
'use strict';
var LK='ql_app_leccion_v1',TK='ql_app_tab_v1',SK='ql_app_sub_v1';
var fL=document.getElementById('fLibro'),fG=document.getElementById('fGuia');
var TABS={
  libro:{f:'libro'},
  clase:{f:'guia',sec:'miclase'},
  cuaderno:{f:'guia',sec:'cuaderno'},
  chart:{f:'guia',chips:[['colorchart','Color Chart','#i-palette'],['alphabet','ABC','#i-abc']]},
  gram:{f:'guia',chips:[['explicar','Explicar','#i-messages'],['prep','Preposiciones','#i-map-pin'],['tabla','Tabla de verbos','#i-table'],['lecciones','Lecciones','#i-books'],['hoy','Hoy','#i-sun']]},
  videos:{f:'guia',sec:'videos'},
  quiz:{f:'guia',sec:'quiz'}
};
var SEC2TAB={miclase:'clase',cuaderno:'cuaderno',colorchart:'chart',alphabet:'chart',explicar:'gram',prep:'gram',tabla:'gram',lecciones:'gram',hoy:'gram',videos:'videos',quiz:'quiz'};
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var sub={};try{sub=JSON.parse(ls(SK)||'{}')||{}}catch(e){sub={}}
function lesson(){var n=+ls(LK);if(n>=21&&n<=39)return n;
  try{var mc=JSON.parse(ls('ql_miclase_v1')||'null');if(mc&&mc.lesson>=21&&mc.lesson<=39)return mc.lesson}catch(e){}
  var c=+ls('ql_cuaderno_leccion_v1');return (c>=21&&c<=39)?c:22}
function setLesson(n){n=+n;if(n>=21&&n<=39&&n!==+ls(LK))ls(LK,String(n))}
var loaded={libro:false,guia:false};
function api(which){var f=which==='libro'?fL:fG;try{return which==='libro'?f.contentWindow.__libro:f.contentWindow.__guia}catch(e){return null}}
function when(which,cb,tries){tries=tries||0;var a=api(which);
  if(a&&(which!=='libro'||a.ready)){cb(a);return}
  if(tries>200)return;setTimeout(function(){when(which,cb,tries+1)},60)}
function ensure(which){if(loaded[which])return;loaded[which]=true;
  var f=which==='libro'?fL:fG;
  f.src=which==='libro'?'app/libro/index.html?v=b228d70bf9':'app/guia.html?app=1&v=b228d70bf9';
  f.addEventListener('load',function(){document.getElementById('loading').style.display='none'},{once:true})}
var cur=null;
function renderChips(t){var c=document.getElementById('chips');var T=TABS[t];
  if(!T.chips){c.classList.remove('on');c.innerHTML='';return}
  c.innerHTML='';var act=sub[t]||T.chips[0][0];
  T.chips.forEach(function(ch){var b=document.createElement('button');b.innerHTML='<svg class="sk" aria-hidden="true"><use href="'+ch[2]+'"/></svg><span>'+ch[1]+'</span>';b.dataset.sec=ch[0];b.className=ch[0]===act?'on':'';
    b.onclick=function(){sub[t]=ch[0];ls(SK,JSON.stringify(sub));renderChips(t);when('guia',function(g){g.show(ch[0])})};c.appendChild(b)});
  c.classList.add('on')}
function show(t,fromGuide){
  if(!TABS[t])t='libro';var T=TABS[t];var prev=cur;cur=t;
  document.querySelectorAll('#tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===t);b.setAttribute('aria-current',b.dataset.tab===t?'page':'false')});
  ls(TK,t);if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);
  renderChips(t);
  ensure(T.f);
  fL.classList.toggle('on',T.f==='libro');fG.classList.toggle('on',T.f==='guia');
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  if(T.f==='libro'){
    if(loaded.guia)when('guia',function(g){g.pause()});
    when('libro',function(b){b.goLesson(lesson())});
  }else{
    when('libro',function(b){b.stop()});
    if(fromGuide)return;
    var L=lesson();
    when('guia',function(g){
      if(t==='clase'){if(g.mcN()!==L)g.clase(L);else g.show('miclase')}
      else if(t==='cuaderno'){if(String(g.cqSel())!==String(L))g.cuaderno(L);else g.show('cuaderno')}
      else if(T.chips){g.show(sub[t]||T.chips[0][0])}
      else g.show(T.sec);
    });
  }
}
window.addEventListener('message',function(e){var m=e.data;if(!m||!m.ql)return;
  if(m.ql==='lesson')setLesson(m.n);
  if(m.ql==='sec'&&e.source===fG.contentWindow){var t=SEC2TAB[m.id];if(!t)return;
    if(TABS[t].chips){sub[t]=m.id;ls(SK,JSON.stringify(sub))}
    if(t!==cur&&TABS[cur]&&TABS[cur].f==='guia')show(t,true);else if(t===cur&&TABS[t].chips)renderChips(t)}
  if(m.ql==='tab'&&TABS[m.tab])show(m.tab)});
document.querySelectorAll('#tabs button').forEach(function(b){b.onclick=function(){show(b.dataset.tab)}});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(TABS[h]&&h!==cur)show(h)});
var start=location.hash.slice(1);if(!TABS[start])start=ls(TK)||'libro';if(!TABS[start])start='libro';
show(start);
/* precarga la otra parte para que cambiar de pestaña sea instantáneo */
setTimeout(function(){ensure('libro');ensure('guia')},1200);
window.__app={show:show,get tab(){return cur},lesson:lesson};
})();
