<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inglés · Expresiones como nativo</title>
<meta name="theme-color" content="#FBF4EE">
<style>
@font-face{font-family:'Fraunces';src:url(fonts/fraunces.woff2) format('woff2');font-weight:300 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url(fonts/fraunces-i.woff2) format('woff2');font-weight:300 800;font-style:italic;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dmsans.woff2) format('woff2');font-weight:300 800;font-style:normal;font-display:swap}
@font-face{font-family:'DM Sans';src:url(fonts/dmsans-i.woff2) format('woff2');font-weight:300 800;font-style:italic;font-display:swap}
@font-face{font-family:'Caveat';src:url(fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
:root{
  --paper:#FBF4EE;--paper2:#F7ECE4;--card:#FFFDFB;--sand:#F5E3DF;--stone:#E9CFCB;
  --taupe:#9C7F86;--ink:#2E2230;--ink2:#4A3A4C;--muted:#8E7884;--line:#F0DEDA;
  --blush:#FBE4E6;--pink:#F6CBD3;--pinkd:#D46F8A;--rose:#D46F8A;--amber:#C2577A;
  --green:#5E8C6A;--ok:#DDEFE0;--red:#C0485F;--red-soft:#FCE4E8;
  --serif:'Fraunces',Georgia,serif;--font:'DM Sans',system-ui,-apple-system,sans-serif;--script:'Caveat',cursive;
  --shadow:0 1px 2px rgba(120,60,80,.06),0 12px 30px -14px rgba(160,70,100,.28);
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:var(--font);color:var(--ink);background:var(--paper);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
.sk{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
#app{position:absolute;inset:0;display:flex;flex-direction:column;min-width:0}
#top{flex:0 0 auto;padding:10px 14px 6px;background:rgba(251,244,238,.92);backdrop-filter:blur(10px)}
#top .row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
#top h1{margin:0;font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.05;letter-spacing:-.03em}
#top h1 i{display:block;font-family:var(--script);font-style:normal;font-weight:600;color:var(--amber);font-size:24px;letter-spacing:0;white-space:nowrap;margin-top:1px}
#top .sub{margin:2px 0 0;font:600 15px/1.2 var(--script);color:var(--amber)}
#meta{display:flex;align-items:center;gap:8px;flex:0 0 auto}
#prog{font:700 12px/1 var(--font);color:var(--amber);background:var(--blush);border-radius:999px;padding:7px 10px;white-space:nowrap}
.tog{display:flex;align-items:center;gap:6px;border:1.5px solid #EBCFCC;background:#FFFDFB;border-radius:999px;padding:6px 10px;font:700 12px/1 var(--font);color:var(--ink)}
.tog input{accent-color:var(--amber);width:16px;height:16px;margin:0}
#chips{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding:4px 14px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:0 0 auto;border:1.5px solid #EBCFCC;background:#FFFDFB;border-radius:999px;padding:7px 13px;font:600 13px/1 var(--font);color:var(--ink);min-height:36px}
#chips button.on{background:var(--ink);color:#FFF6F3;border-color:var(--ink)}
#stage{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 14px 18px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border:1px solid #F0D9D6;border-radius:24px;box-shadow:var(--shadow);margin:0 0 12px;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:10px;width:100%;padding:14px 12px 14px 16px;border:0;background:none;text-align:left;color:inherit;font:inherit;cursor:pointer}
.card .hd .tx{flex:1;min-width:0}
.card .hd h2{margin:0;font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere}
.card .hd p{margin:3px 0 0;font:600 16px/1.2 var(--script);color:var(--amber)}
.badge{display:inline-block;font:700 9.5px/1 var(--font);letter-spacing:.12em;text-transform:uppercase;color:var(--amber);background:var(--blush);border-radius:999px;padding:4px 8px;margin-bottom:5px}
.au{flex:0 0 auto;border:0;background:var(--blush);color:var(--amber);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(194,87,122,.35)}
.au.play, .au.say{background:var(--amber);color:#fff;animation:ring 1.1s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(194,87,122,.5)}100%{box-shadow:0 0 0 12px rgba(194,87,122,0)}}
.au:active{transform:scale(.92)}
.chev{flex:0 0 auto;width:18px;height:18px;color:var(--taupe);transition:transform .25s}
.card.open .chev{transform:rotate(180deg)}
.mark{flex:0 0 auto;width:18px;height:18px;color:var(--green);opacity:0}
.card.heard .mark{opacity:1}
.body{display:none;padding:0 16px 16px;border-top:1.5px dashed var(--pink)}
.card.open .body{display:block}
.box{margin-top:12px;background:linear-gradient(140deg,#FBE4E6 0%,#F7ECE4 70%);border-radius:16px;padding:12px 14px}
.box.sage{background:linear-gradient(140deg,#E3F0E4,#F7ECE4 70%)}
.box .k{font:700 10.5px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.box .f{font-family:var(--serif);font-weight:600;font-size:16px;line-height:1.3;margin:0 0 6px;overflow-wrap:anywhere}
.box .n,.box .s{margin:0;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.phon{font-family:var(--serif);font-style:italic;font-weight:500;font-size:20px;line-height:1.25;margin:0 0 6px;color:var(--amber);overflow-wrap:anywhere}
.ex{margin:12px 0 0;padding:0;list-style:none}
.ex li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #F3E4E1}
.ex .tx{flex:1;min-width:0}
.ex b{display:block;font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.ex small{display:block;color:var(--muted);font-size:13px;line-height:1.35;margin-top:2px;overflow-wrap:anywhere}
.credit{margin:8px 0 20px;padding:14px 16px;background:var(--card);border:1px dashed #EBCFCC;border-radius:20px;font-size:13.5px;line-height:1.45;color:var(--ink2)}
.credit a{color:var(--amber);font-weight:600;text-decoration:none;border-bottom:1px solid var(--pink)}
#dock{flex:0 0 auto;display:flex;gap:8px;padding:8px 14px 10px;background:rgba(255,253,251,.96);border-top:1px solid var(--line)}
#dock button{flex:1;border:0;border-radius:999px;padding:12px 10px;font:600 14.5px/1 var(--font);min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
#dock button.on{background:var(--ink);color:#FFF6F3;box-shadow:0 6px 16px -8px rgba(46,34,48,.55)}
#dock button:not(.on){background:#FFFDFB;color:var(--ink);border:1.5px solid var(--ink)}
/* quiz */
#qz{display:none;padding-bottom:8px}
body.mode-quiz #list, body.mode-quiz #chips, body.mode-quiz .credit{display:none}
body.mode-quiz #qz{display:block}
.qbar{height:10px;background:var(--sand);border-radius:9px;overflow:hidden;margin:0 0 14px}
.qbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--amber));transition:width .4s}
.qcard{background:var(--card);border:1px solid #F0D9D6;border-radius:24px;box-shadow:var(--shadow);padding:18px 16px}
.qcard .num{font:700 10.5px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.qcard h2{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.2;margin:10px 0 6px;letter-spacing:-.02em;overflow-wrap:anywhere}
.qcard .hint{font:600 16px/1.3 var(--script);color:var(--amber);margin:0 0 14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opts button{border:1.5px solid #EBCFCC;background:#FFFDFB;border-radius:16px;padding:12px 14px;text-align:left;font:600 15px/1.35 var(--font);color:var(--ink);min-height:48px;overflow-wrap:anywhere}
.opts button.ok{background:var(--ok);border-color:var(--green);animation:pop .35s}
.opts button.no{background:var(--red-soft);border-color:var(--red);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.blank{display:flex;flex-direction:column;gap:10px}
.blank p.sen{margin:0 0 4px;font-family:var(--serif);font-size:20px;line-height:1.35;font-weight:500;overflow-wrap:anywhere}
.blank p.sen em{font-style:normal;color:var(--amber);border-bottom:2px dashed var(--pink);padding:0 4px}
.blank input{width:100%;border:1.5px solid #EBCFCC;background:#FFFDFB;border-radius:16px;padding:12px 14px;font:600 16px/1.3 var(--font);color:var(--ink)}
.blank input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(194,87,122,.18)}
.blank input.ok{border-color:var(--green);background:var(--ok)}
.blank input.no{border-color:var(--red);background:var(--red-soft)}
.fb{display:none;margin-top:12px;padding:12px 14px;border-radius:16px;font-size:14.5px;line-height:1.4}
.fb.on{display:block}
.fb.ok{background:var(--ok);color:#2A4A32}
.fb.no{background:var(--red-soft);color:#7A2434}
.fb b{display:block;margin-bottom:4px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:0;background:var(--ink);color:#FFF6F3;border-radius:999px;padding:12px 18px;font:600 14.5px/1 var(--font);min-height:44px;box-shadow:0 6px 16px -8px rgba(46,34,48,.55);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:active{transform:scale(.96)}
button[hidden],[hidden]{display:none!important}
.btn.sec{background:#FFFDFB;color:var(--ink);border:1.5px solid var(--ink);box-shadow:none}
.done{text-align:center;padding:10px 4px}
.done h2{font-family:var(--serif);font-size:28px;margin:8px 0 4px}
.done .big{font-family:var(--serif);font-style:italic;font-size:48px;color:var(--amber);margin:8px 0}
.done p{color:var(--ink2);font-size:15px;line-height:1.4}
@media (max-width:400px){
  #top h1{font-size:22px}
  .card .hd h2{font-size:18.5px}
  .qcard h2{font-size:20px}
}
</style>
</head>

<script>

(function(){
'use strict';
if(window.parent===window && !/preview=1/.test(location.search)) location.replace('../#expresiones');
var EK='ql_expr_v1';
var GROUPS=window.__EXPR_GROUPS;
var ITEMS=window.__EXPR_ITEMS;
var AUDIO=window.__EXPR_AUDIO||{};
var AU=new Audio();AU.preload='auto';
var st={};try{st=JSON.parse(ls(EK)||'{}')||{}}catch(e){st={}}
if(!st.heard)st.heard={};
if(typeof st.slow!=='boolean')st.slow=false;
if(!st.best)st.best=0;
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function save(){ls(EK,JSON.stringify(st))}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function ic(id){return '<svg class="sk" aria-hidden="true"><use href="#'+id+'"/></svg>'}
function norm(s){return String(s||'').toLowerCase().replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim()}
function item(id){for(var i=0;i<ITEMS.length;i++)if(ITEMS[i].id===id)return ITEMS[i];return null}
function stop(){try{AU.pause();AU.removeAttribute('src');AU.load()}catch(e){}try{speechSynthesis.cancel()}catch(e){}document.querySelectorAll('.au.play').forEach(function(b){b.classList.remove('play')})}
function play(text,btn){
  stop();
  var f=AUDIO[text];
  if(btn)btn.classList.add('play');
  if(f){
    try{
      AU.src='audio/expr/'+f;
      AU.playbackRate=st.slow?0.7:1;
      AU.onended=function(){if(btn)btn.classList.remove('play')};
      AU.onerror=function(){if(btn)btn.classList.remove('play');tts(text,btn)};
      var p=AU.play();if(p&&p.catch)p.catch(function(){tts(text,btn)});
      return;
    }catch(e){}
  }
  tts(text,btn);
}
function tts(text,btn){
  if(!window.speechSynthesis){if(btn)btn.classList.remove('play');return}
  speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=st.slow?0.6:0.92;
  u.onend=u.onerror=function(){if(btn)btn.classList.remove('play')};
  speechSynthesis.speak(u);
}
function markHeard(id){if(!st.heard[id]){st.heard[id]=Date.now();save();paintProg();var c=document.querySelector('.card[data-id="'+id+'"]');if(c)c.classList.add('heard')}}
function heardN(){return Object.keys(st.heard).length}
function paintProg(){
  var n=heardN();
  document.getElementById('prog').textContent=n+' / '+ITEMS.length;
}
function paintSlow(){
  var t=document.getElementById('slow');if(t)t.checked=!!st.slow;
}
var cat=st.cat||'all';
var openId=st.open|| (ITEMS[0]&&ITEMS[0].id);
var mode=st.mode||'explore';

function renderChips(){
  var el=document.getElementById('chips');
  var all=[{id:'all',label:'Todas'}].concat(GROUPS);
  el.innerHTML=all.map(function(g){return '<button type="button" data-g="'+g.id+'" class="'+(g.id===cat?'on':'')+'">'+esc(g.label)+'</button>'}).join('');
}
function listItems(){
  if(cat==='all')return ITEMS;
  return ITEMS.filter(function(it){return it.group===cat});
}
function renderList(){
  var list=listItems();
  var el=document.getElementById('list');
  el.innerHTML=list.map(function(it,i){
    var open=it.id===openId?' open':'';
    var heard=st.heard[it.id]?' heard':'';
    var badge=it.star?'<span class="badge">Del reel</span>':'';
    var ex=it.examples.map(function(e,j){
      return '<li><span class="tx"><b>'+esc(e[0])+'</b><small>'+esc(e[1])+'</small></span><button type="button" class="au" data-play="'+esc(e[0])+'" data-id="'+it.id+'" aria-label="Escuchar ejemplo">' +ic('i-volume')+'</button></li>';
    }).join('');
    return '<article class="card'+open+heard+'" data-id="'+it.id+'">'+
      '<div class="hd" data-toggle="'+it.id+'">'+
        '<span class="tx">'+badge+'<h2>'+esc(it.en)+'</h2><p>'+esc(it.es)+'</p></span>'+
        ic('i-circle-check').replace('class="sk"','class="sk mark"')+
        '<button type="button" class="au" data-play="'+esc(it.en)+'" data-id="'+it.id+'" aria-label="Escuchar">' +ic('i-volume')+'</button>'+
        '<svg class="sk chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>'+
      '</div>'+
      '<div class="body">'+
        '<div class="box"><div class="k">Cómo se arma</div><p class="f">'+esc(it.formula)+'</p><p class="n">'+esc(it.formulaNote)+'</p></div>'+
        '<div class="box sage"><div class="k">Pronunciación</div><p class="phon">'+esc(it.phon)+'</p><p class="s">'+esc(it.silent)+'</p></div>'+
        '<ul class="ex">'+ex+'</ul>'+
      '</div></article>';
  }).join('');
}

function setMode(m){
  mode=m;st.mode=m;save();
  document.body.classList.toggle('mode-quiz', m==='quiz');
  document.getElementById('dExp').classList.toggle('on', m==='explore');
  document.getElementById('dQz').classList.toggle('on', m==='quiz');
  if(m==='quiz' && (!quiz || quiz.done)) startQuiz();
  else if(m==='quiz') renderQuiz();
}

/* ---------- quiz ---------- */
var quiz=null;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function pickWrong(it, n){
  var others=ITEMS.filter(function(x){return x.id!==it.id});
  return shuffle(others).slice(0,n);
}
function makeQuestions(){
  var pool=shuffle(ITEMS);
  var qs=[], used={};
  function take(pred){
    for(var i=0;i<pool.length;i++){
      if(!used[pool[i].id] && (!pred||pred(pool[i]))){used[pool[i].id]=1;return pool[i]}
    }
    for(var j=0;j<pool.length;j++){if(!used[pool[j].id]){used[pool[j].id]=1;return pool[j]}}
    return pool[0];
  }
  // 4 meaning, 3 fill, 3 type — 10 total
  for(var i=0;i<4;i++){
    var it=take();
    var opts=shuffle([it.es].concat(pickWrong(it,3).map(function(x){return x.es})));
    qs.push({type:'meaning', id:it.id, prompt:it.en, play:it.en, hint:'¿Qué significa?', opts:opts, answer:it.es});
  }
  var fills=[
    {id:'shouldve-known', sen:'I ______ known it was too good to be true.', accept:["should've","should have","shouldve"], play:"I should've known it was too good to be true."},
    {id:'shouldnt-have', sen:'I ______ eaten so much.', accept:["shouldn't have","should not have","shouldnt have"], play:"I shouldn't have eaten so much."},
    {id:'couldve', sen:'You ______ told me sooner.', accept:["could've","could have","couldve"], play:"You could've told me sooner."},
    {id:'wouldve', sen:'I ______ called, but my phone died.', accept:["would've","would have","wouldve"], play:"I would've called, but my phone died."},
    {id:'mustve', sen:'I ______ left my keys at the office.', accept:["must've","must have","mustve"], play:"I must've left my keys at the office."},
    {id:'mightve', sen:'It ______ been a mistake.', accept:["might've","might have","mightve"], play:"It might've been a mistake."},
    {id:'im-used-to', sen:"I'm ______ waking up early.", accept:["used to"], play:"I'm used to waking up early."},
    {id:'i-used-to', sen:'I ______ live in Monterrey.', accept:["used to"], play:"I used to live in Monterrey."},
    {id:'im-about-to', sen:"I'm ______ leave.", accept:["about to"], play:"I'm about to leave."},
    {id:'its-up-to-you', sen:"It's ______ you.", accept:["up to"], play:"It's up to you"},
    {id:'supposed-to', sen:'I was ______ call her yesterday.', accept:["supposed to"], play:"I was supposed to call her yesterday."},
    {id:'id-better', sen:"I'd ______ go, it's getting late.", accept:["better"], play:"I'd better go, it's getting late."},
    {id:'looking-forward', sen:"I'm looking ______ seeing you.", accept:["forward to"], play:"I'm looking forward to seeing you."},
    {id:'ended-up', sen:'I ______ working late.', accept:["ended up"], play:"I ended up working late."},
    {id:'gonna', sen:"I'm ______ study tonight.", accept:["gonna","going to"], play:"I'm gonna study tonight."},
    {id:'wanna', sen:'I ______ learn more expressions.', accept:["wanna","want to"], play:"I wanna learn more expressions."},
    {id:'gotta', sen:"I've ______ go.", accept:["gotta","got to"], play:"I've gotta go."},
    {id:'was-gonna', sen:'I was ______ call you.', accept:["gonna","going to"], play:"I was gonna call you."},
    {id:'cant-wait', sen:"I can't ______ see you.", accept:["wait to"], play:"I can't wait to see you."},
    {id:'as-far-as', sen:'______ , class starts at eight.', accept:["as far as i know","as far as I know"], play:"As far as I know, class starts at eight."},
    {id:'turns-out', sen:'______ she was right.', accept:["it turns out"], play:"It turns out she was right."},
    {id:'id-rather', sen:"I'd ______ stay home tonight.", accept:["rather"], play:"I'd rather stay home tonight."}
  ];
  var fillPick=shuffle(fills).slice(0,3);
  fillPick.forEach(function(f){
    var it=item(f.id)||{};
    qs.push({type:'fill', id:f.id, sen:f.sen, accept:f.accept, play:f.play, hint:'Completa la expresión', es:it.es||''});
  });
  for(var k=0;k<3;k++){
    var it2=take();
    qs.push({type:'type', id:it2.id, prompt:it2.es, play:it2.en, hint:'Escríbela en inglés', accept:it2.accept, answer:it2.en});
  }
  return shuffle(qs);
}
function okAccept(val, accept){
  var v=norm(val).replace(/[.,!?]/g,'');
  return accept.some(function(a){return v===norm(a).replace(/[.,!?]/g,'')});
}
function startQuiz(){
  quiz={qs:makeQuestions(), i:0, ok:0, answered:false, done:false};
  renderQuiz();
}
function renderQuiz(){
  var el=document.getElementById('qz');
  if(!quiz){startQuiz();return}
  if(quiz.done){
    var n=quiz.qs.length, sc=quiz.ok;
    if(sc>st.best){st.best=sc;save()}
    var msg=sc===n?'Las 10, impecable.':sc>=8?'Muy bien, casi todas.':sc>=5?'Buen avance, repasa las que fallaste.':'Escúchalas otra vez y vuelve a intentar.';
    el.innerHTML='<div class="qcard done">'+ic('i-sparkles')+'<div class="big">'+sc+' / '+n+'</div><h2>Ronda terminada</h2><p>'+esc(msg)+(st.best?(' Tu mejor: '+st.best+'/'+n+'.'):'')+'</p><div class="actions" style="justify-content:center"><button type="button" class="btn" id="again">'+ic('i-refresh')+'<span>Otra ronda</span></button><button type="button" class="btn sec" id="backEx">Volver a las tarjetas</button></div></div>';
    document.getElementById('again').onclick=function(){startQuiz()};
    document.getElementById('backEx').onclick=function(){setMode('explore')};
    return;
  }
  var q=quiz.qs[quiz.i], pct=Math.round((quiz.i)/quiz.qs.length*100);
  var body='';
  if(q.type==='meaning'){
    body='<h2>'+esc(q.prompt)+'</h2><p class="hint">'+esc(q.hint)+'</p><div class="opts">'+
      q.opts.map(function(o,i){return '<button type="button" data-opt="'+esc(o)+'">'+esc(o)+'</button>'}).join('')+'</div>';
  } else if(q.type==='fill'){
    var parts=q.sen.split('______');
    body='<p class="hint">'+esc(q.hint)+(q.es?(' · '+q.es):'')+'</p><div class="blank"><p class="sen">'+esc(parts[0]||'')+'<em>&nbsp;&nbsp;&nbsp;</em>'+esc(parts[1]||'')+'</p><input id="qin" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="escribe aquí"></div>';
  } else {
    body='<h2>'+esc(q.prompt)+'</h2><p class="hint">'+esc(q.hint)+'</p><div class="blank"><input id="qin" type="text" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="escríbela en inglés"></div>';
  }
  el.innerHTML='<div class="qbar"><i style="width:'+pct+'%"></i></div><div class="qcard"><div class="num">Pregunta '+(quiz.i+1)+' de '+quiz.qs.length+'</div>'+body+
    '<div class="fb" id="qfb"></div><div class="actions"><button type="button" class="au" id="qplay" aria-label="Escuchar">'+ic('i-volume')+'</button>'+
    (q.type!=='meaning'?'<button type="button" class="btn" id="qcheck">Revisar</button>':'')+
    '<button type="button" class="btn sec" id="qnext" hidden>Siguiente</button></div></div>';
  document.getElementById('qplay').onclick=function(){play(q.play,this);if(q.id)markHeard(q.id)};
  var next=document.getElementById('qnext');
  function finish(correct, detail){
    if(quiz.answered)return;quiz.answered=true;
    if(correct)quiz.ok++;
    var fb=document.getElementById('qfb');
    fb.className='fb on '+(correct?'ok':'no');
    fb.innerHTML=correct?'<b>Así se dice.</b>'+(detail?esc(detail):''):'<b>Casi. La respuesta es:</b> '+esc(detail||'');
    next.hidden=false;
    var chk=document.getElementById('qcheck');if(chk)chk.hidden=true;
    play(q.play, document.getElementById('qplay'));
    if(q.id)markHeard(q.id);
  }
  if(q.type==='meaning'){
    el.querySelectorAll('[data-opt]').forEach(function(b){
      b.onclick=function(){
        if(quiz.answered)return;
        var good=b.getAttribute('data-opt')===q.answer;
        el.querySelectorAll('[data-opt]').forEach(function(x){
          if(x.getAttribute('data-opt')===q.answer)x.classList.add('ok');
        });
        if(!good)b.classList.add('no');
        finish(good, q.answer);
      };
    });
  } else {
    var inp=document.getElementById('qin');
    function check(){
      if(quiz.answered)return;
      var good=okAccept(inp.value, q.accept);
      inp.classList.add(good?'ok':'no');
      inp.disabled=true;
      finish(good, q.answer || q.accept[0]);
    }
    document.getElementById('qcheck').onclick=check;
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();check()}});
    setTimeout(function(){try{inp.focus()}catch(e){}},200);
  }
  next.onclick=function(){
    quiz.i++;quiz.answered=false;
    if(quiz.i>=quiz.qs.length)quiz.done=true;
    renderQuiz();
    document.getElementById('stage').scrollTop=0;
  };
}

document.getElementById('chips').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  cat=b.dataset.g;st.cat=cat;save();renderChips();renderList();
  document.getElementById('stage').scrollTop=0;
});
document.getElementById('list').addEventListener('click',function(e){
  var playBtn=e.target.closest('[data-play]');
  if(playBtn){
    e.preventDefault();e.stopPropagation();
    play(playBtn.getAttribute('data-play'), playBtn);
    if(playBtn.dataset.id)markHeard(playBtn.dataset.id);
    return;
  }
  var tog=e.target.closest('[data-toggle]');
  if(tog){
    var id=tog.getAttribute('data-toggle');
    openId=(openId===id)?null:id;st.open=openId;save();
    document.querySelectorAll('.card').forEach(function(c){c.classList.toggle('open',c.dataset.id===openId)});
  }
});
document.getElementById('slow').onchange=function(){st.slow=this.checked;save();if(!AU.paused)AU.playbackRate=st.slow?0.7:1};
document.getElementById('dExp').onclick=function(){setMode('explore')};
document.getElementById('dQz').onclick=function(){setMode('quiz')};

paintSlow();paintProg();renderChips();renderList();
if(mode==='quiz')setMode('quiz');
else setMode('explore');

window.__expr={
  stop:stop,
  refresh:function(){paintProg();if(mode==='explore')renderList()},
  count:ITEMS.length
};
})();

</script>
</body></html>
