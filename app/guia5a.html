*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Lora,Georgia,serif;font-size:16px}
.sk{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}

h1{font-family:Cormorant,Georgia,serif;font-weight:600;font-size:30px;margin:6px 0 2px;line-height:1.05}

.sub{color:var(--muted);font-size:14px;margin:0 0 10px}
.les{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.les::-webkit-scrollbar{display:none}
.les button{flex:0 0 auto;border:1px solid var(--stone);background:var(--card);border-radius:999px;min-width:38px;height:34px;font:inherit;font-size:14px;color:var(--ink)}
.les button.on{background:var(--pink);border-color:var(--pinkd)}
.card{background:var(--card);border:1.5px solid var(--ink);border-radius:20px 24px 18px 22px;box-shadow:3px 4px 0 var(--sand);padding:14px 14px 12px;margin:12px 0}
.card h2{font-family:Cormorant,Georgia,serif;font-weight:600;font-size:23px;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.step{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--pink);font:600 15px Lora;border:1.3px solid var(--ink)}
.hand{font-family:Caveat,cursive;color:var(--pinkd);font-size:19px}
.row{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.row:last-child{border-bottom:0}
.row .tx{flex:1}.row b{font-weight:600}.row small{display:block;color:var(--muted);font-size:13.5px}
.au{flex:0 0 auto;border:1.3px solid var(--ink);background:var(--paper);border-radius:50%;width:34px;height:34px;display:grid;place-items:center;color:var(--ink)}
.au.play{background:var(--pink)}
.pill{display:inline-block;border:1px solid var(--stone);border-radius:999px;padding:4px 10px;margin:3px 4px 3px 0;background:var(--paper);font-size:14px}
a.btn,.btn{display:inline-flex;gap:6px;align-items:center;border:1.5px solid var(--ink);background:var(--pink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14.5px;color:var(--ink);text-decoration:none}
.btn.sec2{background:var(--sand)}
textarea{width:100%;min-height:120px;border:1.3px solid var(--stone);border-radius:14px;background:#FFFDF9;padding:10px;font:inherit;font-size:15px;color:var(--ink);background-image:repeating-linear-gradient(transparent 0 27px,var(--line) 27px 28px);line-height:28px}
.saved{font-size:12px;color:var(--muted);height:16px}
.q{font-size:17px;margin:6px 0 10px}.opts button{display:block;width:100%;text-align:left;margin:6px 0;border:1.3px solid var(--stone);background:var(--paper);border-radius:14px;padding:10px 12px;font:inherit;color:var(--ink)}
.opts button.ok{background:var(--ok);border-color:#8FA97D}.opts button.no{background:#F3D6D6;border-color:var(--pinkd)}
.bar{height:8px;background:var(--sand);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--pinkd)}
.tabs2{display:flex;gap:6px;margin:4px 0 6px}.tabs2 button{border:1px solid var(--stone);background:var(--card);border-radius:999px;padding:6px 12px;font:inherit;font-size:14px;color:var(--ink)}.tabs2 button.on{background:var(--pink)}

var qs={mode:'libro',i:0};
function quizList(){if(qs.mode==='libro')return D.quiz;
  var L=lesson(),pool=[];D.lessons.forEach(function(x){if(x.n<=L)x.vocab.forEach(function(v){pool.push(v)})});
  if(!qs.voc){qs.voc=pool.slice().sort(function(){return Math.random()-.5}).slice(0,20).map(function(v){var o=[v[1]];while(o.length<4){var r=pool[Math.floor(Math.random()*pool.length)][1];if(o.indexOf(r)<0)o.push(r)}o.sort(function(){return Math.random()-.5});return {L:0,s:'¿Qué significa "'+v[0]+'"?',o:o,a:o.indexOf(v[1]),say:v[0]}})}
