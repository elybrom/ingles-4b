<style>
@font-face{font-family:'Caveat';src:url(app/fonts/caveat.woff2) format('woff2');font-weight:400 700;font-display:swap}
@font-face{font-family:'Lora';src:url(app/fonts/lora-500.woff2) format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:'Lora';src:url(app/fonts/lora-600.woff2) format('woff2');font-weight:600 700;font-display:swap}
@font-face{font-family:'Cormorant';src:url(app/fonts/cormorant-600.woff2) format('woff2');font-weight:600;font-display:swap}
:root{--tab-h:64px;--paper:#F6EFE6;--card:#FFFAF4;--sand:#E8DFD3;--stone:#C9C2BA;--taupe:#8C8178;--ink:#3B2F2F;--muted:#8A7E76;--line:#E6DCD1;--pink:#E9C4C8;--amber:#B5763A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Lora',Georgia,serif;background:var(--paper);color:var(--ink)}
.sk{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#chips{display:none;gap:8px;overflow-x:auto;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));background:var(--paper);border-bottom:1px solid var(--line);scrollbar-width:none;flex:0 0 auto}
#chips::-webkit-scrollbar{display:none}
#chips.on{display:flex}
#chips button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--stone);border-radius:999px;padding:7px 15px;font:500 14px/1 'Lora',Georgia,serif;background:var(--card);color:var(--ink);min-height:38px}
#chips button .sk{width:18px;height:18px}
#chips button.on{background:var(--sand);border-color:var(--taupe);box-shadow:inset 0 -2px 0 var(--pink)}
#stage{position:relative;flex:1 1 auto;min-height:0}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--paper);visibility:hidden}
#stage iframe.on{visibility:visible}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 28px/1 'Cormorant',Georgia,serif;font-style:italic;color:var(--taupe);pointer-events:none}
nav#tabs{flex:0 0 auto;display:flex;justify-content:space-around;align-items:stretch;background:rgba(255,250,244,.97);border-top:1px solid var(--line);box-shadow:0 -8px 24px -18px rgba(59,47,47,.35);padding:4px 2px;padding-bottom:max(4px,env(safe-area-inset-bottom));min-height:var(--tab-h);position:relative}
nav#tabs button{flex:1 1 0;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 3px;font-family:inherit;font-size:9.5px;font-weight:500;color:var(--muted);letter-spacing:-.1px}
nav#tabs button .ic{display:grid;place-items:center;width:40px;height:30px;border-radius:999px;transition:background .2s,transform .15s}
nav#tabs button.on{color:var(--ink)}
nav#tabs button.on .ic{background:var(--sand);box-shadow:inset 0 -2px 0 var(--pink)}
nav#tabs button.on .sk{stroke-width:1.5}
nav#tabs button span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
nav#tabs button.on span.t{font-weight:600}
#lvbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;padding-top:max(5px,env(safe-area-inset-top));background:var(--paper);border-bottom:1px dashed var(--stone)}
#lvbar .lt{font:600 18px/1 Cormorant,Georgia,serif}#lvbar .lt i{font:400 15px/1 Caveat,cursive;color:#C98F96;margin-left:4px}
#lvbar .seg{display:flex;border:1.3px solid var(--ink);border-radius:999px;overflow:hidden}
#lvbar .seg button{border:0;background:var(--card);font:600 14px/1 Lora,Georgia,serif;color:var(--ink);padding:6px 14px}
#lvbar .seg button.on{background:var(--pink)}
#chips{padding-top:10px!important}
#lesBadge{position:absolute;right:8px;bottom:8px;z-index:5;display:none}

/* ---- bloom shell ---- */
html,body{background:#FBF4EE!important}
#lvbar{padding:10px 16px 8px!important;padding-top:max(10px,env(safe-area-inset-top))!important;border-bottom:0!important;background:transparent!important;gap:10px}
#lvbar .lt{display:flex;flex-direction:column;gap:2px;font:600 24px/1 'Fraunces',Georgia,serif!important;letter-spacing:-.03em}
#lvbar .lt i{font:600 20px/1 'Caveat',cursive!important;color:#C2577A!important;margin:0!important}
#lvbar .lt small{font:700 9.5px/1 'DM Sans',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#8E7884}
#lvmeta{display:flex;align-items:center;gap:8px}
#streak{display:flex;align-items:center;gap:4px;font:700 13px/1 'DM Sans',sans-serif;color:#C2577A;background:#FBE4E6;border-radius:999px;padding:7px 10px}
#streak .sk{width:16px;height:16px}
#lvbar .seg{border:0!important;background:#F3E1DE;padding:3px;border-radius:999px!important;position:relative}
#lvbar .seg button{background:transparent!important;font:700 13.5px/1 'DM Sans',sans-serif!important;padding:8px 13px!important;border-radius:999px;color:#7A5C66!important;transition:all .25s}
#lvbar .seg button.on{background:#2E2230!important;color:#FFF6F3!important;box-shadow:0 4px 10px -4px rgba(46,34,48,.5)}
#chips{background:transparent!important;border-bottom:0!important;padding:4px 14px 10px!important}
#chips button{border:1.5px solid #EBCFCC!important;background:#FFFDFB!important;font:600 13.5px/1 'DM Sans',sans-serif!important;color:#2E2230!important}
#chips button.on{background:#2E2230!important;color:#FFF6F3!important;border-color:#2E2230!important;box-shadow:none!important}
#stage{margin:0 0 0;border-radius:26px 26px 0 0;overflow:hidden;box-shadow:0 -1px 0 #F0DEDA}
#stage iframe{background:#FBF4EE!important}
#loading{font:italic 500 26px/1 'Fraunces',Georgia,serif!important;color:#C2577A!important}
nav#tabs{margin:0;background:rgba(255,253,251,.96)!important;backdrop-filter:blur(12px);border-top:1px solid #F0DEDA!important;box-shadow:0 -10px 30px -20px rgba(160,70,100,.4)!important}
nav#tabs button{font:600 9px/1.1 'DM Sans',sans-serif!important;color:#9C7F86!important;letter-spacing:-.02em!important}
nav#tabs button .ic{width:44px!important;height:30px!important}
nav#tabs button.on{color:#2E2230!important}
nav#tabs button.on .ic{background:#F6CBD3!important;box-shadow:none!important;color:#2E2230;animation:tabpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tabpop{0%{transform:scale(.7)}100%{transform:scale(1)}}

@font-face{font-family:'Fraunces';src:url(app/fonts/fraunces.woff2) format('woff2');font-weight:300 800;font-style:normal;font-display:swap}
@font-face{font-family:'Fraunces';src:url(app/fonts/fraunces-i.woff2) format('woff2');font-weight:300 800;font-style:italic;font-display:swap}
@font-face{font-family:'DM Sans';src:url(app/fonts/dmsans.woff2) format('woff2');font-weight:300 800;font-style:normal;font-display:swap}
@font-face{font-family:'DM Sans';src:url(app/fonts/dmsans-i.woff2) format('woff2');font-weight:300 800;font-style:italic;font-display:swap}
:root{
  --paper:#FBF4EE!important;--paper2:#F7ECE4!important;--card:#FFFDFB!important;--sand:#F5E3DF!important;--stone:#E9CFCB!important;
  --taupe:#9C7F86!important;--taupe-d:#7A5C66!important;--ink:#2E2230!important;--ink2:#4A3A4C!important;--text:#2E2230!important;--muted:#8E7884!important;--line:#F0DEDA!important;
  --blush:#FBE4E6!important;--pink:#F6CBD3!important;--pinkd:#D46F8A!important;--rose:#D46F8A!important;--amber:#C2577A!important;--amber-soft:#FBE4E6!important;
  --green:#5E8C6A!important;--green-soft:#E3F0E4!important;--ok:#DDEFE0!important;--red:#C0485F!important;--red-soft:#FCE4E8!important;
  --serif:'Fraunces',Georgia,serif!important;--font:'DM Sans',system-ui,-apple-system,sans-serif!important;--script:'Caveat',cursive!important;
  --shadow:0 1px 2px rgba(120,60,80,.06),0 12px 30px -14px rgba(160,70,100,.28)!important;
  --shadow-lg:0 2px 6px rgba(120,60,80,.08),0 22px 44px -18px rgba(160,70,100,.34)!important;
  --radius:22px!important;--radius-sm:14px!important;
  --b-deep:#C2577A;--b-sage:#8DB398;--b-lav:#D9CBEA;--b-butter:#FBEBC4;
}
html,body{font-family:'DM Sans',system-ui,-apple-system,sans-serif!important;color:var(--ink);letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
html{background:#FBF4EE!important;min-height:100%}
html body{min-height:100vh;background-color:#FBF4EE!important;background-image:radial-gradient(1200px 500px at 110% -10%,rgba(246,203,211,.45),transparent 60%),radial-gradient(900px 500px at -20% 110%,rgba(217,203,234,.35),transparent 60%)!important;background-attachment:fixed!important}
h1,h2,h3,.base h2,.card h2,#top h1,.dhead b,.lt{font-family:'Fraunces',Georgia,serif!important;font-weight:600!important;letter-spacing:-.02em!important;color:var(--ink)}
h1{font-size:clamp(28px,8vw,36px)!important;line-height:1.02!important}
h1 i,#top h1 i,.lt i{font-family:'Caveat',cursive!important;font-weight:600!important;color:var(--b-deep)!important;letter-spacing:0!important}
h2{line-height:1.1!important}
.hand,.base p,.rbox .h{font-family:'Caveat',cursive!important;color:var(--b-deep)!important}
small,.sub,.tag{color:var(--muted)!important}
.tag{font-family:'DM Sans',sans-serif!important;font-weight:700!important;letter-spacing:.14em!important;font-size:10.5px!important}
button,input,select,textarea{font-family:'DM Sans',system-ui,sans-serif!important}
.sk{stroke-width:1.5!important}
/* tarjetas */
.card:not(section),.in{border:1px solid #F0D9D6!important;border-radius:24px!important;box-shadow:var(--shadow)!important;background:#FFFDFB!important}
.base{background:#FFFDFB!important;border-bottom:1.5px dashed var(--pink)!important}
.step{background:linear-gradient(135deg,#F6CBD3,#FBE4E6)!important;border:0!important;color:var(--b-deep)!important;font-family:'Fraunces',serif!important;font-style:italic!important}
/* botones */
.btn,a.btn{border:0!important;background:var(--ink)!important;color:#FFF6F3!important;border-radius:999px!important;font-weight:600!important;box-shadow:0 6px 16px -8px rgba(46,34,48,.55)!important;transition:transform .15s ease,box-shadow .15s}
.btn:active{transform:scale(.96)}
.btn.sec2,.btn.ok{background:#FFFDFB!important;color:var(--ink)!important;border:1.5px solid var(--ink)!important;box-shadow:none!important}
.btn.done{background:var(--b-sage)!important;color:#fff!important;border-color:var(--b-sage)!important}
.au{border:0!important;background:var(--blush)!important;color:var(--b-deep)!important;box-shadow:inset 0 0 0 1.5px rgba(194,87,122,.35)!important;transition:transform .15s}
.au:active{transform:scale(.9)}
.au.play,.au.say{background:var(--b-deep)!important;color:#fff!important;animation:bl-ring 1.1s ease-out infinite}
@keyframes bl-ring{0%{box-shadow:0 0 0 0 rgba(194,87,122,.5)}100%{box-shadow:0 0 0 12px rgba(194,87,122,0)}}
.pill,.les button,.tabs2 button{border:1.5px solid #EBCFCC!important;background:#FFFDFB!important;color:var(--ink)!important;font-weight:600!important;transition:all .2s}
.pill.on,.les button.on,.tabs2 button.on{background:var(--ink)!important;color:#FFF6F3!important;border-color:var(--ink)!important}
.opts button{border:1.5px solid #EBCFCC!important;background:#FFFDFB!important;border-radius:16px!important;transition:transform .15s,background .2s}
.opts button:active{transform:scale(.98)}
.opts button.ok{background:var(--ok)!important;border-color:var(--b-sage)!important;animation:bl-pop .4s}
.opts button.no{background:var(--red-soft)!important;border-color:var(--red)!important;animation:bl-shake .4s}
@keyframes bl-pop{50%{transform:scale(1.04)}}
@keyframes bl-shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.bar{background:var(--sand)!important;height:10px!important;border-radius:9px!important}
.bar i{background:linear-gradient(90deg,var(--pink),var(--b-deep))!important;transition:width .5s cubic-bezier(.2,.8,.2,1)}
textarea{border:1.5px solid #EBCFCC!important;border-radius:16px!important;background-color:#FFFDFB!important}
