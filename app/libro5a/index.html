os tienen un significado parecido, hay que tener en cuenta que no son exactamente iguales."], ["For example, \"old\" can be applied to people advanced in age (an old man), or applied to things not recent or modern (some old clothes).", "Por ejemplo, \"old\" se aplica a personas de edad avanzada (un señor mayor) o a cosas que no son recientes ni modernas (ropa vieja)."], ["In contrast, \"ancient\" is used to describe something that has existed for many years (an ancient tree), or something related to a time early in history (an ancient civilization).", "En cambio, \"ancient\" describe algo que existe desde hace muchísimos años (un árbol milenario) o algo de una época muy antigua de la historia (una civilización antigua)."], ["Likewise, the antonyms of \"old\" and \"ancient\" have special considerations.", "Asimismo, los antónimos de \"old\" y \"ancient\" tienen sus particularidades."], ["\"New\" is generally applied to things recent or modern (a new car), but when describing people \"young\" is the best option (a young lady).", "\"New\" se aplica en general a cosas recientes o modernas (un coche nuevo), pero para describir personas la mejor opción es \"young\" (una muchacha joven)."], ["In the coming lessons you will increase your vocabulary by learning more about the effective use of synonyms in the English language.", "En las próximas lecciones vas a aumentar tu vocabulario aprendiendo a usar bien los sinónimos en inglés."], ["Vocabulary", "Vocabulario"], ["synonyms = sinónimos", "Significa: sinónimos"], ["\"Old\" and \"ancient\" are synonyms.", "\"Old\" y \"ancient\" son sinónimos."], ["nearly = casi", "Significa: casi"], ["Synonyms have nearly the same meaning.", "Los sinónimos tienen casi el mismo significado."], ["ancient = antiguo", "Significa: antiguo"], ["Teotihuacan is an ancient city.", "Teotihuacan es una ciudad antigua."], ["therefore = por lo tanto", "Significa: por lo tanto"], ["It was raining; therefore, we stayed home.", "Estaba lloviendo; por lo tan m.", "Vimos una gran película."], ["enjoyed = disfrutó", "Significa: disfrutó"], ["I enjoyed the movie a lot.", "Disfruté mucho la película."]]}, "9": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Listening Practice: For each item, you will hear 4 ideas. Consider which one best describes the image shown on the screen, and circle the letter of the answer (a, b, c, or d) in your Student's Book.", "Práctica auditiva: en cada número vas a escuchar 4 ideas. Piensa cuál describe mejor la imagen que aparece en la pantalla y encierra la letra de la respuesta (a, b, c o d) en tu libro."], ["1.- a) Two men are climbing.", "1.- a) Dos hombres están escalando."], ["b) He is walking up the stairs.", "b) Él va subiendo las escaleras."], ["c) There is a man scaling the mountain.", "c) Hay un hombre escalando la montaña."], ["d) She doesn't know where to go.", "d) Ella no sabe a dónde ir."], ["2.- a) The woman is saying something.", "2.- a) La mujer está diciendo algo."], ["b) Both are writing on a paper.", "b) Los dos están escribiendo en un papel."], ["c) The man is shouting at her.", "c) El hombre le está gritando."], ["d) These people are ready to go.", "d) Estas personas están listas para irse."], ["3.- a) There are three men playing baseball.", "3.- a) Hay tres hombres jugando beisbol."], ["b) Someone will throw a football.", "b) Alguien va a lanzar un balón de americano."], ["c) He is going to hurdle something.", "c) Va a saltar un obstáculo."], ["d) Two men are running away quickly.", "d) Dos hombres se van corriendo rápido."], ["4.- a) That lady is enjoying her food.", "4.- a) Esa señora está disfrutando su comida."], ["b) She has finished eating her lunch.", "b) Ya terminó de comer."], ["c) There's something for dessert.", "c) Hay algo de postre."], ["d) She doesn't like what she is eating.", "d) No le gusta lo que está comiendo."], ["5.- a) Nobody knows the answer.", "5.- a) Nadie sabe la respuesta."], ["b) Two boys are taking class.", "b) Dos niños están tomando clase."], ["c) A boy and a girl are leaving the classroom.", "c) Un niño y una niña están saliendo del salón."], ["d) Two students want to answer the question.", "d) Dos alumnos quieren contestar la pregunta."], ["6.- a) There are more than three vehicles on the road.", "6.- a) Hay más de tres vehículos en el camino."], ["b) Three cars are parking in the street.", "b) Tres coches se están estacionando en la calle."], ["c) An orange car is coming.", "c) Viene un coche naranja."], ["d) Those cars have passed the trucks.", "d) Esos coches ya rebasaron a los camiones."], ["7.- a) A man is standing by the stones.", "7.- a) Un hombre está parado junto a las piedras."], ["b) Someone is hiding a treasure.", "b) Alguien está escondiendo un tesoro."], ["c) The archaeologist discovered something.", "c) El arqueólogo descubrió algo."], ["d) He is looking at his notes.", "d) Está viendo sus apuntes."], ["8.- a) Two people are hurling.", "8.- a) Dos personas están lanzando con fuerza."], ["b) She is training for a football game.", "b) Ella está entrenando para un partido de americano."], ["c) A lady is jumping over a vehicle.", "c) Una señora está saltando sobre un vehículo."], ["d) The coach is watching her hurdle.", "d) El entrenador la está viendo saltar las vallas."], ["9.- a) The kids are playing with a green ball.", "9.- a) Los niños están jugando con una pelota verde."], ["b) There is a big fish on the beach.", "b) Hay un pez grande en la playa."], ["c) No one is playing with that little kid.", "c) Nadie está jugando con ese niño."], ["d) The little boy ran into the ocean.", "d) El niño se metió corriendo al mar."], ["10.- a) The road is full of ancient cars.", "10.- a) El camino está lleno de coches antiguos."], ["b) Only some of the vehicles are white.", "b) Solo algunos de los vehículos son blancos."], ["c) Traffic is not a problem.", "c) El tráfico no es problema."], ["d) No one is driving slowly.", "d) Nadie va manejando despacio."]], "notes": ["La respuesta depende de la imagen que proyecta tu teacher en la pantalla; escucha las 4 ideas y elige la que la describe."], "tp": [{"n": 1, "q": ["What are they doing? Where are they?", "¿Qué están haciendo? ¿Dónde están?"], "o": [{"l": "a", "ans": ["Yes, I'm sure. I see two men, and they are going up a rock.", "Sí, estoy segura. Veo a dos hombres y van subiendo una roca."], "en": "Two men are climbing.", "es": "Dos hombres están escalando."}, {"l": "b", "ans": ["I think it's b, because he is going up some stairs, not a mountain.", "Creo que es la b, porque va subiendo unas escaleras, no una montaña."], "en": "He is walking up the stairs.", "es": "Él va subiendo las escaleras."}, {"l": "c", "ans": ["It's c, because there is only one man and he is climbing a mountain.", "Es la c, porque solo hay un hombre y está escalando una montaña."], "en": "There is a man scaling the mountain.", "es": "Hay un hombre escalando la montaña."}, {"l": "d", "ans": ["It looks like d, because she looks confused, like she is lost.", "Parece la d, porque se ve confundida, como perdida."], "en": "She doesn't know where to go.", "es": "Ella no sabe a dónde ir."}], "w": [["climbing", "CLÁI-ming", "escalando", "la b no suena"]]}, {"n": 2, "q": ["Who is talking? What is he doing?", "¿Quién está hablando? ¿Qué está haciendo él?"], "o": [{"l": "a", "ans": ["It's a, because the woman is talking and the man is listening.", "Es la a, porque la mujer está hablando y el hombre está escuchando."], "en": "The woman is saying something.", "es": "La mujer está diciendo algo."}, {"l": "b", "ans": ["I chose b, because they both have a pen and a paper.", "Elegí la b, porque los dos tienen una pluma y un papel."], "en": "Both are writing on a paper.", "es": "Los dos están escribiendo en un papel."}, {"l": "c", "ans": ["I'm sure it's c, because he looks angry and his mouth is wide open.", "Estoy segura de que es la c, porque se ve enojado y tiene la boca muy abierta."], "en": "The man is shouting at her.", "es": "El hombre le está gritando."}, {"l": "d", "ans": ["It's d, because they have their bags and jackets ready.", "Es la d, porque tienen sus bolsas y chamarras listas."], "en": "These people are ready to go.", "es": "Estas personas están listas para irse."}], "w": []}, {"n": 3, "q": ["What sport is it? What is he going to do?", "¿Qué deporte es? ¿Qué va a hacer?"], "o": [{"l": "a", "ans": ["It's a, because I can see three men with bats and a baseball.", "Es la a, porque veo a tres hombres con bates y una pelota de beisbol."], "en": "There are three men playing baseball.", "es": "Hay tres hombres jugando beisbol."}, {"l": "b", "ans": ["I think it's b, because he is holding a football and lifting his arm.", "Creo que es la b, porque tiene un balón de americano y está levantando el brazo."], "en": "Someone will throw a football.", "es": "Alguien va a lanzar un balón de americano."}, {"l": "c", "ans": ["It's c, because he is running toward a hurdle.", "Es la c, porque va corriendo hacia una valla."], "en": "He is going to hurdle something.", "es": "Va a saltar un obstáculo."}, {"l": "d", "ans": ["I'm sure it's d, because two men are running away fast.", "Estoy segura de que es la d, porque dos hombres se van corriendo rápido."], "en": "Two men are running away quickly.", "es": "Dos hombres se van corriendo rápido."}], "w": [["hurdle", "JÉR-dl", "saltar una valla", "la r suena al final de la boca"]]}, {"n": 4, "q": ["How does she feel about her food?", "¿Cómo se siente con su comida?"], "o": [{"l": "a", "ans": ["It's a, because she is smiling while she eats.", "Es la a, porque está sonriendo mientras come."], "en": "That lady is enjoying her food.", "es": "Esa señora está disfrutando su comida."}, {"l": "b", "ans": ["It's b, because her plate is empty.", "Es la b, porque su plato está vacío."], "en": "She has finished eating her lunch.", "es": "Ya terminó de comer."}, {"l": "c", "ans": ["I chose c, because there is a cake on the table.", "Elegí la c, porque hay un pastel en la mesa."], "en": "There's something for dessert.", "es": "Hay algo de postre."}, {"l": "d", "ans": ["Yes, I'm sure it's d, because she is making a face, she doesn't like it.", "Sí, estoy segura de que es la d, porque está haciendo una mueca; no le gusta."], "en": "She doesn't like what she is eating.", "es": "No le gusta lo que está comiendo."}], "w": []}, {"n": 5, "q": ["Who are the students? What are they doing?", "¿Quiénes son los alumnos? ¿Qué están haciendo?"], "o": [{"l": "a", "ans": ["It's a, because the students look confused and nobody raises a hand.", "Es la a, porque los alumnos se ven confundidos y nadie levanta la mano."], "en": "Nobody knows the answer.", "es": "Nadie sabe la respuesta."}, {"l": "b", "ans": ["It's b, because two boys are sitting at their desks.", "Es la b, porque dos niños están sentados en sus pupitres."], "en": "Two boys are taking class.", "es": "Dos niños están tomando clase."}, {"l": "c", "ans": ["I think it's c, because a boy and a girl are walking out the door.", "Creo que es la c, porque un niño y una niña van saliendo por la puerta."], "en": "A boy and a girl are leaving the classroom.", "es": "Un niño y una niña están saliendo del salón."}, {"l": "d", "ans": ["I'm sure it's d, because two students are raising their hands.", "Estoy segura de que es la d, porque dos alumnos están levantando la mano."], "en": "Two students want to answer the question.", "es": "Dos alumnos quieren contestar la pregunta."}], "w": []}, {"n": 6, "q": ["How many vehicles are there? What are they doing?", "¿Cuántos vehículos hay? ¿Qué están haciendo?"], "o": [{"l": "a", "ans": ["It's a, because I can count more than three vehicles on the road.", "Es la a, porque cuento más de tres vehículos en el camino."], "en": "There are more than three vehicles on the road.", "es": "Hay más de tres vehículos en el camino."}, {"l": "b", "ans": ["It's b, because three cars are stopping next to the sidewalk.", "Es la b, porque tres coches se están parando junto a la banqueta."], "en": "Three cars are parking in the street.", "es": "Tres coches se están estacionando en la calle."}, {"l": "c", "ans": ["I chose c, because there is an orange car coming toward us.", "Elegí la c, porque viene un coche naranja hacia nosotros."], "en": "An orange car is coming.", "es": "Viene un coche naranja."}, {"l": "d", "ans": ["It's d, because the cars are in front of the trucks now.", "Es la d, porque los coches ya van delante de los camiones."], "en": "Those cars have passed the trucks.", "es": "Esos coches ya rebasaron a los camiones."}], "w": [["vehicles", "VÍ-i-kls", "vehículos", "la h no suena"]]}, {"n": 7, "q": ["What is the man doing? What thing is he looking at?", "¿Qué está haciendo el hombre? ¿Qué cosa está viendo?"], "o": [{"l": "a", "ans": ["It's a, because he is standing next to some big stones.", "Es la a, porque está parado junto a unas piedras grandes."], "en": "A man is standing by the stones.", "es": "Un hombre está parado junto a las piedras."}, {"l": "b", "ans": ["I think it's b, because someone is putting a box under the ground.", "Creo que es la b, porque alguien está metiendo una caja bajo tierra."], "en": "Someone is hiding a treasure.", "es": "Alguien está escondiendo un tesoro."}, {"l": "c", "ans": ["I'm sure it's c, because he found something old and he looks surprised.", "Estoy segura de que es la c, porque encontró algo antiguo y se ve sorprendido."], "en": "The archaeologist discovered something.", "es": "El arqueólogo descubrió algo."}, {"l": "d", "ans": ["It's d, because he is reading his notebook.", "Es la d, porque está leyendo su cuaderno."], "en": "He is looking at his notes.", "es": "Está viendo sus apuntes."}], "w": [["archaeologist", "ar-ki-Ó-lo-yist", "arqueólogo", "\"ch\" suena k"]]}, {"n": 8, "q": ["What is she doing? Who is watching her?", "¿Qué está haciendo ella? ¿Quién la está viendo?"], "o": [{"l": "a", "ans": ["It's a, because two people are throwing something very hard.", "Es la a, porque dos personas están lanzando algo con mucha fuerza."], "en": "Two people are hurling.", "es": "Dos personas están lanzando con fuerza."}, {"l": "b", "ans": ["It's b, because she has a football and a helmet.", "Es la b, porque tiene un balón de americano y un casco."], "en": "She is training for a football game.", "es": "Ella está entrenando para un partido de americano."}, {"l": "c", "ans": ["I chose c, because she is jumping over a car.", "Elegí la c, porque está saltando sobre un coche."], "en": "A lady is jumping over a vehicle.", "es": "Una señora está saltando sobre un vehículo."}, {"l": "d", "ans": ["Yes, I'm sure it's d, because the coach is watching her jump the hurdles.", "Sí, estoy segura de que es la d, porque el entrenador la está viendo saltar las vallas."], "en": "The coach is watching her hurdle.", "es": "El entrenador la está viendo saltar las vallas."}], "w": [["hurdle", "JÉR-dl", "saltar una valla", "la r suena al final de la boca"], ["throwing", "ZRÓU-ing", "lanzando", "\"thr\": lengua entre los dientes y luego r"]]}, {"n": 9, "q": ["Where is the boy? What is he doing?", "¿Dónde está el niño? ¿Qué está haciendo?"], "o": [{"l": "a", "ans": ["It's a, because the kids have a green ball.", "Es la a, porque los niños tienen una pelota verde."], "en": "The kids are playing with a green ball.", "es": "Los niños están jugando con una pelota verde."}, {"l": "b", "ans": ["It's b, because I can see a big fish on the sand.", "Es la b, porque veo un pez grande en la arena."], "en": "There is a big fish on the beach.", "es": "Hay un pez grande en la playa."}, {"l": "c", "ans": ["I think it's c, because the little kid is playing alone.", "Creo que es la c, porque el niño está jugando solo."], "en": "No one is playing with that little kid.", "es": "Nadie está jugando con ese niño."}, {"l": "d", "ans": ["I'm sure it's d, because the little boy is running into the water.", "Estoy segura de que es la d, porque el niño va corriendo hacia el agua."], "en": "The little boy ran into the ocean.", "es": "El niño se metió corriendo al mar."}], "w": [["ocean", "ÓU-shan", "océano", "\"ce\" suena sh"]]}, {"n": 10, "q": ["What kind of cars are they? Is there traffic?", "¿Qué tipo de coches son? ¿Hay tráfico?"], "o": [{"l": "a", "ans": ["It's a, because all the cars look very old.", "Es la a, porque todos los coches se ven muy viejos."], "en": "The road is full of ancient cars.", "es": "El camino está lleno de coches antiguos."}, {"l": "b", "ans": ["I chose b, because only some cars are white and the others are different colors.", "Elegí la b, porque solo algunos coches son blancos y los demás son de otros colores."], "en": "Only some of the vehicles are white.", "es": "Solo algunos de los vehículos son blancos."}, {"l": "c", "ans": ["It's c, because the road is almost empty.", "Es la c, porque el camino está casi vacío."], "en": "Traffic is not a problem.", "es": "El tráfico no es problema."}, {"l": "d", "ans": ["It's d, because all the cars are going fast.", "Es la d, porque todos los coches van rápido."], "en": "No one is driving slowly.", "es": "Nadie va manejando despacio."}], "w": [["vehicles", "VÍ-i-kls", "vehículos", "la h no suena"]]}]}, "10": {"tr": [["11.- a) He said he is leaving.", "11.- a) Dijo que se va."], ["b) He announced something sad.", "b) Anunció algo triste."], ["c) A man behind him is laughing.", "c) Un hombre detrás de él se está riendo."], ["d) He is speaking in front of people.", "d) Está hablando frente a la gente."], ["12.- a) Many kids are doing their homework.", "12.- a) Muchos niños están haciendo su tarea."], ["b) These children have dirty uniforms.", "b) Estos niños tienen el uniforme sucio."], ["c) Men and women exercise at the gym.", "c) Hombres y mujeres hacen ejercicio en el gimnasio."], ["d) Some children are having fun.", "d) Unos niños se están divirtiendo."], ["13.- a) She is holding an empty glass.", "13.- a) Ella tiene en la mano un vaso vacío."], ["b) Oranges are good for you.", "b) Las naranjas son buenas para ti."], ["c) Her glass is full of liquid.", "c) Su vaso está lleno de líquido."], ["d) She needs more orange juice.", "d) Necesita más jugo de naranja."], ["14.- a) A tiny building has no room.", "14.- a) Un edificio diminuto no tiene espacio."], ["b) There are three empty rooms.", "b) Hay tres cuartos vacíos."], ["c) This is a vacant apartment.", "c) Este es un departamento desocupado."], ["d) The apartment door is locked.", "d) La puerta del departamento está cerrada con llave."], ["15.- a) The ball is too big to win.", "15.- a) La pelota es demasiado grande para ganar."], ["b) The boy will toss a red ball to the girl.", "b) El niño le va a aventar una pelota roja a la niña."], ["c) His ball is going to break a window.", "c) Su pelota va a romper una ventana."], ["d) The girl cannot see where the ball went.", "d) La niña no ve a dónde se fue la pelota."], ["Each of the following ideas has an underlined word. From the options (a, b, c, or d) choose the correct synonym and underline it.", "Cada una de las siguientes ideas tiene una palabra subrayada. De las opciones (a, b, c o d), elige el sinónimo correcto y subráyalo."], ["1.- Those athletes are jumping the obstacles very quickly. a) running b) passing c) hurdling d) walking", "1.- Esos atletas están saltando los obstáculos muy rápido. a) corriendo b) pasando c) saltando vallas d) caminando"], ["2.- Oh! You have a beautiful small baby. a) teeny b) curious c) big d) little", "2.- ¡Ay! Tienes un bebé pequeño y precioso. a) chiquitito b) curioso c) grande d) pequeño"], ["3.- After the joke, he couldn't laugh aloud, so he just chuckled softly. a) cried b) giggled c) shouted d) smiled", "3.- Después del chiste no pudo reírse en voz alta, así que solo se rio bajito. a) lloró b) se rio con risita c) gritó d) sonrió"], ["4.- That player has a lot of speed in his arm. He can definitely throw that ball. a) hurl b) pass c) toss d) push", "4.- Ese jugador tiene mucha velocidad en el brazo. Definitivamente puede lanzar esa pelota. a) lanzar con fuerza b) pasar c) aventar suave d) empujar"], ["5.- I've been looking for my sweater all morning, but I can't find it. a) see b) discover c) hide d) locate", "5.- Llevo toda la mañana buscando mi suéter, pero no lo encuentro. a) ver b) descubrir c) esconder d) localizar"]]}, "11": {"tr": [["6.- If you want to reach the third floor, you have to go up the stairs. a) assume b) ascend c) scale d) descend", "6.- Si quieres llegar al tercer piso, tienes que subir las escaleras. a) suponer b) ascender c) escalar d) descender"], ["7.- The lawyer asked about all the things the thief took. a) told b) accused c) inquired d) surprised", "7.- El abogado preguntó por todas las cosas que se llevó el ladrón. a) dijo b) acusó c) indagó d) sorprendió"], ["8.- Mr. Jones was happy when the Doctor told him it was his final treatment of the year. a) first b) routine c) end d) last", "8.- El señor Jones se puso feliz cuando el doctor le dijo que era su último tratamiento del año. a) primero b) de rutina c) fin d) último"], ["9.- Everybody was surprised when the old lady ran the competition. a) ancient b) young c) antique d) beautiful", "9.- Todos se sorprendieron cuando la señora mayor corrió en la competencia. a) antigua b) joven c) antigua (objeto) d) hermosa"], ["10.- I was dialing Betty's number, but her line was occupied. a) ringing b) busy c) not working d) off", "10.- Estaba marcando el número de Betty, pero su línea estaba ocupada. a) sonando b) ocupada c) sin servicio d) apagada"], ["11.- At Christmas time, stores are full of people buying many gifts. a) selling b) looking c) purchasing d) taking", "11.- En Navidad las tiendas están llenas de gente comprando muchos regalos. a) vendiendo b) mirando c) adquiriendo d) tomando"], ["12.- When the soccer game was over, the winning team got a trophy. a) started b) finished c) beginning d) late", "12.- Cuando terminó el partido de futbol, el equipo ganador recibió un trofeo. a) empezó b) terminó c) comenzando d) tarde"], ["13.- Chris and Susan are sure they will find an empty apartment soon. a) full b) occupied c) ugly d) unoccupied", "13.- Chris y Susan están seguros de que pronto encontrarán un departamento vacío. a) lleno b) ocupado c) feo d) desocupado"], ["14.- All the students in the classroom questioned the teacher for their test scores. a) asked b) said c) stated d) wanted", "14.- Todos los alumnos del salón le preguntaron al maestro por sus calificaciones. a) preguntaron b) dijeron c) afirmaron d) quisieron"], ["15.- The kids were frightened after watching the scary movie. a) laughing b) nervous c) careful d) terrified", "15.- Los niños quedaron asustados después de ver la película de terror. a) riéndose b) nerviosos c) cuidadosos d) aterrados"]], "notes": ["Synonym = misma idea (old = ancient). Antonym = idea contraria (old ≠ new).", "little / tiny / teeny = pequeño · scared / frightened / terrified = asustado", "laugh / giggle / chuckle = reír · throw / toss / hurl = lanzar", "find / discover / locate = encontrar · climb / scale / ascend = subir", "empty / vacant / unoccupied = vacío · ask / inquire / question = preguntar"]}, "12": {"tr": [["Following your teacher's directions, write a short composition about \"synonyms\".", "Siguiendo las instrucciones de tu teacher, escribe una composición corta sobre los \"sinónimos\"."], ["INTRODUCTION / BODY / CONCLUSION", "INTRODUCCIÓN / DESARROLLO / CONCLUSIÓN"]]}, "13": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Miguel de Cervantes Saavedra was born in Alcalá de Henares, near Madrid.", "Miguel de Cervantes Saavedra nació en Alcalá de Henares, cerca de Madrid."], ["During his life, he wrote many novels and plays. Don Quixote is the most famous novel that he wrote.", "A lo largo de su vida escribió muchas novelas y obras de teatro. El Quijote es la novela más famosa que escribió."], ["It was first published in 1605, and is still considered one of the most influential works of classical literature.", "Se publicó por primera vez en 1605 y todavía se considera una de las obras más influyentes de la literatura clásica."], ["The novel Don Quixote tells the story of Alonso Quijana, a thin country gentleman who reads many books.", "La novela del Quijote cuenta la historia de Alonso Quijana, un hidalgo de provincia, flaco, que lee muchos libros."], ["He begins to believe he's living in an imaginary world, changes his name to \"Don Quixote de La Mancha\", and starts on a journey to find adventure with the help of his friend Sancho Panza.", "Empieza a creer que vive en un mundo imaginario, se cambia el nombre a \"Don Quijote de La Mancha\" y emprende un viaje en busca de aventuras con la ayuda de su amigo Sancho Panza."], ["Don Quixote has an interesting vision of the things happening around him.", "Don Quijote tiene una visión curiosa de lo que pasa a su alrededor."], ["He fights imaginary battles to make the world a better place, but the people he intends to help say that he is crazy.", "Pelea batallas imaginarias para hacer del mundo un lugar mejor, pero la gente a la que quiere ayudar dice que está loco."], ["Prepare yourself to see and hear this fantastic story now in English, and improve your speaking and listening skills along the way.", "Prepárate para ver y escuchar esta historia fantástica ahora en inglés, y mejora tu expresión oral y tu comprensión auditiva en el camino."], ["Vocabulary", "Vocabulario"], ["novels = novelas", "Significa: novelas"], ["Cervantes wrote many novels.", "Cervantes escribió muchas novelas."], ["published = publicado", "Significa: publicado"], ["Don Quixote was published in 1605.", "El Quijote se publicó en 1605."], ["influential = influyente", "Significa: influyente"], ["It is one of the most influential books.", "Es uno de los libros más influyentes."], ["classical literature = literatura clásica", "Significa: literatura clásica"], ["Don Quixote is classical literature.", "El Quijote es literatura clásica."], ["country = campo, de provincia", "Significa: campo, de provincia"], ["Alonso was a country gentleman.", "Alonso era un hidalgo de provincia."], ["journey = viaje, travesía", "Significa: viaje, travesía"], ["He started a long journey.", "Empezó un viaje largo."]]}, "14": {"tr": [["Vocabulary", "Vocabulario"], ["adventure = aventura", "Significa: aventura"], ["He wanted to find adventure.", "Quería encontrar aventuras."], ["vision = visión", "Significa: visión"], ["Don Quixote had a strange vision.", "Don Quijote tuvo una visión extraña."], ["battles = batallas", "Significa: batallas"], ["He fights imaginary battles.", "Pelea batallas imaginarias."], ["improve = mejorar", "Significa: mejorar"], ["I want to improve my English.", "Quiero mejorar mi inglés."], ["listening skills = habilidad para escuchar", "Significa: habilidad para escuchar"], ["Videos improve your listening skills.", "Los videos mejoran tu comprensión auditiva."], ["along the way = en el camino", "Significa: en el camino"], ["You will learn new words along the way.", "Aprenderás palabras nuevas en el camino."], ["stories = historias, cuentos", "Significa: historias, cuentos"], ["He reads stories about knights.", "Lee historias de caballeros."], ["knights = caballeros", "Significa: caballeros"], ["Knights protected the people.", "Los caballeros protegían a la gente."], ["brave = valiente", "Significa: valiente"], ["The knight was very brave.", "El caballero era muy valiente."], ["noble = noble", "Significa: noble"], ["He had a noble heart.", "Tenía un corazón noble."], ["armor = armadura", "Significa: armadura"], ["The knight wears armor.", "El caballero usa armadura."]]}, "15": {"tr": [["Vocabulary", "Vocabulario"], ["helmets = cascos", "Significa: cascos"], ["Football players wear helmets.", "Los jugadores de americano usan casco."], ["trouble = problema, apuro", "Significa: problema, apuro"], ["Superheroes save people in trouble.", "Los superhéroes salvan a gente en apuros."], ["saved = salvó", "Significa: salvó"], ["The knight saved the princess.", "El caballero salvó a la princesa."], ["giants = gigantes", "Significa: gigantes"], ["He thought the windmills were giants.", "Pensó que los molinos eran gigantes."], ["wicked = malvado", "Significa: malvado"], ["The wicked wizard laughed.", "El mago malvado se rio."], ["wizards = magos, hechiceros", "Significa: magos, hechiceros"], ["Wizards use magic.", "Los magos usan magia."], ["attacked = atacó", "Significa: atacó"], ["He attacked the windmills.", "Atacó los molinos de viento."], ["lances = lanzas", "Significa: lanzas"], ["Knights fought with lances.", "Los caballeros peleaban con lanzas."], ["swords = espadas", "Significa: espadas"], ["The soldiers had swords.", "Los soldados tenían espadas."], ["decided = decidió", "Significa: decidió"], ["He decided to become a knight.", "Decidió convertirse en caballero."], ["become = convertirse en", "Significa: convertirse en"], ["He wanted to become a knight.", "Quería convertirse en caballero."], ["fight = pelear", "Significa: pelear"], ["Knights fight for justice.", "Los caballeros luchan por la justicia."], ["justice = justicia", "Significa: justicia"], ["He fought for justice.", "Luchó por la justicia."]]}, "16": {"tr": [["Vocabulary", "Vocabulario"], ["found = encontró", "Significa: encontró"], ["He found an old suit of armor.", "Encontró una armadura vieja."], ["suit of armor = armadura", "Significa: armadura"], ["He put on a suit of armor.", "Se puso una armadura."], ["squire = escudero", "Significa: escudero"], ["Sancho Panza was his squire.", "Sancho Panza era su escudero."], ["named = llamado", "Significa: llamado"], ["He had a horse named Rocinante.", "Tenía un caballo llamado Rocinante."], ["rode = montó, cabalgó", "Significa: montó, cabalgó"], ["Sancho rode a donkey.", "Sancho montaba un burro."], ["donkey = burro", "Significa: burro"], ["The donkey was small and slow.", "El burro era pequeño y lento."]]}, "17": {"tr": la noche"], ["We spend the night in the forest.", "Pasamos la noche en el bosque."], ["falls off = se cae de", "Significa: se cae de"], ["He falls off his horse.", "Se cae de su caballo."], ["down the road = más adelante en el camino", "Significa: más adelante en el camino"], ["Down the road, there was an inn.", "Más adelante había una posada."], ["puts it on = se lo pone", "Significa: se lo pone"], ["He takes the helmet and puts it on.", "Toma el casco y se lo pone."]]}, "21": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Vocabulary", "Vocabulario"], ["cages = jaulas", "Significa: jaulas"], ["The lions were in cages.", "Los leones estaban en jaulas."], ["lions = leones", "Significa: leones"], ["The lions were hungry.", "Los leones tenían hambre."], ["trap = trampa", "Significa: trampa"], ["It was a trap.", "Era una trampa."], ["kill = matar", "Significa: matar"], ["He wanted to kill the lions.", "Quería matar a los leones."], ["guiding = guiando", "Significa: guiando"], ["Men were guiding some bulls.", "Unos hombres guiaban toros."], ["bulls = toros", "Significa: toros"], ["The bulls ran down the road.", "Los toros corrieron por el camino."], ["enemies = enemigos", "Significa: enemigos"], ["He fights with his enemies.", "Pelea con sus enemigos."], ["dangerous = peligroso", "Significa: peligroso"], ["Football is a dangerous sport.", "El americano es un deporte peligroso."], ["common = común", "Significa: común"], ["It is a common name.", "Es un nombre común."], ["wrong = incorrecto, mal", "Significa: incorrecto, mal"], ["Something is wrong.", "Algo está mal."]]}, "22": {"tr": [["Vocabulary", "Vocabulario"], ["gets off = se baja de", "Significa: se baja de"], ["He gets off his horse.", "Se baja de su caballo."], ["come out = salir", "Significa: salir"], ["Come out of the cage!", "¡Sal de la jaula!"], ["moves around = se mueve por ahí", "Significa: se mueve por ahí"], ["The lion moves around.", "El león se mueve de un lado a otro."], ["sticks his head out = saca la cabeza", "Significa: saca la cabeza"], ["The lion sticks his head out.", "El león saca la cabeza."], ["goes back = regresa", "Significa: regresa"], ["The lion goes back inside.", "El león vuelve a entrar."], ["run over = atropellar, pasar por encima", "Significa: atropellar, pasar por encima"], ["The bulls run over him.", "Los toros le pasan por encima."]]}, "23": {"tr": [["Spelling Quiz", "Dictado de ortografía: escribe las palabras que dicte tu teacher."], ["Directions: For each item, you will hear 4 ideas. Consider which one best describes the image shown on the screen, and circle the letter of the answer (a, b, c, or d) in your Student's Book.", "Instrucciones: en cada número vas a escuchar 4 ideas. Piensa cuál describe mejor la imagen que aparece en la pantalla y encierra la letra de la respuesta (a, b, c o d) en tu libro."], ["1.- a) The little boy is swimming.", "1.- a) El niño está nadando."], ["b) He is catching some fish.", "b) Está pescando."], ["c) The boy is crying.", "c) El niño está llorando."], ["d) He is throwing a stone into the water.", "d) Está aventando una piedra al agua."], ["2.- a) Several people are looking at the flock of sheep.", "2.- a) Varias personas están viendo el rebaño de ovejas."], ["b) The flock of goats is going uptown.", "b) El rebaño de cabras va hacia el centro."], ["c) The herd of cows is in the way.", "c) La manada de vacas está estorbando el paso."], ["d) People in the market are buying the sheep.", "d) La gente del mercado está comprando las ovejas."], ["3.- a) David is playing in the forest.", "3.- a) David está jugando en el bosque."], ["b) The boy is just about to sleep.", "b) El niño está a punto de dormirse."], ["c) He enjoys reading a book.", "c) Le gusta leer un libro."], ["d) The man is standing under a tree.", "d) El hombre está parado debajo de un árbol."], ["4.- a) The six warriors are attacking with their lances.", "4.- a) Los seis guerreros están atacando con s ial. Durante la digestión, la proteína se descompone en varios aminoácidos, que son esenciales para formar tejidos y producir energía."], ["In the following lessons we will increase our vocabulary and listening comprehension as we consider the importance of having good nutrition in a balanced diet.", "En las siguientes lecciones vamos a aumentar nuestro vocabulario y comprensión auditiva mientras vemos la importancia de una buena nutrición con una dieta balanceada."], ["Vocabulary", "Vocabulario"], ["nutrition = nutrición", "Significa: nutrición"], ["Good nutrition is important.", "Una buena nutrición es importante."], ["nutrients = nutrientes", "Significa: nutrientes"], ["Food gives us nutrients.", "La comida nos da nutrientes."], ["vitamins = vitaminas", "Significa: vitaminas"], ["Fruit has many vitamins.", "La fruta tiene muchas vitaminas."], ["minerals = minerales", "Significa: minerales"], ["Milk has minerals.", "La leche tiene minerales."], ["proteins = proteínas", "Significa: proteínas"], ["Meat has proteins.", "La carne tiene proteínas."]]}, "43": {"tr": [["Vocabulary", "Vocabulario"], ["iron = hierro", "Significa: hierro"], ["Spinach has iron.", "La espinaca tiene hierro."], ["hemoglobin = hemoglobina", "Significa: hemoglobina"], ["Iron helps make hemoglobin.", "El hierro ayuda a producir hemoglobina."], ["sodium = sodio", "Significa: sodio"], ["Too much sodium is bad.", "Mucho sodio hace daño."], ["heart attacks = infartos", "Significa: infartos"], ["Sodium can lead to heart attacks.", "El sodio puede provocar infartos."], ["insufficiencies = insuficiencias", "Significa: insuficiencias"], ["Vitamin insufficiencies cause problems.", "La falta de vitaminas causa problemas."], ["epileptic seizures = ataques epilépticos", "Significa: ataques epilépticos"], ["Some insufficiencies cause epileptic seizures.", "Algunas carencias provocan crisis epilépticas."], ["amino acids = aminoácidos", "Significa: aminoácidos"], ["Protein is broken down into amino acids.", "La rcise b) walks c) exercising d) walking", "8.- Los doctores generalmente recomiendan que la gente ___ diario. a) haga ejercicio b) camina c) haciendo ejercicio d) caminando"], ["9.- Foods from the Bread and Cereal Group ___ high in carbohydrates. a) be b) are c) is d) being", "9.- Los alimentos del grupo de panes y cereales ___ altos en carbohidratos. a) ser b) son c) es d) siendo"], ["10.- There are many ways to ___ the nutrients a person needs for good health. a) gets b) obtained c) get d) got", "10.- Hay muchas formas de ___ los nutrientes que una persona necesita para tener buena salud. a) obtiene b) obtenido c) obtener d) obtuvo"]], "notes": ["should / can / might / will + verbo simple: should complete, can increase, might cause.", "to + verbo simple: ways to get nutrients, help your body prevent.", "for + -ing: for building tissues.", "lose (perder) ≠ loose (flojo).", "Foods are high in carbohydrates (plural → are).", "recommend that people exercise (verbo simple).", "sodium → high blood pressure → heart attacks.", "saturated fats → increase cholesterol.", "empty calories = calorías sin nutrientes (soda, sweets).", "nutrient dense = muchos nutrientes en poca comida.", "supplements = suplementos.", "intake = consumo: reduce your sugar intake.", "vegetarians don't eat meat; they get protein from beans and nuts.", "steady = constante: keep a steady weight.", "nutritionists = nutriólogos.", "Food is fuel for your body.", "A balanced diet assures good health."]}, "55": {"tr": [["Following your teacher's directions, write a short composition about \"The Four Basic Food Groups\".", "Siguiendo las instrucciones de tu teacher, escribe una composición corta sobre \"Los cuatro grupos básicos de alimentos\"."], ["INTRODUCTION / BODY / CONCLUSION", "INTRODUCCIÓN / DESARROLLO / CONCLUSIÓN"]]}, "56": {"tr": [["Student's name / Teacher slot A / Teacher slot B / Course schedule / Date", "Nombre del alumno / Teacher del bloque A / Teacher del bloque B / Horario del curso / Fech
