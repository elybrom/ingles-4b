function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
var st={};try{st=JSON.parse(ls(FK)||'{}')||{}}catch(e){st={}}
if(!st.done)st.done={};
function save(){ls(FK,JSON.stringify(st))}
function lesson(){var n=+ls('ql_app_leccion_v1');if(n>=21&&n<=39)return n;
  try{var mc=JSON.parse(ls('ql_miclase_v1')||'null');if(mc&&mc.lesson>=21&&mc.lesson<=39)return mc.lesson}catch(e){}
  var c=+ls('ql_cuaderno_leccion_v1');return (c>=21&&c<=39)?c:22}
// voz: misma preferencia que la guía (ql_guia_voice_v2 = "nombre|lang"), si no, voz masculina
function score(v){var n=v.name||'';if(!/^en/i.test(v.lang||''))return 0;
  if(/\bAlex\b/i.test(n))return 100;if(/Microsoft (David|Guy|Mark)/i.test(n))return 98;if(/\bDaniel\b/i.test(n))return 96;if(/\bFred\b/i.test(n))return 94;if(/UK English Male/i.test(n))return 92;if(/male/i.test(n)&&!/female/i.test(n))return 80;return /en.US/i.test(v.lang)?20:10}
function voice(){var vs=(window.speechSynthesis&&speechSynthesis.getVoices())||[];var s=ls('ql_guia_voice_v2')||'';
  if(s){for(var i=0;i<vs.length;i++)if(vs[i].name+'|'+vs[i].lang===s)return vs[i]}
  return vs.slice().sort(function(a,b){return score(b)-score(a)})[0]||null}
function done(btn){if(btn)btn.classList.remove('play')}
function speak(t,btn){var f=AUDIO[t];
  try{window.speechSynthesis&&speechSynthesis.cancel()}catch(e){}
  if(f){try{AU.pause();AU.src='audio/frases/'+f;AU.currentTime=0;if(btn)btn.classList.add('play');
    AU.onended=function(){done(btn)};
    var p=AU.play();if(p&&p.catch)p.catch(function(){done(btn);tts(t,btn)});return}catch(e){}}
  tts(t,btn)}
function tts(t,btn){if(!window.speechSynthesis)return;speechSynthesis.cancel();
  t=t.replace(/^"[^"]*"\s*→\s*/,'').replace(/→/g,',');
  var u=new SpeechSynthesisUtterance(t),v=voice();u.lang=v?v.lang:'en-US';u.rate=.92;u.pitch=1;if(v)u.voice=v;
  if(btn){btn.classList.add('play');u.onend=u.onerror=function(){btn.classList.remove('play')}}
  speechSynthesis.speak(u)}
if(window.speechSynthesis)speechSynthesis.getVoices();
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function ic(id){return '<svg class="sk" aria-hidden="true"><use href="#'+id+'"/></svg>'}
var mode=st.mode||'les';
function render(){var L=lesson(),feed=document.getElementById('feed');
  var list=SETS.map(function(s,i){return[s,i]});
  var mine=list.filter(function(x){return x[0][0]===L});
  var fl=document.getElementById('fL');fl.textContent='Lección '+L+(mine.length?' · '+mine.length:'');
  if(mode==='les'&&mine.length)list=mine.concat(list.filter(function(x){return x[0][0]!==L}).slice(0,0));
  fl.classList.toggle('on',mode==='les'&&!!mine.length);document.getElementById('fA').classList.toggle('on',!(mode==='les'&&mine.length));
  feed.innerHTML=list.map(function(x,k){var s=x[0],i=x[1],id='s'+i,d=st.done[id];
    return '<section class="card" data-i="'+i+'"><div class="in"><div class="base"><div class="tag">'+(/^Lecci/.test(s[5])?'Lección '+s[0]:esc(s[5])+' · Lección '+s[0])+'</div><span class="cnt">'+(k+1)+'/'+list.length+'</span><h2>'+esc(s[1])+'</h2><p>'+esc(s[2])+'</p></div><ul>'+
      s[3].map(function(e,j){return '<li><span class="em">'+e[0]+'</span><span class="tx"><b>'+esc(e[1])+'</b><small>'+esc(e[2])+'</small></span><button class="au" data-t="'+i+'.'+j+'" aria-label="Escuchar">'+ic('i-volume')+'</button></li>'}).join('')+
      '</ul><div class="reto"><div class="rbox"><div class="h">Reto 3·2·1</div><div class="es">¿Cómo dirías… <b>'+esc(s[4][0].replace(/[.]$/,''))+'</b>?</div><div class="cd"></div><div class="ans"><span>'+esc(s[4][1])+'</span><button class="au" data-r="'+i+'" aria-label="Escuchar">'+ic('i-volume')+'</button></div><div class="tap">toca la bocina para escucharla</div><div class="row"><button class="btn go">'+ic('i-stopwatch')+'<span>Empezar 3-2-1</span></button><button class="btn ok'+(d?' done':'')+'" data-d="'+id+'">'+ic(d?'i-circle-check':'i-square')+'<span>¡Lo dije!</span></button></div></div>'+(k===0?'<div class="hint">desliza hacia arriba ↑</div>':'')+'</div></div></section>'}).join('');
  feed.scrollTop=0}
document.getElementById('feed').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.t){var p=b.dataset.t.split('.');speak(SETS[+p[0]][3][+p[1]][1],b);return}
  if(b.dataset.r){b.classList.remove('big');speak(SETS[+b.dataset.r][4][1],b);return}
  if(b.dataset.d){var id=b.dataset.d;if(st.done[id])delete st.done[id];else st.done[id]=Date.now();save();
    b.classList.toggle('done',!!st.done[id]);b.querySelector('use').setAttribute('href','#'+(st.done[id]?'i-circle-check':'i-square'));return}
  if(b.classList.contains('go')){var box=b.closest('.rbox'),cd=box.querySelector('.cd'),an=box.querySelector('.ans'),i=+b.closest('.card').dataset.i;
    an.classList.remove('on');b.disabled=true;var n=3;
    (function tick(){if(n>0){cd.textContent=n;cd.classList.remove('go');void cd.offsetWidth;cd.classList.add('go');n--;setTimeout(tick,1000)}
      else{cd.classList.remove('go');an.classList.add('on');b.disabled=false;b.querySelector('span').textContent='Otra vez';an.querySelector('.au').classList.add('big')}})()}});
document.getElementById('fL').onclick=function(){mode='les';st.mode=mode;save();render()};
document.getElementById('fA').onclick=function(){mode='all';st.mode=mode;save();render()};
var lastL=lesson();
window.addEventListener('storage',function(e){if(e.key==='ql_app_leccion_v1'&&lesson()!==lastL){lastL=lesson();render()}});
window.__frases={refresh:function(){if(lesson()!==lastL){lastL=lesson();render()}},stop:function(){try{AU.pause();speechSynthesis.cancel()}catch(e){}},count:SETS.length};
render();
})();
</script></body></html>
