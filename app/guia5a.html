<script>
(function(){'use strict';
var D={"lessons": [{"n": 1, "t": "Little, Tiny, Teeny · Color Chart / Introduction (synonyms)", "vocab": [["synonyms", "sinónimos", "\"Old\" and \"ancient\" are synonyms."], ["nearly", "casi", "Synonyms have nearly the same meaning."], ["ancient", "antiguo", "Teotihuacan is an ancient city."], ["therefore", "por lo tanto", "It was raining; therefore, we stayed home."], ["antonyms", "antónimos", "\"New\" and \"old\" are antonyms."], ["applied", "aplicado", "\"Old\" can be applied to people."], ["modern", "moderno", "My phone is very modern."], ["likewise", "asimismo", "Likewise, \"young\" is the opposite of \"old\"."], ["increase", "aumentar", "I want to increase my vocabulary."], ["language", "idioma", "English is a useful language."]], "spell": ["synonyms", "nearly", "ancient", "therefore", "antonyms"], "explica": ["The book said that synonyms express nearly the same idea.", "It said that \"old\" and \"ancient\" were synonyms.", "It explained that \"new\" and \"young\" were their antonyms."], "explica_es": ["El libro decía que los sinónimos expresan casi la misma idea.", "Decía que \"old\" y \"ancient\" eran sinónimos.", "Explicaba que \"new\" y \"young\" eran sus antónimos."], "vx": [{"pos": "noun (plural)", "uso": "Palabras que significan lo mismo o casi lo mismo. Se usa para hablar de vocabulario: \"X y Y son sinónimos\".", "note": "Singular: synonym. Pattern: \"A is a synonym of/for B.\"", "ex1": "\"Old\" y \"ancient\" son sinónimos.", "ex2": ["\"Big\" is a synonym of \"large.\"", "\"Big\" es sinónimo de \"large.\""], "col": "a synonym of, a synonym for"}, {"pos": "adverb", "uso": "Significa \"casi\". Va antes del adjetivo, número o verbo que modifica.", "note": "Same as \"almost.\" Common with numbers and \"the same.\"", "ex1": "Los sinónimos tienen casi el mismo significado.", "ex2": ["It's nearly ten o'clock.", "Son casi las diez."], "col": "nearly the same, nearly finished, nearly all"}, {"pos": "adjective", "uso": "\"Antiguo\", pero de hace muchísimo tiempo (siglos o milenios). Para cosas de hace pocos años se usa \"old\".", "note": "Use for very old civilizations, ruins and history, not for last year's phone.", "ex1": "Teotihuacan es una ciudad antigua.", "ex2": ["The Aztecs were an ancient civilization.", "Los aztecas fueron una civilización antigua."], "col": "ancient city, ancient history, ancient ruins"}, {"pos": "adverb (connector)", "uso": "\"Por lo tanto\". Une una causa con su consecuencia; es formal. Suele ir después de punto y coma o al inicio de oración, con coma.", "note": "Formal; in conversation people usually say \"so.\"", "ex1": "Estaba lloviendo; por lo tanto, nos quedamos en casa.", "ex2": ["She studied a lot; therefore, she passed.", "Estudió mucho; por lo tanto, aprobó."], "col": ""}, {"pos": "noun (plural)", "uso": "Palabras de significado contrario.", "note": "Singular: antonym. \"Hot is the antonym of cold.\"", "ex1": "\"New\" y \"old\" son antónimos.", "ex2": ["\"Happy\" is the antonym of \"sad.\"", "\"Happy\" es el antónimo de \"sad.\""], "col": "the antonym of"}, {"pos": "verb (past / participle of apply)", "uso": "\"Aplicado/aplicar a\": usar una palabra, regla o idea para algo. También \"apply for\" = solicitar (un trabajo).", "note": "\"Apply to\" = use for; \"apply for\" = request (a job, a visa).", "ex1": "\"Old\" se puede aplicar a personas.", "ex2": ["The rule is applied to all students.", "La regla se aplica a todos los alumnos."], "col": "apply to, apply for a job"}, {"pos": "adjective", "uso": "\"Moderno\": actual, nuevo, de esta época. Contrario de \"ancient\" u \"old-fashioned\".", "note": "Opposite: ancient, old-fashioned.", "ex1": "Mi celular es muy moderno.", "ex2": ["They live in a modern building.", "Viven en un edificio moderno."], "col": "modern art, modern technology"}, {"pos": "adverb (connector)", "uso": "\"Asimismo, de igual manera\". Añade una idea parecida a la anterior. Es formal.", "note": "Formal. Also used alone as a reply: \"Nice to meet you.\" \"Likewise.\"", "ex1": "Asimismo, \"young\" es lo contrario de \"old\".", "ex2": ["\"Nice to meet you.\" \"Likewise.\"", "\"Mucho gusto.\" \"Igualmente.\""], "col": ""}, {"pos": "verb / noun", "uso": "\"Aumentar\" (verbo) o \"aumento\" (sustantivo). Contrario de \"decrease/reduce\".", "note": "Verb: inCREASE; noun: an INcrease.", "ex1": "Quiero aumentar mi vocabulario.", "ex2": ["Prices increased last year.", "Los precios aumentaron el año pasado."], "col": "increase in prices, increase your vocabulary"}, {"pos": "noun", "uso": "\"Idioma\" o \"lenguaje\". Para español, inglés, etc. se usa \"language\".", "note": "Countable: one language, two languages.", "ex1": "El inglés es un idioma útil.", "ex2": ["How many languages do you speak?", "¿Cuántos idiomas hablas?"], "col": "speak a language, first language, body language"}]}, {"n": 2, "t": "Little, Tiny, Teeny", "vocab": [["leap", "saltar", "The frog can leap very far."], ["hurdle", "saltar una valla", "The athlete hurdles the obstacles."], ["ant", "hormiga", "An ant is a tiny insect."], ["tiny", "diminuto", "The baby has tiny hands."], ["teeny", "chiquitito", "Look at that teeny puppy!"], ["meaning", "significado", "What is the meaning of this word?"], ["kids", "niños", "The kids are playing in the park."], ["chuckle", "reírse entre dientes", "He chuckled at the joke."], ["giggle", "reírse tontamente", "The girls giggle in class."], ["scared", "asustado", "The boy was scared of the dog."], ["frightened", "atemorizado", "The kids were frightened by the movie."], ["terrified", "aterrado", "She was terrified of the storm."], ["hide", "esconder", "He hides his money under the bed."], ["treasure", "tesoro", "The pirates are looking for treasure."], ["no one", "nadie", "No one knows the answer."], ["find", "encontrar", "I can't find my keys."], ["discover", "descubrir", "The archaeologist discovered a city."], ["locate", "localizar", "Can you locate Mexico on the map?"], ["throw", "lanzar", "Throw me the ball, please."], ["football", "balón de fútbol americano", "He can throw a football very far."], ["toss", "aventar suavemente", "Toss the ball to your sister."], ["hurl", "lanzar con fuerza", "He hurled the ball across the field."], ["ran into", "corrió hacia / se metió", "The little boy ran into the ocean."]], "spell": ["leap", "hurdle", "ant", "tiny", "teeny"], "explica": ["The teacher said that little, tiny and teeny meant small.", "She told us that we could giggle or chuckle at a joke.", "She said that the kids were scared of the movie."], "explica_es": ["La maestra dijo que little, tiny y teeny significaban pequeño.", "Nos dijo que ante un chiste podíamos reírnos (giggle) o reírnos bajito (chuckle).", "Dijo que los niños tenían miedo de la película."], "vx": [{"pos": "verb / noun", "uso": "\"Saltar\" con un brinco largo o alto, con fuerza. Más fuerte que \"jump\".", "note": "Past: leapt or leaped. Stronger, longer jump than \"jump.\"", "ex1": "La rana puede saltar muy lejos.", "ex2": ["The cat leaped onto the table.", "El gato saltó a la mesa."], "col": "leap over, leap into"}, {"pos": "verb / noun", "uso": "Como verbo, saltar un obstáculo corriendo (como en atletismo). Como sustantivo, la valla o un obstáculo/dificultad.", "note": "Noun also means a difficulty: \"a big hurdle.\"", "ex1": "El atleta salta los obstáculos.", "ex2": ["Money was the biggest hurdle.", "El dinero fue el mayor obstáculo."], "col": "clear a hurdle, overcome a hurdle"}, {"pos": "noun", "uso": "\"Hormiga\". Insecto muy pequeño.", "note": "Countable: an ant, ants.", "ex1": "Una hormiga es un insecto diminuto.", "ex2": ["There are ants in the kitchen.", "Hay hormigas en la cocina."], "col": ""}, {"pos": "adjective", "uso": "\"Diminuto, chiquito\". Más pequeño que \"small\" o \"little\".", "note": "Stronger than small: small < tiny < teeny.", "ex1": "El bebé tiene manos diminutas.", "ex2": ["She lives in a tiny apartment.", "Vive en un departamento diminuto."], "col": "tiny bit, tiny house"}, {"pos": "adjective", "uso": "\"Chiquitito\". Informal y cariñoso; aún más pequeño que \"tiny\". También \"teeny-tiny\".", "note": "Informal, often in \"teeny-tiny.\" Used a lot with kids.", "ex1": "¡Mira ese perrito chiquitito!", "ex2": ["I just want a teeny piece of cake.", "Solo quiero un pedacito chiquitito de pastel."], "col": "teeny-tiny"}, {"pos": "noun", "uso": "\"Significado\" de una palabra o de algo.", "note": "\"What does X mean?\" = \"What is the meaning of X?\"", "ex1": "¿Cuál es el significado de esta palabra?", "ex2": ["The meaning of life.", "El sentido de la vida."], "col": "the meaning of"}, {"pos": "noun (plural)", "uso": "\"Niños, chavos\". Informal de \"children\".", "note": "Informal for children. Singular: kid.", "ex1": "Los niños están jugando en el parque.", "ex2": ["Do you have kids?", "¿Tienes hijos?"], "col": ""}, {"pos": "verb / noun", "uso": "\"Reírse entre dientes\": risa suave, con la boca casi cerrada, normalmente de un adulto.", "note": "Quiet, low laugh. Compare: giggle (silly, high), laugh (normal).", "ex1": "Se rio entre dientes con el chiste.", "ex2": ["Grandpa chuckled when he read the card.", "El abuelo se rio bajito al leer la tarjeta."], "col": "chuckle at something"}, {"pos": "verb / noun", "uso": "\"Reírse de forma nerviosa o tonta\", risita aguda; típico de niños o cuando algo da pena.", "note": "Light, silly, high laugh, often nervous.", "ex1": "Las niñas se ríen en clase.", "ex2": ["The kids couldn't stop giggling.", "Los niños no paraban de reírse."], "col": "giggle at, get the giggles"}, {"pos": "adjective", "uso": "\"Asustado\". Se dice \"scared of\" + algo que da miedo.", "note": "Pattern: be scared of something. Less formal than frightened.", "ex1": "El niño le tenía miedo al perro.", "ex2": ["I'm scared of spiders.", "Me dan miedo las arañas."], "col": "scared of, scared to death"}, {"pos": "adjective", "uso": "\"Atemorizado, asustado\". Igual que scared, un poco más formal.", "note": "Same as scared; slightly more formal. \"frightened of / by.\"", "ex1": "Los niños se asustaron con la película.", "ex2": ["She was frightened by the noise.", "Se asustó con el ruido."], "col": "frightened of, frightened by"}, {"pos": "adjective", "uso": "\"Aterrado\": miedo muy fuerte. Escala: scared < frightened < terrified.", "note": "Strongest of the three.", "ex1": "Estaba aterrada por la tormenta.", "ex2": ["He's terrified of flying.", "Le aterra volar."], "col": "terrified of"}, {"pos": "verb", "uso": "\"Esconder\" algo o \"esconderse\". Pasado: hid; participio: hidden.", "note": "Irregular: hide - hid - hidden.", "ex1": "Esconde su dinero debajo de la cama.", "ex2": ["The cat hid under the sofa.", "El gato se escondió debajo del sillón."], "col": "hide from, hide something"}, {"pos": "noun", "uso": "\"Tesoro\": oro, joyas u objetos valiosos; también algo muy querido.", "note": "Uncountable when it means gold/jewels.", "ex1": "Los piratas buscan un tesoro.", "ex2": ["This photo is my treasure.", "Esta foto es mi tesoro."], "col": "buried treasure, treasure hunt"}, {"pos": "pronoun", "uso": "\"Nadie\". Va con verbo en afirmativo (no doble negación): \"No one knows\", no \"No one doesn't know\".", "note": "Same as \"nobody.\" Use a positive verb.", "ex1": "Nadie sabe la respuesta.", "ex2": ["No one called me today.", "Hoy nadie me llamó."], "col": ""}, {"pos": "verb", "uso": "\"Encontrar\" algo que se buscaba. Pasado: found.", "note": "Irregular: find - found - found.", "ex1": "No encuentro mis llaves.", "ex2": ["I found my phone in the car.", "Encontré mi celular en el coche."], "col": "find out (averiguar)"}, {"pos": "verb", "uso": "\"Descubrir\": encontrar algo por primera vez o algo que nadie conocía.", "note": "For new things or first-time findings.", "ex1": "El arqueólogo descubrió una ciudad.", "ex2": ["Scientists discovered a new planet.", "Los científicos descubrieron un planeta nuevo."], "col": "discover that"}, {"pos": "verb", "uso": "\"Localizar, ubicar\" el lugar exacto de algo. Más formal que find.", "note": "Formal. \"be located in\" = estar ubicado en.", "ex1": "¿Puedes ubicar México en el mapa?", "ex2": ["The hotel is located downtown.", "El hotel está ubicado en el centro."], "col": "be located in"}, {"pos": "verb", "uso": "\"Lanzar, aventar\" en general. Pasado: threw; participio: thrown.", "note": "Irregular: throw - threw - thrown. Scale: toss (soft) < throw < hurl (hard).", "ex1": "Lánzame la pelota, por favor.", "ex2": ["Don't throw trash on the street.", "No tires basura en la calle."], "col": "throw away (tirar a la basura)"}, {"pos": "noun", "uso": "En EE. UU. es el \"futbol americano\"; también el balón. El futbol soccer se llama \"soccer\".", "note": "In the US: American football. Soccer = futbol.", "ex1": "Puede lanzar un balón de americano muy lejos.", "ex2": ["We watch football on Sundays.", "Vemos americano los domingos."], "col": ""}, {"pos": "verb", "uso": "\"Aventar suavemente\", sin fuerza, casi de manera casual.", "note": "Light, casual throw. \"toss a coin\" = echar un volado.", "ex1": "Avienta la pelota a tu hermana.", "ex2": ["Let's toss a coin.", "Echemos un volado."], "col": "toss a coin, toss a salad"}, {"pos": "verb", "uso": "\"Lanzar con mucha fuerza\", con violencia.", "note": "Strong, violent throw.", "ex1": "Lanzó la pelota al otro lado del campo.", "ex2": ["He hurled the phone at the wall.", "Aventó el celular contra la pared."], "col": ""}, {"pos": "phrasal verb (past of run into)", "uso": "Literal: entrar corriendo a un lugar. También \"toparse con alguien\" por casualidad.", "note": "Two meanings: run inside something / meet by chance.", "ex1": "El niño se metió corriendo al mar.", "ex2": ["I ran into my teacher at the mall.", "Me topé con mi maestra en la plaza."], "col": "run into someone"}]}, {"n": 3, "t": "Little, Tiny, Teeny", "vocab": [["antique", "antigüedad", "My grandma has an antique table."], ["automobile", "automóvil", "An automobile is a car."], ["vehicle", "vehículo", "There are many vehicles on the road."], ["wonder", "preguntarse", "I wonder where he is."], ["vacant", "desocupado", "The apartment is vacant."], ["unoccupied", "desocupado", "That seat is unoccupied."], ["climb", "escalar", "They climb the mountain every year."], ["mountains", "montañas", "Mexico has beautiful mountains."], ["scale", "escalar", "He is scaling the mountain."], ["ascend", "ascender, subir", "We ascend the stairs to the third floor."], ["stated", "afirmó", "He stated that he was innocent."], ["declared", "declaró", "The judge declared him free."], ["announced", "anunció", "She announced the winner."], ["inquired", "preguntó, indagó", "The lawyer inquired about the thief."], ["questioned", "interrogó", "The students questioned the teacher."], ["narrator", "narrador", "The narrator tells the story."], ["film", "película", "We watched a great film."], ["enjoyed", "disfrutó", "I enjoyed the movie a lot."]], "spell": ["antique", "automobile", "vehicle", "wonder", "vacant"], "explica": ["The teacher said that an empty apartment was vacant.", "She explained that we climb, scale or ascend a mountain.", "She told us that \"inquired\" was a synonym of \"asked\"."], "explica_es": ["La maestra dijo que un departamento vacío estaba \"vacant\".", "Explicó que una montaña se sube con climb, scale o ascend.", "Nos dijo que \"inquired\" era sinónimo de \"asked\"."], "vx": [{"pos": "noun / adjective", "uso": "\"Antigüedad\" (objeto viejo y valioso) o \"antiguo\" para muebles y objetos de colección.", "note": "For valuable old objects, not for people.", "ex1": "Mi abuela tiene una mesa antigua.", "ex2": ["She collects antique clocks.", "Colecciona relojes antiguos."], "col": "antique shop, antique furniture"}, {"pos": "noun", "uso": "\"Automóvil\". Formal; en la conversación se dice \"car\".", "note": "Formal/technical. Everyday word: car.", "ex1": "Un automóvil es un coche.", "ex2": ["The automobile industry is important in Mexico.", "La industria automotriz es importante en México."], "col": "automobile industry"}, {"pos": "noun", "uso": "\"Vehículo\": cualquier medio de transporte con motor o ruedas (coche, camión, moto).", "note": "General word for cars, buses, trucks.", "ex1": "Hay muchos vehículos en el camino.", "ex2": ["Please park your vehicle here.", "Por favor, estacione su vehículo aquí."], "col": ""}, {"pos": "verb / noun", "uso": "Verbo: \"preguntarse\", tener curiosidad. Sustantivo: \"maravilla\".", "note": "\"I wonder if/where/why...\" No question mark: \"I wonder where he is.\"", "ex1": "Me pregunto dónde está.", "ex2": ["I wonder if it will rain.", "Me pregunto si va a llover."], "col": "I wonder if, no wonder (con razón)"}, {"pos": "adjective", "uso": "\"Desocupado, vacío, disponible\" para lugares: cuartos, casas, asientos, puestos de trabajo.", "note": "For places and jobs: a vacant room, a vacant position.", "ex1": "El departamento está desocupado.", "ex2": ["Is this seat vacant?", "¿Este asiento está libre?"], "col": "vacant lot (terreno baldío), vacant position"}, {"pos": "adjective", "uso": "\"Desocupado, sin nadie\". Sinónimo de vacant.", "note": "Same as vacant. Opposite: occupied.", "ex1": "Ese asiento está desocupado.", "ex2": ["The house was unoccupied for years.", "La casa estuvo deshabitada años."], "col": ""}, {"pos": "verb", "uso": "\"Escalar, trepar, subir\" usando pies y manos. La b no se pronuncia: /klaɪm/.", "note": "Silent b. \"climb up/down.\"", "ex1": "Escalan la montaña cada año.", "ex2": ["The kids climbed the tree.", "Los niños se treparon al árbol."], "col": "climb a mountain, climb stairs"}, {"pos": "noun (plural)", "uso": "\"Montañas\".", "note": "Singular: mountain. \"in the mountains.\"", "ex1": "México tiene montañas hermosas.", "ex2": ["We spent the weekend in the mountains.", "Pasamos el fin de semana en la montaña."], "col": ""}, {"pos": "verb / noun", "uso": "Verbo: \"escalar\" algo alto y difícil (pared, montaña). Sustantivo: báscula o escala.", "note": "Formal for climb. Noun: a scale (báscula / escala).", "ex1": "Está escalando la montaña.", "ex2": ["They scaled the wall.", "Escalaron el muro."], "col": "scale a wall, on a scale of 1 to 10"}, {"pos": "verb", "uso": "\"Ascender, subir\". Formal; contrario de \"descend\".", "note": "Formal for go up.", "ex1": "Subimos las escaleras al tercer piso.", "ex2": ["The plane ascended quickly.", "El avión subió rápido."], "col": ""}, {"pos": "verb (past of state)", "uso": "\"Afirmó, declaró\" algo de forma clara y formal.", "note": "Formal reporting verb: \"He stated that...\"", "ex1": "Afirmó que era inocente.", "ex2": ["The report stated that prices would rise.", "El informe afirmaba que los precios subirían."], "col": ""}, {"pos": "verb (past of declare)", "uso": "\"Declaró\": dijo algo oficialmente, con autoridad.", "note": "Official or strong statement.", "ex1": "El juez lo declaró libre.", "ex2": ["Mexico declared independence in 1810.", "México declaró su independencia en 1810."], "col": "declare war, declare independence"}, {"pos": "verb (past of announce)", "uso": "\"Anunció\": dio una noticia en público.", "note": "For news told publicly.", "ex1": "Anunció al ganador.", "ex2": ["They announced their wedding.", "Anunciaron su boda."], "col": ""}, {"pos": "verb (past of inquire)", "uso": "\"Preguntó, indagó\". Formal de \"asked\"; \"inquire about\" algo.", "note": "Formal for asked. Also spelled enquired.", "ex1": "El abogado preguntó por el ladrón.", "ex2": ["She inquired about the price.", "Preguntó por el precio."], "col": "inquire about"}, {"pos": "verb (past of question)", "uso": "\"Interrogó, cuestionó\": hizo varias preguntas a alguien, o dudó de algo.", "note": "Ask many questions (police) or doubt something.", "ex1": "Los alumnos le hicieron preguntas al maestro.", "ex2": ["The police questioned the suspect.", "La policía interrogó al sospechoso."], "col": ""}, {"pos": "noun", "uso": "\"Narrador\": quien cuenta la historia en un libro o película.", "note": "The voice that tells the story.", "ex1": "El narrador cuenta la historia.", "ex2": ["The narrator of the movie is a child.", "El narrador de la película es un niño."], "col": ""}, {"pos": "noun", "uso": "\"Película\". Igual que \"movie\"; más británico o formal.", "note": "Same as movie.", "ex1": "Vimos una gran película.", "ex2": ["It's my favorite film.", "Es mi película favorita."], "col": "watch a film"}, {"pos": "verb (past of enjoy)", "uso": "\"Disfrutó\". Va con objeto directo o con verbo en -ing: \"enjoy reading\".", "note": "Pattern: enjoy + noun / enjoy + -ing. \"Enjoy yourself.\"", "ex1": "Disfruté mucho la película.", "ex2": ["We enjoyed dancing at the party.", "Disfrutamos bailar en la fiesta."], "col": "enjoy + -ing"}]}, {"n": 4, "t": "Little, Tiny, Teeny (Exercises)", "vocab": [], "spell": [], "explica": ["The teacher told us to circle the best answer.", "She said that hurl and toss were synonyms of throw.", "She asked us to write a composition about synonyms."], "explica_es": ["La maestra nos dijo que encerráramos la mejor respuesta.", "Dijo que hurl y toss eran sinónimos de throw.", "Nos pidió que escribiéramos una composición sobre sinónimos."], "vx": []}, {"n": 5, "t": "Don Quixote · Introduction", "vocab": [["novels", "novelas", "Cervantes wrote many novels."], ["published", "publicado", "Don Quixote was published in 1605."], ["influential", "influyente", "It is one of the most influential books."], ["classical literature", "literatura clásica", "Don Quixote is classical literature."], ["country", "campo, de provincia", "Alonso was a country gentleman."], ["journey", "viaje, travesía", "He started a long journey."], ["adventure", "aventura", "He wanted to find adventure."], ["vision", "visión", "Don Quixote had a strange vision."], ["battles", "batallas", "He fights imaginary battles."], ["improve", "mejorar", "I want to improve my English."], ["listening skills", "habilidad para escuchar", "Videos improve your listening skills."], ["along the way", "en el camino", "You will learn new words along the way."], ["stories", "historias, cuentos", "He reads stories about knights."], ["knights", "caballeros", "Knights protected the people."], ["brave", "valiente", "The knight was very brave."], ["noble", "noble", "He had a noble heart."], ["armor", "armadura", "The knight wears armor."], ["helmets", "cascos", "Football players wear helmets."], ["trouble", "problema, apuro", "Superheroes save people in trouble."], ["saved", "salvó", "The knight saved the princess."], ["giants", "gigantes", "He thought the windmills were giants."], ["wicked", "malvado", "The wicked wizard laughed."], ["wizards", "magos, hechiceros", "Wizards use magic."], ["attacked", "atacó", "He attacked the windmills."], ["lances", "lanzas", "Knights fought with lances."], ["swords", "espadas", "The soldiers had swords."], ["decided", "decidió", "He decided to become a knight."], ["become", "convertirse en", "He wanted to become a knight."], ["fight", "pelear", "Knights fight for justice."], ["justice", "justicia", "He fought for justice."], ["found", "encontró", "He found an old suit of armor."], ["suit of armor", "armadura", "He put on a suit of armor."], ["squire", "escudero", "Sancho Panza was his squire."], ["named", "llamado", "He had a horse named Rocinante."], ["rode", "montó, cabalgó", "Sancho rode a donkey."], ["donkey", "burro", "The donkey was small and slow."]], "spell": ["novels", "published", "influential", "classical literature", "country"], "explica": ["The book said that Cervantes wrote Don Quixote.", "It said that the novel was published in 1605.", "It explained that Alonso Quijana changed his name to Don Quixote."], "explica_es": ["El libro decía que Cervantes escribió el Quijote.", "Decía que la novela se publicó en 1605.", "Explicaba que Alonso Quijana se cambió el nombre a Don Quijote."], "vx": [{"pos": "noun (plural)", "uso": "\"Novelas\": libros largos de ficción.", "note": "Singular: novel. Not \"news\" (noticias).", "ex1": "Cervantes escribió muchas novelas.", "ex2": ["I'm reading a novel by García Márquez.", "Estoy leyendo una novela de García Márquez."], "col": "write a novel"}, {"pos": "verb (past / participle of publish)", "uso": "\"Publicado/publicó\": cuando un libro o artículo sale a la venta o al público.", "note": "Often passive: \"was published in.\"", "ex1": "El Quijote se publicó en 1605.", "ex2": ["Her book was published last year.", "Su libro se publicó el año pasado."], "col": "be published in/by"}, {"pos": "adjective", "uso": "\"Influyente\": que tiene mucho efecto sobre personas o ideas.", "note": "\"one of the most influential...\"", "ex1": "Es uno de los libros más influyentes.", "ex2": ["She is an influential writer.", "Es una escritora influyente."], "col": "highly influential"}, {"pos": "noun", "uso": "\"Literatura clásica\": obras importantes de otras épocas.", "note": "Uncountable.", "ex1": "El Quijote es literatura clásica.", "ex2": ["We study classical literature at school.", "Estudiamos literatura clásica en la escuela."], "col": ""}, {"pos": "noun / adjective", "uso": "Además de \"país\", significa \"campo\" (fuera de la ciudad). \"country gentleman\" = hidalgo de provincia.", "note": "\"the country\" = el campo; \"a country\" = un país.", "ex1": "Alonso era un hidalgo de provincia.", "ex2": ["They live in the country.", "Viven en el campo."], "col": "in the country, country house"}, {"pos": "noun", "uso": "\"Viaje, travesía\": un trayecto largo, sobre todo el recorrido en sí.", "note": "Journey = the act of traveling, often long. Trip = short visit.", "ex1": "Empezó un viaje largo.", "ex2": ["The journey took ten hours.", "El viaje duró diez horas."], "col": "long journey, go on a journey"}, {"pos": "noun", "uso": "\"Aventura\": experiencia emocionante o peligrosa.", "note": "\"go on an adventure.\"", "ex1": "Quería encontrar aventuras.", "ex2": ["Our trip was a real adventure.", "Nuestro viaje fue toda una aventura."], "col": "adventure movie"}, {"pos": "noun", "uso": "\"Visión\": algo que alguien ve en su imaginación o en un sueño; también \"vista\" (capacidad de ver).", "note": "Two meanings: eyesight / an imagined image.", "ex1": "Don Quijote tuvo una visión extraña.", "ex2": ["She has a clear vision of the future.", "Tiene una visión clara del futuro."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Batallas\": peleas entre ejércitos o luchas.", "note": "Singular: battle.", "ex1": "Pelea batallas imaginarias.", "ex2": ["The battle of Puebla was in 1862.", "La batalla de Puebla fue en 1862."], "col": "fight a battle"}, {"pos": "verb", "uso": "\"Mejorar\" algo o mejorar uno mismo.", "note": "No \"to\" after it: \"improve your English.\"", "ex1": "Quiero mejorar mi inglés.", "ex2": ["Your pronunciation has improved.", "Tu pronunciación ha mejorado."], "col": "improve skills"}, {"pos": "noun", "uso": "\"Habilidad para escuchar / comprensión auditiva\".", "note": "\"skills\" = habilidades.", "ex1": "Los videos mejoran tu comprensión auditiva.", "ex2": ["Podcasts help your listening skills.", "Los podcasts ayudan a tu comprensión auditiva."], "col": "speaking skills, writing skills"}, {"pos": "expression", "uso": "\"En el camino\": durante un proceso o viaje.", "note": "Can be literal or figurative.", "ex1": "Aprenderás palabras nuevas en el camino.", "ex2": ["We made friends along the way.", "Hicimos amigos en el camino."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Historias, cuentos\". Singular: story.", "note": "Not \"stores\" (tiendas).", "ex1": "Lee historias de caballeros.", "ex2": ["Tell me a story.", "Cuéntame un cuento."], "col": "tell a story, bedtime story"}, {"pos": "noun (plural)", "uso": "\"Caballeros\" medievales con armadura. La k no suena: /naɪts/.", "note": "Silent k, sounds like \"nights.\"", "ex1": "Los caballeros protegían a la gente.", "ex2": ["The knight rode a white horse.", "El caballero montaba un caballo blanco."], "col": ""}, {"pos": "adjective", "uso": "\"Valiente\".", "note": "Opposite: coward (cobarde).", "ex1": "El caballero era muy valiente.", "ex2": ["Be brave!", "¡Sé valiente!"], "col": ""}, {"pos": "adjective / noun", "uso": "\"Noble\": de buen corazón, o de familia aristócrata.", "note": "Two meanings: good and honest / aristocratic.", "ex1": "Tenía un corazón noble.", "ex2": ["It was a noble decision.", "Fue una decisión noble."], "col": ""}, {"pos": "noun", "uso": "\"Armadura\" de metal. Incontable.", "note": "Uncountable; British: armour. \"a suit of armor.\"", "ex1": "El caballero usa armadura.", "ex2": ["The armor was very heavy.", "La armadura era muy pesada."], "col": "suit of armor"}, {"pos": "noun (plural)", "uso": "\"Cascos\" para proteger la cabeza.", "note": "Singular: helmet.", "ex1": "Los jugadores de americano usan casco.", "ex2": ["Always wear a helmet on a bike.", "Siempre usa casco en la bici."], "col": "wear a helmet"}, {"pos": "noun", "uso": "\"Problema, apuro\". \"in trouble\" = en problemas.", "note": "Usually uncountable: \"in trouble,\" \"have trouble + -ing.\"", "ex1": "Los superhéroes salvan a gente en apuros.", "ex2": ["I have trouble sleeping.", "Me cuesta trabajo dormir."], "col": "in trouble, get into trouble"}, {"pos": "verb (past of save)", "uso": "\"Salvó\" (rescatar). También \"ahorrar\" (dinero) y \"guardar\" (archivo).", "note": "Three meanings: rescue / save money / save a file.", "ex1": "El caballero salvó a la princesa.", "ex2": ["I saved money for my trip.", "Ahorré dinero para mi viaje."], "col": "save someone's life"}, {"pos": "noun (plural)", "uso": "\"Gigantes\".", "note": "Singular: giant. Also an adjective: giant = enorme.", "ex1": "Pensó que los molinos eran gigantes.", "ex2": ["The giant was very tall.", "El gigante era altísimo."], "col": ""}, {"pos": "adjective", "uso": "\"Malvado, perverso\". Típico de cuentos: \"wicked witch\".", "note": "Fairy-tale word for evil.", "ex1": "El mago malvado se rio.", "ex2": ["The wicked stepmother was cruel.", "La madrastra malvada era cruel."], "col": "wicked witch"}, {"pos": "noun (plural)", "uso": "\"Magos, hechiceros\" (hombres). Mujer: witch.", "note": "Singular: wizard.", "ex1": "Los magos usan magia.", "ex2": ["Harry Potter is a wizard.", "Harry Potter es un mago."], "col": ""}, {"pos": "verb (past of attack)", "uso": "\"Atacó\".", "note": "Regular verb.", "ex1": "Atacó los molinos de viento.", "ex2": ["The dog attacked the cat.", "El perro atacó al gato."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Lanzas\" largas que usaban los caballeros a caballo.", "note": "Singular: lance.", "ex1": "Los caballeros peleaban con lanzas.", "ex2": ["He held his lance.", "Sostenía su lanza."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Espadas\". La w no suena: /sɔːrdz/.", "note": "Silent w.", "ex1": "Los soldados tenían espadas.", "ex2": ["He pulled out his sword.", "Sacó su espada."], "col": ""}, {"pos": "verb (past of decide)", "uso": "\"Decidió\". Va con \"to\" + verbo: \"decided to go\".", "note": "Pattern: decide to + verb.", "ex1": "Decidió convertirse en caballero.", "ex2": ["We decided to stay home.", "Decidimos quedarnos en casa."], "col": "decide to"}, {"pos": "verb", "uso": "\"Convertirse en, llegar a ser\". Pasado: became; participio: become.", "note": "Irregular: become - became - become.", "ex1": "Quería convertirse en caballero.", "ex2": ["She became a doctor.", "Se hizo doctora."], "col": "become + noun/adjective"}, {"pos": "verb / noun", "uso": "\"Pelear, luchar\" o \"pelea\". Pasado: fought.", "note": "Irregular: fight - fought. \"fight for\" = luchar por.", "ex1": "Los caballeros luchan por la justicia.", "ex2": ["My brothers always fight.", "Mis hermanos siempre se pelean."], "col": "fight for, have a fight"}, {"pos": "noun", "uso": "\"Justicia\".", "note": "Uncountable.", "ex1": "Luchó por la justicia.", "ex2": ["They want justice for the victims.", "Quieren justicia para las víctimas."], "col": ""}, {"pos": "verb (past of find)", "uso": "\"Encontró\".", "note": "find - found - found.", "ex1": "Encontró una armadura vieja.", "ex2": ["I found a coin on the floor.", "Encontré una moneda en el piso."], "col": ""}, {"pos": "noun", "uso": "\"Armadura completa\": todas las piezas de metal juntas.", "note": "\"suit\" = conjunto completo.", "ex1": "Se puso una armadura.", "ex2": ["There is a suit of armor in the museum.", "Hay una armadura en el museo."], "col": ""}, {"pos": "noun", "uso": "\"Escudero\": ayudante de un caballero.", "note": "Medieval word.", "ex1": "Sancho Panza era su escudero.", "ex2": ["The squire carried the shield.", "El escudero cargaba el escudo."], "col": ""}, {"pos": "adjective / verb", "uso": "\"Llamado, de nombre\". \"a dog named Max\".", "note": "Pattern: noun + named + name.", "ex1": "Tenía un caballo llamado Rocinante.", "ex2": ["I have a friend named Ana.", "Tengo una amiga que se llama Ana."], "col": ""}, {"pos": "verb (past of ride)", "uso": "\"Montó, cabalgó\" (caballo, bici). Ride - rode - ridden.", "note": "Irregular: ride - rode - ridden.", "ex1": "Sancho montaba un burro.", "ex2": ["I rode my bike to school.", "Fui en bici a la escuela."], "col": "ride a horse, ride a bike"}, {"pos": "noun", "uso": "\"Burro\".", "note": "Countable.", "ex1": "El burro era pequeño y lento.", "ex2": ["The donkey carried the bags.", "El burro cargaba las bolsas."], "col": ""}]}, {"n": 6, "t": "Don Quixote", "vocab": [["castles", "castillos", "Kings lived in castles."], ["arrived", "llegó", "They arrived at an inn."], ["farm", "granja", "Animals live on the farm."], ["lord", "señor (noble)", "The lord of the castle was rich."], ["farmers", "granjeros", "The farmers work hard."], ["barn", "granero", "Cows sleep in the barn."], ["hay", "paja, heno", "The horse eats hay."], ["elegant", "elegante", "The castle was elegant."], ["touches", "toca", "He touches his shoulder."], ["shoulders", "hombros", "He has strong shoulders."], ["windmills", "molinos de viento", "He attacked the windmills."], ["begins", "comienza", "The story begins in La Mancha."], ["wind", "viento", "The wind moves the blades."], ["blades", "aspas", "The blades of the windmill turn."], ["ground", "suelo", "He fell to the ground."]], "spell": ["castles", "arrived", "farm", "lord", "farmers"], "explica": ["The narrator said that Don Quixote found an old suit of armor.", "He said that Sancho Panza became his squire.", "He explained that Don Quixote attacked the windmills."], "explica_es": ["El narrador dijo que Don Quijote encontró una armadura vieja.", "Dijo que Sancho Panza se convirtió en su escudero.", "Explicó que Don Quijote atacó los molinos de viento."], "vx": [{"pos": "noun (plural)", "uso": "\"Castillos\". La t no suena: /ˈkæsəlz/.", "note": "Silent t.", "ex1": "Los reyes vivían en castillos.", "ex2": ["We visited a castle in Spain.", "Visitamos un castillo en España."], "col": ""}, {"pos": "verb (past of arrive)", "uso": "\"Llegó\". Se dice \"arrive at\" (lugar pequeño) o \"arrive in\" (ciudad/país); nunca \"arrive to\".", "note": "arrive at a place / arrive in a city.", "ex1": "Llegaron a una posada.", "ex2": ["We arrived in Cancún at noon.", "Llegamos a Cancún al mediodía."], "col": "arrive at, arrive in"}, {"pos": "noun", "uso": "\"Granja, rancho\".", "note": "\"on a farm.\"", "ex1": "Los animales viven en la granja.", "ex2": ["My uncle works on a farm.", "Mi tío trabaja en un rancho."], "col": "on the farm"}, {"pos": "noun", "uso": "\"Señor\" noble, dueño de tierras o de un castillo.", "note": "Medieval title.", "ex1": "El señor del castillo era rico.", "ex2": ["The lord gave the farmers land.", "El señor les dio tierras a los granjeros."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Granjeros, campesinos, agricultores\".", "note": "Singular: farmer.", "ex1": "Los granjeros trabajan duro.", "ex2": ["Farmers grow corn.", "Los campesinos siembran maíz."], "col": ""}, {"pos": "noun", "uso": "\"Granero, establo\" donde se guardan animales o paja.", "note": "Countable.", "ex1": "Las vacas duermen en el granero.", "ex2": ["The horses are in the barn.", "Los caballos están en el establo."], "col": ""}, {"pos": "noun", "uso": "\"Paja, heno\": pasto seco para alimentar animales.", "note": "Uncountable.", "ex1": "El caballo come paja.", "ex2": ["He slept on the hay.", "Durmió sobre la paja."], "col": ""}, {"pos": "adjective", "uso": "\"Elegante\": con estilo y buen gusto.", "note": "Same in both languages.", "ex1": "El castillo era elegante.", "ex2": ["She wore an elegant dress.", "Llevaba un vestido elegante."], "col": ""}, {"pos": "verb (3rd person of touch)", "uso": "\"Toca\": pone la mano sobre algo.", "note": "he/she/it + touches.", "ex1": "Le toca el hombro.", "ex2": ["Don't touch the paint!", "¡No toques la pintura!"], "col": ""}, {"pos": "noun (plural)", "uso": "\"Hombros\".", "note": "Singular: shoulder.", "ex1": "Tiene hombros fuertes.", "ex2": ["My shoulders hurt.", "Me duelen los hombros."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Molinos de viento\".", "note": "wind + mill.", "ex1": "Atacó los molinos de viento.", "ex2": ["There are windmills in Oaxaca.", "Hay molinos de viento en Oaxaca."], "col": ""}, {"pos": "verb (3rd person of begin)", "uso": "\"Comienza\". Begin - began - begun.", "note": "Irregular. Same as \"starts.\"", "ex1": "La historia comienza en La Mancha.", "ex2": ["The class begins at nine.", "La clase empieza a las nueve."], "col": ""}, {"pos": "noun", "uso": "\"Viento\". (Ojo: el verbo \"to wind\", que suena /waɪnd/, significa enrollar.)", "note": "Noun pronounced /wɪnd/.", "ex1": "El viento mueve las aspas.", "ex2": ["The wind is very strong today.", "Hoy hace mucho viento."], "col": "strong wind"}, {"pos": "noun (plural)", "uso": "\"Aspas\" de un molino o ventilador; también \"hojas\" de cuchillo.", "note": "Singular: blade.", "ex1": "Las aspas del molino giran.", "ex2": ["The knife's blade is sharp.", "La hoja del cuchillo está afilada."], "col": ""}, {"pos": "noun", "uso": "\"Suelo, tierra\" (afuera). Dentro de casa se suele decir \"floor\".", "note": "ground = outside; floor = inside.", "ex1": "Se cayó al suelo.", "ex2": ["Sit on the ground.", "Siéntate en el suelo."], "col": "fall to the ground"}]}, {"n": 7, "t": "Don Quixote", "vocab": [["forest", "bosque", "They walked through the forest."], ["dust", "polvo", "There was a lot of dust on the road."], ["army", "ejército", "He thought the sheep were an army."], ["flocks", "rebaños", "Two flocks of sheep came down the road."], ["sheep", "ovejas", "The sheep eat grass."], ["throwing", "lanzando", "The shepherds were throwing stones."], ["stones", "piedras", "They threw stones at him."], ["gather", "reunir", "Let's gather the animals."], ["armies", "ejércitos", "He imagined two armies."], ["resting", "descansando", "They were resting under a tree."], ["cart", "carreta", "A cart full of lions came by."], ["master", "amo", "Sancho followed his master."], ["squeezed", "exprimió", "He squeezed the cheese."], ["liquid", "líquido", "Her glass is full of liquid."], ["drip", "gotear", "The milk started to drip."], ["brain", "cerebro", "He thought his brain was melting."], ["melting", "derritiéndose", "The ice cream is melting."], ["truth", "verdad", "Tell me the truth."], ["spend the night", "pasar la noche", "We spend the night in the forest."], ["falls off", "se cae de", "He falls off his horse."], ["down the road", "más adelante en el camino", "Down the road, there was an inn."], ["puts it on", "se lo pone", "He takes the helmet and puts it on."]], "spell": ["forest", "dust", "army", "flocks", "sheep"], "explica": ["The narrator said that two flocks of sheep came down the road.", "He said that Don Quixote thought they were armies.", "He told us that the shepherds threw stones at him."], "explica_es": ["El narrador dijo que dos rebaños de ovejas venían por el camino.", "Dijo que Don Quijote pensó que eran ejércitos.", "Nos contó que los pastores le aventaron piedras."], "vx": [{"pos": "noun", "uso": "\"Bosque\".", "note": "Countable.", "ex1": "Caminaron por el bosque.", "ex2": ["There are deer in the forest.", "Hay venados en el bosque."], "col": ""}, {"pos": "noun", "uso": "\"Polvo\".", "note": "Uncountable.", "ex1": "Había mucho polvo en el camino.", "ex2": ["The table is covered in dust.", "La mesa está llena de polvo."], "col": ""}, {"pos": "noun", "uso": "\"Ejército\".", "note": "Plural: armies.", "ex1": "Pensó que las ovejas eran un ejército.", "ex2": ["He joined the army.", "Se unió al ejército."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Rebaños, parvadas\": grupos de ovejas o de pájaros.", "note": "Use flock for sheep, goats and birds; herd for cows.", "ex1": "Dos rebaños de ovejas venían por el camino.", "ex2": ["A flock of birds flew over us.", "Una parvada voló sobre nosotros."], "col": "a flock of"}, {"pos": "noun", "uso": "\"Oveja(s)\". El plural es igual: one sheep, two sheep.", "note": "Same form singular and plural.", "ex1": "Las ovejas comen pasto.", "ex2": ["There is one sheep in the field.", "Hay una oveja en el campo."], "col": ""}, {"pos": "verb (-ing of throw)", "uso": "\"Lanzando, aventando\".", "note": "Continuous form.", "ex1": "Los pastores estaban aventando piedras.", "ex2": ["Stop throwing paper!", "¡Deja de aventar papeles!"], "col": ""}, {"pos": "noun (plural)", "uso": "\"Piedras\".", "note": "Singular: stone. Also \"rocks.\"", "ex1": "Le aventaron piedras.", "ex2": ["The house is made of stone.", "La casa es de piedra."], "col": ""}, {"pos": "verb", "uso": "\"Reunir, juntar\" personas o cosas; también \"reunirse\".", "note": "gather together, gather around.", "ex1": "Reunamos a los animales.", "ex2": ["We gathered around the table.", "Nos reunimos alrededor de la mesa."], "col": ""}, {"pos": "noun (plural)", "uso": "\"Ejércitos\". Plural de army (y → ies).", "note": "army → armies.", "ex1": "Se imaginó dos ejércitos.", "ex2": ["The two armies fought.", "Los dos ejércitos pelearon."], "col": ""}, {"pos": "verb (-ing of rest)", "uso": "\"Descansando\".", "note": "rest = descansar.", "ex1": "Estaban descansando bajo un árbol.", "ex2": ["I'm resting after work.", "Estoy descansando después del trabajo."], "col": ""}, {"pos": "noun", "uso": "\"Carreta, carrito\". \"shopping cart\" = carrito del súper.", "note": "Countable.", "ex1": "Pasó una carreta llena de leones.", "ex2": ["Put it in the shopping cart.", "Ponlo en el carrito."], "col": "shopping cart"}, {"pos": "noun", "uso": "\"Amo, patrón\"; también \"maestro\" de un arte.", "note": "Also: master's degree = maestría.", "ex1": "Sancho seguía a su amo.", "ex2": ["The dog obeyed its master.", "El perro obedecía a su amo."], "col": ""}, {"pos": "verb (past of squeeze)", "uso": "\"Exprimió, apretó\".", "note": "squeeze an orange, squeeze someone's hand.", "ex1": "Exprimió el queso.", "ex2": ["She squeezed my hand.", "Me apretó la mano."], "col": ""}, {"pos": "noun / adjective", "uso": "\"Líquido\".", "note": "Opposite: solid.", "ex1": "Su vaso está lleno de líquido.", "ex2": ["Water is a liquid.", "El agua es un líquido."], "col": ""}, {"pos": "verb", "uso": "\"Gotear\": caer en gotas.", "note": "Noun: a drip = una gota.", "ex1": "La leche empezó a gotear.", "ex2": ["The faucet is dripping.", "La llave está goteando."], "col": ""}, {"pos": "noun", "uso": "\"Cerebro\".", "note": "Countable.", "ex1": "Pensó que su cerebro se derretía.", "ex2": ["Use your brain!", "¡Usa la cabeza!"], "col": ""}, {"pos": "verb (-ing of melt)", "uso": "\"Derritiéndose\".", "note": "melt = derretir(se).", "ex1": "El helado se está derritiendo.", "ex2": ["The snow is melting.", "La nieve se está derritiendo."], "col": ""}, {"pos": "noun", "uso": "\"Verdad\". \"tell the truth\" = decir la verdad (con tell, no say).", "note": "Use \"tell the truth.\"", "ex1": "Dime la verdad.", "ex2": ["To tell you the truth, I don't like it.", "La verdad, no me gusta."], "col": "tell the truth"}, {"pos": "expression", "uso": "\"Pasar la noche\" en un lugar.", "note": "spend - spent.", "ex1": "Pasamos la noche en el bosque.", "ex2": ["Can I spend the night at your house?", "¿Puedo quedarme a dormir en tu casa?"], "col": y experiences.", "can enjoy"], ["You should complete your diet.", "should complete"], ["It might cause high blood pressure.", "might cause"]]}, {"id": "today", "L": [10, 11, 12, 13, 14], "t": "Today con he / she / it (+s)", "es": "The city has… · Markets offer… (plural sin s)", "ex": [["Mexico City has a mild climate.", "has (it)"], ["The museum houses ancient art.", "houses (it)"], ["Street markets offer vegetables.", "offer (they)"], ["Bullfights take place on Sundays.", "take place (they)"]]}, {"id": "sy", "L": [13, 14], "t": "Super Yesterday: has / have + participio", "es": "Algo que ha pasado hasta hoy", "ex": [["Mexico has hosted two World Cups.", "ha sido sede de"], ["Downtown has become a main attraction.", "se ha convertido en"], ["Mexicans have combined tradition and innovation.", "han combinado"]]}, {"id": "super", "L": [10, 11, 12, 14], "t": "Superlatives: the -est / the most", "es": "Comparar 3 o más", "ex": [["one of the largest cities in the world", "large → the largest"], ["one of the oldest metropolises", "old → the oldest"], ["the most famous novel", "famous → the most famous"], ["the most influential works", "influential → the most influential"]]}, {"id": "food", "L": [15, 16, 17, 18, 19], "t": "Countable / Uncountable", "es": "How many (contables) · How much (incontables)", "ex": [["How many carrots do you eat?", "carrots, beans, nuts"], ["How much milk do you drink?", "milk, rice, fiber, sodium"], ["Too much sodium is bad.", "too much + incontable"], ["a few nuts / a little cheese", "a few / a little"]]}, {"id": "ing", "L": [16, 19], "t": "for / of + -ing", "es": "Después de preposición: verbo -ing", "ex": [["for building tissues", "para construir tejidos"], ["incapable of digesting milk", "incapaz de digerir leche"], ["good for healing wounds", "bueno para curar heridas"]]}, {"id": "confusing", "L": [17, 19], "t": "Palabras que confunden", "es": "lose / loose · found / find", "ex": [["Products lose their nutrients.", "lose = perder"], ["My shirt is loose.", "loose = flojo"], ["Protein is found in meat.", "found = se encuentra (participio de find)"], ["He found a helmet.", "found = encontró"]]}, {"id": "listen", "L": [4, 9, 14, 19, 20], "t": "Listening Practice: cómo escoger", "es": "Escucha las 4 ideas y elige la que describe la imagen", "ex": [["Who? → two men / a lady / the kids", "fíjate en quién aparece"], ["What are they doing? → is/are + -ing", "la acción de la imagen"], ["Where? → on the road / at the park", "el lugar"], ["Descarta lo que NO se ve", "si no está en la imagen, no es"]]}], "quiz": [{"L": 4, "s": "Those athletes are jumping the obstacles very quickly.", "o": ["running", "passing", "hurdling", "walking"], "a": 2, "es": "Esos atletas están saltando los obstáculos muy rápido."}, {"L": 4, "s": "Oh! You have a beautiful small baby.", "o": ["teeny", "curious", "big", "little"], "a": 3, "es": "¡Ay! Tienes un bebé pequeño y precioso."}, {"L": 4, "s": "After the joke, he couldn't laugh aloud, so he just chuckled softly.", "o": ["cried", "giggled", "shouted", "smiled"], "a": 1, "es": "Después del chiste no pudo reírse en voz alta, así que solo se rio bajito."}, {"L": 4, "s": "He can definitely throw that ball.", "o": ["hurl", "pass", "toss", "push"], "a": 0, "es": "Él definitivamente puede lanzar esa pelota."}, {"L": 4, "s": "I've been looking for my sweater all morning, but I can't find it.", "o": ["see", "discover", "hide", "locate"], "a": 3, "es": "Llevo toda la mañana buscando mi suéter, pero no lo encuentro."}, {"L": 4, "s": "If you want to reach the third floor, you have to go up the stairs.", "o": ["assume", "ascend", "scale", "descend"], "a": 1, "es": "Si quieres llegar al tercer piso, tienes que subir las escaleras."}, {"L": 4, "s": "The lawyer asked about all the things the thief took.", "o": ["told", "accused", "inquired", "surprised"], "a": 2, "es": "El abogado preguntó por todas las cosas que se llevó el ladrón."}, {"L": 4, "s": "It was his final treatment of the year.", "o": ["firs
